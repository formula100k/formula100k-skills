<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Terminal CRT</title>
<style>
  html,body{margin:0;background:#050302;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Estilo «Terminal CRT» · ingeniería inversa de lemo-opuscar/styles/ascii-crt (MIT, © 2026 LemoLab) · qué se tomó: todo es un carácter real en una retícula monoespaciada, un solo fósforo ámbar con brillo tenue/normal/fuerte y video inverso, el tamaño de letra como cámara (empuje), el registro que corre y frena, borrado duro con resplandor que se apaga (τ ≈ 0,1 s), una imagen hecha SOLO con las letras de una palabra elegidas por densidad, y el post de CRT suave (curvatura leve, barrido, vidrio redondeado, parpadeo de ~1 %).
// ====================== LO QUE PUEDES CAMBIAR ======================
const REGISTRO = [                                   // las líneas del registro que corre al principio (cortas, sin cifras inventadas)
  '[ok] foto de perfil', '[ok] nombre de la cuenta', '[ok] enlace en la bio', '[..] leyendo descripción',
  '[ok] publicaciones fijadas', '[..] buscando la oferta', '[??] a quién ayudas', '[..] buscando el resultado',
];
const ERROR = '[ERROR] TU BIO NO DICE QUÉ VENDES';  // donde frena el registro (máx. ~34 caracteres)
const TITULO = 'TU BIO';                             // el título enorme (máx. ~10 caracteres)
const SUBTITULO = 'no vende sola';                   // debajo, chico (máx. ~30)
const PALABRA_IMAGEN = 'VENDE';                      // la imagen se arma SOLO con estas letras
const ARREGLO = 'arréglalo:';                        // la línea final, chica…
const CLAVE = 'DI QUÉ VENDES';                       // …y la clave, en el único segundo color (máx. ~16)
const COLORES = {
  vidrio: '#0b0704',      // vidrio apagado (casi negro cálido)
  tenue: '#7a3e0a', normal: '#ffb000', fuerte: '#ffd88a',   // la rampa del fósforo ámbar
  segundo: '#cfeaff',     // el ÚNICO segundo color (blanco azulado), se prende una sola vez
};
const LETRA = 'Menlo, "Courier New", monospace';
// ===================================================================
const W = 1080, H = 1920, FPS = 30, DUR = 8;
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/cine-grafica.js"></script>
<script>
const AV = .602;                                          // avance de Menlo en em: celda = .6 em × 1,2 em (1:2)
const [SRC, sg] = lienzo();
const T_FRENA = 1.0, T_EMPUJE = [1.05, 1.75], T_BORRA = 2.1, T_TIT = 2.2, T_IMG = [3.4, 4.3], T_ARR = 5.0;
const M = 90;                                             // margen dentro de la curvatura del vidrio

function celda(cw) { return { cw, ch: cw * 2, font: (p = 400) => `${p} ${cw / AV}px ${LETRA}` }; }
// un renglón de texto sobre la retícula: cada carácter en su celda (nunca fuera de la retícula)
function renglon(str, col, fila, C, x0, y0, color, o = {}) {
  sg.save(); sg.font = C.font(o.peso || 400); sg.textBaseline = 'middle'; sg.globalAlpha = o.alfa ?? 1;
  if (o.inverso) { sg.fillStyle = color; sg.fillRect(x0 + col * C.cw, y0 + fila * C.ch, str.length * C.cw, C.ch); sg.fillStyle = COLORES.vidrio; }
  else sg.fillStyle = color;
  [...str].forEach((c, i) => sg.fillText(c, x0 + (col + i) * C.cw, y0 + (fila + .5) * C.ch));
  sg.restore();
}
const tecleo = (t, t0, str, cps) => str.slice(0, Math.max(0, Math.floor((t - t0) * cps)));
function cursor(t, x, y, C, color) { if (Math.floor(t * 2.2) % 2 === 0) { sg.fillStyle = color; sg.fillRect(x, y + C.ch * .12, C.cw, C.ch * .76); } }

// ---------- escena 1: el registro corre a toda velocidad y frena seco en el error; luego la letra crece (empuje) ----------
const BUF = (() => { const out = []; for (let k = 0; k < 9; k++) REGISTRO.forEach((l, i) => out.push(`00:0${k}:${String(i * 7).padStart(2, '0')} ${l}`)); out.push(ERROR); return out; })();
function escena1(t, alfa = 1) {
  const empuje = ease(prog(t, ...T_EMPUJE));
  const cwFin = Math.min(27, (W - 2 * M) / ERROR.length), C = celda(lerp(15, cwFin, empuje));
  const filasVisibles = Math.ceil(H / C.ch) + 2, centro = H * .45;
  // filas corridas: rápido y frenando, siempre de a una fila entera (salta de celda en celda)
  const A0 = Math.min(34, BUF.length - 1), avance = Math.floor(A0 + (BUF.length - 1 - A0) * (1 - Math.pow(1 - clamp(t / T_FRENA), 2.2)));   // arranca a mitad del registro: el cuadro 0 ya está lleno
  const yErr = centro - C.ch / 2, x0 = (W - ERROR.length * C.cw) / 2 * empuje + M * (1 - empuje);
  for (let d = -filasVisibles; d <= filasVisibles; d++) { const k = avance + d; if (k < 0 || k >= BUF.length) continue;
    const y = yErr + d * C.ch; if (y < -C.ch || y > H) continue;
    const esErr = k === BUF.length - 1 && avance === BUF.length - 1, linea = BUF[k];
    const col = linea.startsWith('[??]', 9) || linea.includes('[??]') ? COLORES.fuerte : COLORES.normal;
    renglon(linea, 0, 0, C, x0, y, esErr ? COLORES.fuerte : col, { inverso: esErr, peso: esErr ? 700 : 400, alfa: alfa * (esErr ? 1 : lerp(1, .06, empuje)) }); }
  // línea de estado arriba
  renglon('BIO.SCAN  ·  diagnóstico', 0, 0, celda(15), M, 270, COLORES.tenue, { alfa: alfa * (1 - empuje) });
}

// ---------- escena 2: título enorme + subtítulo chico (dos retículas), luego la imagen hecha de letras ----------
const CT = celda(Math.min(96, (W - 2 * M) / Math.max(4, TITULO.length))), CS = celda(26);
const CI = celda(12), IMG_COLS = Math.floor((W - 2 * M) / CI.cw), IMG_FILAS = 26, IMG_Y = 610;
const RAMPA = rampaDensidad(PALABRA_IMAGEN + '.:', CI.font(700), CI.cw, CI.ch);
// el negativo (gris por celda, una vez): una bolsa de compras con su asa, luz desde la izquierda y borde claro
const CELDAS = (() => { const out = [];
  for (let j = 0; j < IMG_FILAS; j++) for (let i = 0; i < IMG_COLS; i++) {
    const x = (i + .5) / IMG_COLS, y = (j + .5) / IMG_FILAS; let L = 0;
    const cx = .5, ancho = lerp(.30, .36, clamp((y - .32) / .68));                  // cuerpo: trapecio que se abre hacia abajo
    if (y > .32 && y < .97 && Math.abs(x - cx) < ancho) {
      const u = (x - (cx - ancho)) / (2 * ancho); L = lerp(.95, .38, u) + (vnoise(i * .3, j * .3) - .5) * .1;
      if (u > .78) L *= .55;                                                         // la cara de costado, más oscura
      if (Math.abs(x - (cx - ancho)) < .012 || y < .345) L = 1;                       // borde claro que separa los planos
    }
    const dx = (x - cx) * 1.9, dy = (y - .34) / .55, r = Math.hypot(dx, dy);           // el asa: un arco
    if (y < .34 && r > .27 && r < .34) L = Math.max(L, .82);
    out.push({ i, j, L: Math.pow(clamp(L), 1.25) }); }
  return out; })();
function escena2(t) {
  const tit = tecleo(t, T_TIT, TITULO, 9), xT = (W - TITULO.length * CT.cw) / 2;
  renglon(tit, 0, 0, CT, xT, 300, COLORES.fuerte, { peso: 700 });
  if (tit.length < TITULO.length) cursor(t, xT + tit.length * CT.cw, 300, CT, COLORES.fuerte);
  const tS = T_TIT + TITULO.length / 9 + .15, sub = tecleo(t, tS, '> ' + SUBTITULO, 30), xS = (W - ('> ' + SUBTITULO).length * CS.cw) / 2;
  renglon(sub, 0, 0, CS, xS, 300 + CT.ch + 16, COLORES.normal);
  // la imagen: se imprime de arriba abajo, fila por fila, con caracteres de la palabra elegidos por densidad
  const filas = Math.floor(IMG_FILAS * prog(t, ...T_IMG)), x0 = (W - IMG_COLS * CI.cw) / 2;
  if (filas > 0) { sg.save(); sg.font = CI.font(700); sg.textBaseline = 'middle';
    for (const c of CELDAS) { if (c.j >= filas || c.L < .08) continue; const lv = elegirNivel(RAMPA, c.L, c.i, c.j); if (lv.ch === ' ') continue;
      sg.fillStyle = lv.a > .9 ? COLORES.fuerte : lv.a > .6 ? COLORES.normal : COLORES.tenue; sg.fillText(lv.ch, x0 + c.i * CI.cw, IMG_Y + (c.j + .5) * CI.ch); }
    sg.restore(); }
  // el arreglo: tecleo humano (desparejo) y la clave en el ÚNICO segundo color
  const yA = IMG_Y + IMG_FILAS * CI.ch + 40, CA = celda(24), CK = celda(Math.min(56, (W - 2 * M) / CLAVE.length));
  const a = tecleo(t, T_ARR, '> ' + ARREGLO, 26); renglon(a, 0, 0, CA, M, yA, COLORES.normal);
  const tK = T_ARR + ('> ' + ARREGLO).length / 26 + .3;
  const ritmo = s => { let n = 0, acc = tK; for (let i = 0; i < CLAVE.length; i++) { acc += .06 + hash2(i, 5) * .09 + (CLAVE[i] === ' ' ? .18 : 0); if (s >= acc) n = i + 1; } return n; };
  const k = CLAVE.slice(0, ritmo(t)), yK = yA + CA.ch + 10;
  renglon(k, 0, 0, CK, M, yK, COLORES.segundo, { peso: 700 });
  if (t > tK - .3) cursor(t, M + k.length * CK.cw, yK, CK, k.length ? COLORES.segundo : COLORES.normal);
}

arrancar(frame => {
  const t = frame / FPS;
  sg.setTransform(1, 0, 0, 1, 0, 0); sg.globalAlpha = 1; sg.fillStyle = COLORES.vidrio; sg.fillRect(0, 0, W, H);
  if (t < T_BORRA) escena1(t);
  else { const resto = Math.exp(-(t - T_BORRA) / .1); if (resto > .02) escena1(T_BORRA, resto);   // resplandor que se apaga tras el borrado duro
    escena2(t); }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  postCRT(SRC, t, { curva: .03, barrido: .1, parpadeo: .01 });
});
window.SONIDOS = [{ t: 0, tipo: 'ambiente' }, { t: T_FRENA, tipo: 'golpe' }, { t: T_EMPUJE[0], tipo: 'desliz' }, { t: T_BORRA, tipo: 'golpe' },
  ...[...TITULO].map((_, i) => ({ t: +(T_TIT + i / 9).toFixed(2), tipo: 'pop' })), { t: T_IMG[0], tipo: 'desliz' }, { t: T_ARR, tipo: 'pop' }];
</script>
</body>
</html>
