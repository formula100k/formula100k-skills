<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plano técnico</title>
<style>
  html,body{margin:0;background:#0D1116;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Estilo «Plano técnico» · ingeniería inversa de lemo-opuscar/styles/blueprint (MIT, © 2026 LemoLab) · qué se tomó: hoja de cianotipo procedural sobre mesa oscura, línea blanca en orden de dibujante (ejes → contornos → rayado → cotas → globos → rótulos), ancho de línea = ancho × zoom^0,65, rótulos a mano escritos de izquierda a derecha con pluma, cuadro de rótulo con estado y el sello de un solo color que da el veredicto.
// ====================== LO QUE PUEDES CAMBIAR ======================
const TITULO_CHICO = 'plano de un reel';          // cabecera de la hoja, renglón chico
const TITULO_GRANDE = 'que vende';                // cabecera, renglón grande (la clave)
const PARTES = ['gancho', 'historia', 'CTA'];     // 3 partes del objeto, de arriba abajo (máx. ~10 letras c/u)
const COTA = 'tu reel';                           // lo que mide la cota vertical (SOLO cifras del guion si pones números)
const NOTAS = ['el gancho va primero', 'un solo CTA, claro'];   // 1 o 2 notas generales (máx. ~24 letras c/u)
const SELLO = 'APROBADO';                         // el veredicto ('' = sin sello)
const COLORES = {
  azul1: '#18336B', azul2: '#2A58A6',             // la hoja (cianotipo)
  linea: '#E7F0F9',                               // la línea blanca (varía en peso, nunca en tono)
  mesa: '#0D1116',                                // la mesa de dibujo
  sello: '#C8302A',                               // el único color que no es azul, usado UNA vez
};
const LETRA_PLANO = '"Noteworthy", "Bradley Hand", "Marker Felt", cursive';
const LETRA_TEC = '"Gill Sans", "Avenir Next Condensed", "Avenir Next", sans-serif';
// ===================================================================
const W = 1080, H = 1920, FPS = 30, DUR = 8;
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/cine-grafica.js"></script>
<script>
const HOJA = { x: 40, y: 110, w: 1000, h: 1700 };        // en pantalla con zoom 1
const PAPEL = hojaCianotipo(HOJA.w, HOJA.h, { azul1: COLORES.azul1, azul2: COLORES.azul2, semilla: 9, pliegues: [[.5, 0], [0, .38], [0, .76]] });
const MESA = (() => { const [c, g] = lienzo(), r = rng(3); g.fillStyle = COLORES.mesa; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 40000; i++) { g.fillStyle = r() < .5 ? 'rgba(255,255,255,.025)' : 'rgba(0,0,0,.2)'; g.fillRect(r() * W, r() * H, 1 + r() * 2, 1); }
  for (let y = 0; y < H; y += 3) { g.fillStyle = `rgba(255,255,255,${.008 + hash2(y, 1) * .01})`; g.fillRect(0, y, W, 1); }
  return c; })();
const FOCO = { x: 540, y: 860 };
const zoomEn = t => lerp(.74, 1, ease(prog(t, .15, 1.3)));     // el golpe: de la hoja entera sobre la mesa a la figura
let Z = 1; const LW = w => w * Math.pow(Z, -.35);              // ancho en pantalla = ancho de hoja × zoom^0,65
const L = (pts, p, o = {}) => lineaPlano(pts, { w: LW(o.w || 3.2), col: COLORES.linea, parte: p, patron: o.patron, pluma: true, alfa: o.alfa ?? .95, cerrado: o.cerrado });

// ---------- texto a mano: se escribe de izquierda a derecha con la pluma brillando en la punta ----------
function escribir(txt, font, x, y, p, o = {}) {
  if (p <= 0) return; const w = medirT(txt, font), size = parseFloat(font.match(/([\d.]+)px/)[1]);
  ctx.save(); ctx.beginPath(); ctx.rect(x - 4, y - size * 1.2, (w + 8) * clamp(p), size * 1.6); ctx.clip();
  ctx.font = font; ctx.fillStyle = COLORES.linea; ctx.textAlign = 'left'; ctx.fillText(txt, x, y); ctx.restore();
  if (p < 1) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x + w * p, y - size * .3, LW(4), 0, 7); ctx.fill(); }
}
const tEscribe = (t, t0, txt, cps = 22) => prog(t, t0, t0 + Math.max(.25, txt.length / cps));

// ---------- geometría en coordenadas de hoja (0..1000 × 0..1700) ----------
const TEL = { x: 360, y: 470, w: 280, h: 630, r: 40 }, PAN = { x: 382, y: 530, w: 236, h: 510 };
const Z1 = PAN.y + 120, Z2 = PAN.y + 370;
const CAB = maquetar([
  { t: TITULO_CHICO.toUpperCase(), tam: 58, fam: LETRA_PLANO, peso: 400, col: COLORES.linea },
  { t: TITULO_GRANDE.toUpperCase(), tam: 150, fam: LETRA_PLANO, peso: 700, col: COLORES.linea, nueva: true },
], { x: 80, y: 150, w: 840, h: 270 }, { interlinea: 1.24 });
const RENG_CAB = (() => { const rs = {}; for (const p of CAB.palabras) { const k = p.y.toFixed(0); (rs[k] = rs[k] || []).push(p); }
  return Object.values(rs).map(ps => ({ txt: ps.map(p => p.txt).join(' '), x: ps[0].x, y: ps[0].y, font: ps[0].font })); })();
const ZONAS = [[PAN.y, Z1], [Z1, Z2], [Z2, PAN.y + PAN.h]].map(([a, b], i) => ({ y: (a + b) / 2, a, b, txt: (PARTES[i] || '').toUpperCase() }));
const F_ROT = (() => { for (let s = 52; s > 24; s -= 2) { const f = `700 ${s}px ${LETRA_PLANO}`; if (ZONAS.every(z => medirT(z.txt, f) < 175)) return f; } return `700 24px ${LETRA_PLANO}`; })();
const T = { ejes: .25, tel: .55, cab: 1.15, rayado: 1.9, cota: 2.5, globo: i => 3.0 + i * .55, fig: 4.7, notas: 5.0, bloque: 5.4, sello: 6.3 };

function dibujoTecnico(t) {
  // 1 · ejes (larga-corta), cruzan la figura
  L([[500, 440], [500, 1140]], prog(t, T.ejes, T.ejes + .35), { w: 1.25, patron: 'eje' });
  L([[300, 785], [700, 785]], prog(t, T.ejes + .1, T.ejes + .4), { w: 1.25, patron: 'eje' });
  // 2 · contornos: el teléfono, la pantalla, el botón y el parlante
  L(roundRect(TEL.x, TEL.y, TEL.w, TEL.h, TEL.r), prog(t, T.tel, T.tel + .7), { w: 3.2, cerrado: true });
  L(rect(PAN.x, PAN.y, PAN.w, PAN.h), prog(t, T.tel + .45, T.tel + .9), { w: 2, cerrado: true });
  L(roundRect(470, 494, 60, 12, 6), prog(t, T.tel + .8, T.tel + 1), { w: 2, cerrado: true });
  L(circle(500, 1072, 14), prog(t, T.tel + .85, T.tel + 1.05), { w: 2, cerrado: true });
  // 3 · detalle y rayado: zona 1 en corte, zona 2 con renglones, zona 3 con el botón
  L([[PAN.x, Z1], [PAN.x + PAN.w, Z1]], prog(t, T.rayado, T.rayado + .2), { w: 2 });
  L([[PAN.x, Z2], [PAN.x + PAN.w, Z2]], prog(t, T.rayado + .1, T.rayado + .3), { w: 2 });
  if (t > T.rayado) rayado([[PAN.x, PAN.y], [PAN.x + PAN.w, PAN.y], [PAN.x + PAN.w, Z1], [PAN.x, Z1]], { sep: 13, w: LW(1.25), col: COLORES.linea, parte: prog(t, T.rayado, T.rayado + .5), alfa: .7 });
  for (let k = 0; k < 6; k++) { const y = Z1 + 38 + k * 36, w = k % 3 === 2 ? 120 : 190;
    L([[PAN.x + 22, y], [PAN.x + 22 + w, y]], prog(t, T.rayado + .2 + k * .06, T.rayado + .35 + k * .06), { w: 1.25, patron: k % 2 ? 'oculta' : null }); }
  L(roundRect(PAN.x + 38, Z2 + 34, PAN.w - 76, 64, 32), prog(t, T.rayado + .5, T.rayado + .8), { w: 2, cerrado: true });
  // 4 · cota vertical con flechas y su rótulo
  const pc = prog(t, T.cota, T.cota + .45);
  L([[300, TEL.y], [300, TEL.y + TEL.h]], pc, { w: 1.25 });
  L([[285, TEL.y], [350, TEL.y]], pc, { w: .9 }); L([[285, TEL.y + TEL.h], [350, TEL.y + TEL.h]], pc, { w: .9 });
  if (pc >= 1) { for (const [y, s] of [[TEL.y, 1], [TEL.y + TEL.h, -1]]) { ctx.fillStyle = COLORES.linea; ctx.beginPath(); ctx.moveTo(300, y); ctx.lineTo(292, y + s * 22); ctx.lineTo(308, y + s * 22); ctx.fill(); }
    ctx.save(); ctx.translate(276, TEL.y + TEL.h / 2); ctx.rotate(-Math.PI / 2); const f = `400 34px ${LETRA_PLANO}`;
    escribir(COTA.toUpperCase(), f, -medirT(COTA.toUpperCase(), f) / 2, 0, tEscribe(t, T.cota + .45, COTA)); ctx.restore(); }
  // 5 · globos numerados con su línea de referencia, y 6 · rótulos
  ZONAS.forEach((z, i) => { if (!z.txt) return; const t0 = T.globo(i);
    ctx.fillStyle = COLORES.linea; if (t > t0) { ctx.beginPath(); ctx.arc(PAN.x + PAN.w - 30, z.y, LW(4.5), 0, 7); ctx.fill(); }
    L([[PAN.x + PAN.w - 30, z.y], [712, z.y]], prog(t, t0, t0 + .2), { w: .9 });
    L(circle(738, z.y, 26), prog(t, t0 + .15, t0 + .35), { w: 2, cerrado: true });
    if (t > t0 + .3) { ctx.font = `700 30px ${LETRA_TEC}`; ctx.fillStyle = COLORES.linea; ctx.textAlign = 'center'; ctx.fillText(String(i + 1), 738, z.y + 10); ctx.textAlign = 'left'; }
    escribir(z.txt, F_ROT, 776, z.y + 16, tEscribe(t, t0 + .35, z.txt)); });
  escribir('FIG. 1 · VISTA DE FRENTE', `400 30px ${LETRA_TEC}`, 360, 1158, tEscribe(t, T.fig, 'FIG. 1 · VISTA DE FRENTE', 40));
}
function cabecera(t) {
  let t0 = T.cab; for (const r of RENG_CAB) { escribir(r.txt, r.font, r.x, r.y, tEscribe(t, t0, r.txt, 20)); t0 += Math.max(.25, r.txt.length / 20) + .05; }
  L([[80, 432], [920, 432]], prog(t, t0, t0 + .3), { w: 2 });
}
function margenYBloque(t) {
  ctx.save(); ctx.strokeStyle = COLORES.linea; ctx.globalAlpha = .9;
  ctx.lineWidth = LW(3.2); ctx.strokeRect(30, 30, HOJA.w - 60, HOJA.h - 60); ctx.lineWidth = LW(1); ctx.strokeRect(44, 44, HOJA.w - 88, HOJA.h - 88);
  for (let x = 44; x < HOJA.w - 44; x += 100) { ctx.beginPath(); ctx.moveTo(x, 30); ctx.lineTo(x, 44); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, HOJA.h - 44); ctx.lineTo(x, HOJA.h - 30); ctx.stroke(); }
  // cuadro de rótulo (ya está en la hoja desde el cuadro 0; sus campos se llenan al final)
  const B = { x: 540, y: 1200, w: 400, h: 150 }; ctx.lineWidth = LW(2); ctx.strokeRect(B.x, B.y, B.w, B.h);
  ctx.lineWidth = LW(1); ctx.beginPath(); ctx.moveTo(B.x, B.y + 50); ctx.lineTo(B.x + B.w, B.y + 50); ctx.moveTo(B.x + 140, B.y); ctx.lineTo(B.x + 140, B.y + B.h); ctx.stroke();
  ctx.restore();
  ctx.font = `600 22px ${LETRA_TEC}`; ctx.fillStyle = COLORES.linea; ctx.fillText('PROYECTO', B.x + 12, B.y + 33); ctx.fillText('ESTADO', B.x + 12, B.y + 108);
  escribir(TITULO_CHICO.toUpperCase(), `400 26px ${LETRA_PLANO}`, B.x + 156, B.y + 35, tEscribe(t, T.bloque, TITULO_CHICO, 30));
  // notas generales
  ctx.font = `600 22px ${LETRA_TEC}`; ctx.fillText('NOTAS GENERALES', 80, 1222);
  NOTAS.slice(0, 2).forEach((n, i) => { const aj = autoajuste((i + 1) + '. ' + n.toUpperCase(), LETRA_PLANO, 400, 420, 1, 30, 18);
    escribir((i + 1) + '. ' + n.toUpperCase(), aj.font, 80, 1270 + i * 46, tEscribe(t, T.notas + i * .5, n, 30)); });
  return B;
}
// ---------- el sello: tinta roja con poros, cae seco sobre el campo ESTADO ----------
const SELLO_TEX = SELLO ? (() => { const [c, g] = lienzo(470, 150), r = rng(77); g.strokeStyle = g.fillStyle = COLORES.sello;
  g.lineWidth = 7; g.strokeRect(8, 8, 454, 134); g.lineWidth = 2.5; g.strokeRect(20, 20, 430, 110);
  let s = 84; g.font = `900 ${s}px Rockwell, "Avenir Next Condensed", Impact, sans-serif`; while (g.measureText(SELLO).width > 400 && s > 30) { s -= 2; g.font = `900 ${s}px Rockwell, "Avenir Next Condensed", Impact, sans-serif`; }
  g.textAlign = 'center'; g.fillText(SELLO, 235, 75 + s * .34);
  g.globalCompositeOperation = 'destination-out'; for (let i = 0; i < 2600; i++) { g.globalAlpha = .3 + r() * .7; g.fillRect(r() * 470, r() * 150, 1 + r() * 3, 1 + r() * 2); }
  for (let i = 0; i < 14; i++) { g.globalAlpha = .5; g.fillRect(0, r() * 150, 470, 1 + r() * 2); }
  return c; })() : null;
function sello(t, B) {
  if (!SELLO_TEX || t < T.sello) return;
  ctx.save(); ctx.translate(B.x + B.w * .62, B.y + 104); ctx.rotate(-.14); ctx.globalAlpha = .9; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(SELLO_TEX, -235 * .62, -75 * .62, 470 * .62, 150 * .62); ctx.restore();
}

arrancar(frame => {
  const t = frame / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(MESA, 0, 0);
  Z = zoomEn(t);
  const sx = FOCO.x + (HOJA.x - FOCO.x) * Z, sy = FOCO.y + (HOJA.y - FOCO.y) * Z;
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18; ctx.fillStyle = '#000';
  ctx.fillRect(sx, sy, HOJA.w * Z, HOJA.h * Z); ctx.restore();
  ctx.setTransform(Z, 0, 0, Z, sx, sy);                                  // la cámara: hoja → pantalla
  ctx.drawImage(PAPEL, 0, 0);
  const B = margenYBloque(t);
  dibujoTecnico(t);
  cabecera(t);
  sello(t, B);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
});
window.SONIDOS = [{ t: .15, tipo: 'desliz' }, { t: .25, tipo: 'swish' }, { t: .55, tipo: 'papel' }, { t: 1.15, tipo: 'papel' },
  { t: 1.9, tipo: 'papel' }, { t: 2.5, tipo: 'desliz' }, ...ZONAS.map((_, i) => ({ t: +T.globo(i).toFixed(2), tipo: 'pop' })),
  { t: 4.7, tipo: 'papel' }, { t: T.sello, tipo: 'golpe' }];
</script>
</body>
</html>
