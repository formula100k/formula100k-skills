<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sinfonía en time-lapse</title>
<style>
  html,body{margin:0;background:#000;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Estilo «Sinfonía en time-lapse» · ingeniería inversa de lemo-opuscar/styles/city-symphony (MIT, © 2026 LemoLab) · qué se tomó: cortes que caen en el pulso (120 BPM: 1 pulso = 15 cuadros) y se adensan con la partitura, ríos de luz por mezcla de cuadros (estelas largas de faros y luces traseras), empuje que cae sobre la foto de apertura, número que se traba dígito a dígito con regla sodio, rejilla 1×2 → 2×2 → 3×3 que se enciende en desorden, parpadeo día/noche, el freno (todo se detiene, el anillo del día se congela), el corte seco a negro y la cita final sobre la última toma.
// ====================== LO QUE PUEDES CAMBIAR ======================
const NUMERO = '365';                              // el número que se traba dígito a dígito (≤ 7 cifras). SOLO cifras del guion
const NUMERO_QUE = 'publicaciones en un año';      // qué cuenta (≤ 28 letras)
const NUMERO_FUENTE = 'TU CALENDARIO · 2026';      // de dónde sale, en mayúsculas chicas (≤ 24 letras)
const CITA = 'tu contenido trabaja mientras duermes';   // la frase del final (≤ 44 letras)
const CITA_FUENTE = 'FÓRMULA DE LA CASA';      // línea chica bajo la cita (≤ 24 letras)
const CIUDAD_DIBUJADA = true;                      // true = la toma «reloj» es una ciudad dibujada con ríos de luz
const FOTOS = [];   // 2 a 4 fotos tuyas (tu escritorio, tu producto, tu local…). Vacío = reemplazos neutros
const COLORES = {
  texto: '#EDE8DF', gris: '#B0AAA0',
  sodio: '#D9772F',    // el único acento: reglas bajo los números, la aguja del anillo del día
};
// ===================================================================

const W = 1080, H = 1920, FPS = 30, DUR = 8.5;
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/cine-montaje.js"></script>
<script>
const C = COLORES;
const F_NUM = '"Futura", "Avenir Next", sans-serif';
const F_TXT = '"Avenir Next", "Helvetica Neue", sans-serif';
const PULSO = .5, SEMI = PULSO / 4;                  // 120 BPM
const MATE = 110;                                    // franjas negras arriba y abajo (copia de estreno)
let FOT = [], CIU = null, CIU_DIA = null, BLOOM = null;
material(FOTOS, ['escritorio', 'producto', 'perfil']).then(ims => {
  FOT = ims.map(im => gradear(im, 'cine'));
  const base = ciudadNoche();
  CIU = gradear(base, 'cine', { filtro: 'contrast(1.1) saturate(0.9)' });
  CIU_DIA = gradear(base, 'cine', { filtro: 'brightness(2.4) contrast(0.85) saturate(0.55) sepia(0.25)' });
  const [b, p] = lienzo(270, 480); p.filter = 'blur(6px)'; p.drawImage(CIU, 0, 0, 270, 480); BLOOM = b;   // brillo de las luces (1/4 de tamaño)
});
const texto = (s, x, y, font, col, al = 'left', ls = 0) => { ctx.save(); ctx.font = font; ctx.fillStyle = col; ctx.textAlign = al; ctx.letterSpacing = ls + 'px'; ctx.fillText(s, x, y); ctx.restore(); };
// tiempos en compases (todo cae en el pulso)
const T = { numero: 1.0, rejilla: 3.0, freno: 5.0, corte: 6.5, coda: 6.75 };

// ---------- ríos de luz: estelas de faros por mezcla de cuadros ----------
// la toma reloj dibujada (si FOTOS no trae una): skyline con ventanas encendidas arriba y un nudo de autopistas abajo
function ciudadNoche() {
  const [c, p] = lienzo(W, H), r = rng(404);
  const g = p.createLinearGradient(0, 0, 0, H * .5); g.addColorStop(0, '#0a1020'); g.addColorStop(.7, '#2a3550'); g.addColorStop(1, '#4a3a3a'); p.fillStyle = g; p.fillRect(0, 0, W, H);
  for (let capa = 0; capa < 3; capa++) { let x = -30; const base = H * (.42 + capa * .05);
    while (x < W + 30) { const bw = 60 + r() * 110, bh = 160 + r() * (520 - capa * 120); p.fillStyle = ['#151b29', '#10151f', '#0b0f16'][capa]; p.fillRect(x, base - bh, bw, H);
      for (let yy = base - bh + 16; yy < base + 40; yy += 24) for (let xx = x + 8; xx < x + bw - 10; xx += 17) if (r() < .38 - capa * .06) { p.fillStyle = `rgba(255,${185 + r() * 50 | 0},${110 + r() * 70 | 0},${.45 + r() * .5})`; p.fillRect(xx, yy, 8, 11); }
      x += bw + 3; } }
  p.fillStyle = '#07090c'; p.fillRect(0, H * .55, W, H);
  p.strokeStyle = 'rgba(60,66,80,.22)'; CALLES.forEach(cc => { p.lineWidth = 40; p.beginPath(); for (let k = 0; k <= 30; k++) { const q = bez(cc, k / 30); k ? p.lineTo(...q) : p.moveTo(...q); } p.stroke(); });
  for (let i = 0; i < 40; i++) { p.fillStyle = 'rgba(255,190,120,.5)'; p.beginPath(); p.arc(r() * W, H * .56 + r() * H * .44, 3, 0, 7); p.fill(); }   // farolas
  return c;
}
const CALLES = Array.from({ length: 8 }, (_, i) => { const y = 1080 + i * 95, d = i % 2 ? -1 : 1, a = (hash2(i, 1) - .5) * 260;
  return d > 0 ? [[-120, y + 120], [360, y - 60 + a], [720, y + 80 - a], [1200, y - 40]] : [[1200, y + 100], [720, y - 40 + a], [360, y + 90 - a], [-120, y - 30]]; });
function bez(c, s) { const [a, b, d, e] = c, u = 1 - s; return [0, 1].map(k => u * u * u * a[k] + 3 * u * u * s * b[k] + 3 * u * s * s * d[k] + s * s * s * e[k]); }
function rios(t, vel = 1, x0 = 0, y0 = 0, esc = 1) {
  ctx.save(); ctx.translate(x0, y0); ctx.scale(esc, esc); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
  CALLES.forEach((c, ci) => { const roja = ci % 2 === 1;
    for (let i = 0; i < 34; i++) { const s0 = (hash2(i, ci) + t * vel * (.35 + hash2(ci, i) * .2)) % 1, largo = .1 + hash2(i + 9, ci) * .12;
      ctx.strokeStyle = roja ? 'rgba(255,70,50,.75)' : 'rgba(255,236,200,.85)'; ctx.lineWidth = 4 + hash2(i, 4) * 4;
      ctx.beginPath(); for (let k = 0; k <= 10; k++) { const p = bez(c, clamp(s0 - largo + largo * k / 10)); k ? ctx.lineTo(...p) : ctx.moveTo(...p); } ctx.stroke(); } });
  ctx.restore();
}
function plano(tipo, x, y, w, h, t, zoom = 1) {      // un plano dentro de un rectángulo: 'ciudad', 'dia', o el número de foto
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  if (tipo === 'ciudad' || tipo === 'dia') {
    const im = tipo === 'dia' ? CIU_DIA : CIU, e = Math.max(w / W, h / H) * zoom;
    ctx.translate(x + w / 2, y + h / 2); ctx.scale(e, e); ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(im, 0, 0, W, H); if (tipo === 'ciudad') { rios(t); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = .18; ctx.drawImage(BLOOM, 0, 0, W, H); }
  } else cubrir(FOT[tipo % FOT.length], x, y, w, h, .5, .45, zoom);
  ctx.restore();
}
const pantalla = (tipo, t, z) => plano(tipo, 0, 0, W, H, t, z);

// ---------- número que se traba dígito a dígito (uno por semicorchea), regla sodio que crece ----------
function numero(t, t0) {
  if (t < t0) return; const ds = [...NUMERO], f = `500 170px ${F_NUM}`, x = SEGURA.left, y = 1180;
  const g = ctx.createRadialGradient(x + 300, y - 40, 50, x + 300, y - 40, 600); g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, y - 500, W, 800);
  const s = ds.map((d, i) => /\d/.test(d) && t < t0 + (i + 1) * SEMI ? String(Math.floor(hash2(Math.floor(t * 30), i) * 10)) : d).join('');
  const w = digitosFijos(s, x, y, f, C.texto);
  ctx.fillStyle = C.sodio; ctx.fillRect(x, y + 34, w * easeOut(prog(t, t0 + .2, t0 + .8)), 4);
  if (t > t0 + ds.length * SEMI + .1) { texto(NUMERO_QUE, x, y + 110, `400 52px ${F_TXT}`, C.texto, 'left', 3); texto(NUMERO_FUENTE, x, y + 160, `500 26px ${F_TXT}`, C.gris, 'left', 7); }
}
// ---------- anillo del día: corre con el día de la película, se congela en el freno y se apaga ----------
function anillo(t) {
  const cx = SEGURA.right - 80, cy = 1380, r = 62, congelado = t >= T.freno && t < T.corte, apagado = congelado ? .4 : 1;
  const hora = (t < T.freno ? t : T.freno) / T.freno * Math.PI * 2 * .9 + (t >= T.corte ? (t - T.corte) * .6 : 0);
  ctx.save(); ctx.globalAlpha = apagado * .85; ctx.strokeStyle = C.gris; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
  for (let i = 0; i < 24; i++) { const a = i / 24 * Math.PI * 2; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r * (i % 6 ? .9 : .8), cy + Math.sin(a) * r * (i % 6 ? .9 : .8)); ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.stroke(); }
  ctx.strokeStyle = C.sodio; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, r + 10, hora - Math.PI / 2 - .78, hora - Math.PI / 2); ctx.stroke();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(hora - Math.PI / 2) * r * .85, cy + Math.sin(hora - Math.PI / 2) * r * .85); ctx.stroke();
  ctx.restore();
}
// ---------- rejilla: 1×2 → 2×2 → 3×3, las celdas nuevas se encienden en desorden en 0,3 s ----------
const ETAPAS = [[T.rejilla, 1, 2], [T.rejilla + .5, 2, 2], [T.rejilla + 1.0, 3, 3]];
function rejilla(t) {
  let et = ETAPAS[0]; for (const e of ETAPAS) if (t >= e[0]) et = e;
  const [t0, cols, filas] = et, gap = 6, cw = (W - gap * (cols - 1)) / cols, ch = (H - 2 * MATE - gap * (filas - 1)) / filas, n = cols * filas;
  const tipos = (CIUDAD_DIBUJADA ? ['ciudad', 'dia'] : []).concat(FOT.map((_, i) => i));
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < n; i++) {
    const enciende = t0 + hash2(i, n) * .3, recorte = t > T.freno - PULSO ? Math.floor((t - (T.freno - PULSO)) / SEMI) : 0;   // último pulso: re-corte cada semicorchea
    if (t < enciende && i >= (et === ETAPAS[0] ? 0 : ETAPAS[ETAPAS.indexOf(et) - 1][1] * ETAPAS[ETAPAS.indexOf(et) - 1][2])) continue;
    let tipo = tipos[(i + recorte * 3) % tipos.length];
    if (tipo === 'dia' && Math.floor(t * FPS / 2) % 2) tipo = 'ciudad';        // parpadeo día/noche cada 2 cuadros
    plano(tipo, (i % cols) * (cw + gap), MATE + Math.floor(i / cols) * (ch + gap), cw, ch, t, 1.15);
  }
}

arrancar(frame => {
  const t = frame / FPS; BOIL = Math.floor(frame / 4);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const reloj = CIUDAD_DIBUJADA ? 'ciudad' : 0;
  if (t < T.numero) {                                // apertura: empuje que cae 1 → 1,3 en 0,35 s y acelera hacia el corte
    const z = 1 + .3 * easeOut(prog(t, 0, .35)) + .35 * Math.pow(prog(t, .35, T.numero), 2);
    pantalla(FOT.length ? 0 : reloj, t, z);
  } else if (t < T.rejilla) {                        // la toma reloj (misma cámara) + el número
    const sub = Math.floor((t - T.numero) / PULSO);   // cortes de pulso entre reloj y fotos
    pantalla(sub % 2 === 0 ? reloj : (sub >> 1) % Math.max(1, FOT.length), t, 1.02 + .04 * prog(t, T.numero, T.rejilla));
    numero(t, T.numero + .1);
  } else if (t < T.freno) rejilla(t);
  else if (t < T.corte) {                            // el freno: el río de luz casi se detiene (0,3×), empuje lentísimo
    const lento = T.freno + (t - T.freno) * .08;
    plano(reloj, 0, 0, W, H, lento, 1.06 + .03 * prog(t, T.freno, T.corte));
  } else if (t >= T.coda) {                          // coda: la cita sobre la última toma, oscurecida
    plano(reloj, 0, 0, W, H, t, 1.08 + .04 * prog(t, T.coda, DUR));
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
    const a = prog(t, T.coda + .1, T.coda + .35), aj = autoajuste(CITA, F_TXT, 400, SEGURA.right - SEGURA.left, 3, 76, 44);
    const g = ctx.createRadialGradient(SEGURA.left + 300, 900, 50, SEGURA.left + 300, 900, 700); g.addColorStop(0, 'rgba(0,0,0,.5)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 300, W, 1200);
    ctx.save(); ctx.globalAlpha = a; aj.rs.forEach((s, i) => texto(s, SEGURA.left, 800 + i * aj.size * 1.25, aj.font, C.texto, 'left', 2));
    texto(CITA_FUENTE, SEGURA.left, 800 + aj.rs.length * aj.size * 1.25 + 30, `500 26px ${F_TXT}`, C.sodio, 'left', 7); ctx.restore();
  }
  // copia de estreno: grano y franjas (el corte a negro deja todo en negro)
  if (t < T.corte || t >= T.coda) { granoPeli(.13, frame); vineta(0, 0, W, H, .35); anillo(t); }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, MATE); ctx.fillRect(0, H - MATE, W, MATE);
});
window.SONIDOS = [
  { t: 0, tipo: 'golpe' }, { t: T.numero, tipo: 'swish' }, ...[...NUMERO].map((_, i) => ({ t: T.numero + .1 + (i + 1) * .125, tipo: 'pop' })),
  ...ETAPAS.map(e => ({ t: e[0], tipo: 'desliz' })), { t: T.freno, tipo: 'ambiente' }, { t: T.corte, tipo: 'golpe' }, { t: T.coda, tipo: 'ambiente' },
];
</script>
</body>
</html>
