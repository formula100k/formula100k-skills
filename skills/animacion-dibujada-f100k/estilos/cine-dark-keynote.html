<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Keynote oscuro</title>
<style>
  html,body{margin:0;background:#05060a;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Estilo «Keynote oscuro» · ingeniería inversa de lemo-opuscar/styles/dark-keynote (MIT, © 2026 LemoLab) · qué se tomó: escenario casi negro con retícula de 1 px y luz fría, kit de interfaz propio (tarjetas, ventana, mosaicos), acumulación generada por regla, congelado, todo vuela a la retícula de un golpe, barrido de luz que enciende solo lo que toca, guardado pieza por pieza y la cifra que sale del ruido de glifos. Un solo acento.
// ====================== LO QUE PUEDES CAMBIAR ======================
const TITULO = 'todo tu contenido en orden';      // una sola línea por pantalla (máx. ~30 letras)
const PALABRA_CLAVE = 'orden';                     // va enorme
const VENTANA = 'mi-contenido';                    // el nombre en la barra de la ventana (letra de máquina)
const CIFRA = '30';                                // la cifra gigante del final · SOLO cifras del guion (ejemplo editable)
const CIFRA_DICE = 'piezas listas este mes';       // la etiqueta chica bajo la cifra
const PENDIENTES = ['idea sin grabar', 'mensaje sin responder', 'guion v3', 'sin publicar', 'borrador', 'nota de voz', 'foto sin editar', 'carrusel a medias'];
const FOTO = '';                                   // captura real de tu app (ruta relativa). Vacío = app genérica sin marcas
const COLORES = {
  escenario: '#0A0C11', superficie: ['#12151C', '#181C25', '#1F2430'],
  texto: '#E9ECF2', texto2: '#9AA3B2', etiqueta: '#5E6778',
  acento: '#B7F34A',     // un solo acento (lima). Otras opciones: violeta '#8B7CFF', naranja '#FF7A1A'
  problema: '#FF5A52',   // rojo del problema: solo mientras el problema existe
};
// ===================================================================
const W = 1080, H = 1920, FPS = 30, DUR = 8.5;
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/cine-info.js"></script>
<script>
const SANS = '"Avenir Next", "Helvetica Neue", sans-serif', NUM = '"Helvetica Neue", "Avenir Next", sans-serif', MONO = 'Menlo, "Courier New", monospace';
const FOTOS = FOTO ? [FOTO] : [];
let IMG = null; if (FOTOS.length) cargarFotos(FOTOS).then(a => IMG = a[0]);

// ---------- escenario (se pinta una vez): base, luz alta, brillo frío corrido, viñeta y retícula de 1 px ----------
const ESC = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = COLORES.escenario; g.fillRect(0, 0, W, H);
  let r = g.createRadialGradient(W / 2, 380, 0, W / 2, 380, 1100); r.addColorStop(0, 'rgba(120,140,190,.10)'); r.addColorStop(1, 'rgba(120,140,190,0)'); g.fillStyle = r; g.fillRect(0, 0, W, H);
  r = g.createRadialGradient(W * .8, H * .62, 0, W * .8, H * .62, 700); r.addColorStop(0, 'rgba(90,120,255,.06)'); r.addColorStop(1, 'rgba(90,120,255,0)'); g.fillStyle = r; g.fillRect(0, 0, W, H);
  for (let x = 0, i = 0; x <= W; x += 48, i++) { g.fillStyle = `rgba(255,255,255,${i % 4 ? .03 : .06})`; g.fillRect(x, 0, 1, H); }
  for (let y = 0, i = 0; y <= H; y += 48, i++) { g.fillStyle = `rgba(255,255,255,${i % 4 ? .03 : .06})`; g.fillRect(0, y, W, 1); }
  r = g.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .75); r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = r; g.fillRect(0, 0, W, H);
  return c; })();

// ---------- kit de interfaz propio ----------
function superficie(x, y, w, h, r, nivel = 1, o = {}) {
  ctx.save();
  if (o.sombra !== false) { ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 18; }
  ctx.fillStyle = COLORES.superficie[nivel]; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); ctx.restore();
  ctx.save(); ctx.strokeStyle = o.borde || 'rgba(255,255,255,.08)'; ctx.lineWidth = o.bordeW || 2; ctx.beginPath(); ctx.roundRect(x + 1, y + 1, w - 2, h - 2, r); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.beginPath(); ctx.moveTo(x + r, y + 3); ctx.lineTo(x + w - r, y + 3); ctx.stroke(); ctx.restore();
}
const CATEG = ['#6F8FD8', '#C38BD8', '#D8B06F', '#6FC9C0', '#D88B8B'];         // códigos de categoría, desaturados
function miniatura(x, y, w, h, i) {                                             // miniatura procedural: cielo, sol y cerros
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 14); ctx.clip();
  const c = CATEG[i % CATEG.length], g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, mezcla(c, '#0A0C11', .35)); g.addColorStop(1, mezcla(c, '#ffffff', .25));
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(x + w * (.3 + hash2(i, 3) * .4), y + h * .38, w * .08, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = mezcla(c, '#0A0C11', .55); ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + h * .72);
  for (let k = 0; k <= 4; k++) ctx.lineTo(x + w * k / 4, y + h * (.55 + hash2(i, k) * .25)); ctx.lineTo(x + w, y + h); ctx.fill();
  ctx.restore();
}
// tarjeta de aviso: ícono de categoría, texto en máquina, renglón gris y el globito rojo del problema
function tarjeta(x, y, w, h, i, rojo = 1) {
  superficie(x, y, w, h, 22, 1);
  ctx.fillStyle = mezcla(CATEG[i % CATEG.length], '#12151C', .25); ctx.beginPath(); ctx.roundRect(x + 20, y + 20, h - 40, h - 40, 12); ctx.fill();
  ctx.fillStyle = COLORES.texto; ctx.font = `500 26px ${MONO}`; ctx.textBaseline = 'alphabetic';
  ctx.fillText(PENDIENTES[i % PENDIENTES.length], x + h, y + h * .45);
  ctx.fillStyle = 'rgba(255,255,255,.10)'; ctx.beginPath(); ctx.roundRect(x + h, y + h * .6, w * .42, 12, 6); ctx.fill();
  if (rojo > 0) { ctx.globalAlpha = rojo; ctx.fillStyle = COLORES.problema; ctx.beginPath(); ctx.arc(x + w - 8, y + 8, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `700 22px ${SANS}`; ctx.textAlign = 'center'; ctx.fillText(String(1 + (i * 7) % 9), x + w - 8, y + 16); ctx.textAlign = 'left'; ctx.globalAlpha = 1; }
}

// ---------- la ventana del producto y su retícula ----------
const VW = { x: 90, y: 690, w: 900, h: 640 }, COLS = 6, FILAS = 4, LADO = 118, GAP = 18;
const G0 = { x: VW.x + (VW.w - (COLS * LADO + (COLS - 1) * GAP)) / 2, y: VW.y + 76 };
const N = COLS * FILAS;                                                          // exactamente las casillas que hay (ni hueco ni sobra)
const SLOT = i => ({ x: G0.x + (i % COLS) * (LADO + GAP), y: G0.y + Math.floor(i / COLS) * (LADO + GAP) });
// la tormenta: tarjetas generadas por regla, cada vez más seguido
const R = rng(42);
const TORMENTA = Array.from({ length: N }, (_, i) => ({ x: 40 + R() * (W - 420), y: 120 + R() * (H - 360), rot: (R() - .5) * .22, z: .78 + R() * .45,
  t0: -.7 + 1.55 * Math.pow(i / N, .7) }));
// a cada tarjeta le toca la casilla más parecida a su lugar (destinos por tipo, sin cruces raros)
const ORDEN = TORMENTA.map((c, i) => i).sort((a, b) => (TORMENTA[a].y - TORMENTA[b].y) || (TORMENTA[a].x - TORMENTA[b].x));
const DESTINO = []; ORDEN.forEach((ci, k) => DESTINO[ci] = k);
const T_CONGELA = 1.05, T_VUELA = 1.3, T_LUZ = 2.0, T_TIT = 2.55, T_GUARDA = 4.7, T_APLASTA = 5.45, T_ABRE = 5.75, T_CIFRA = 6.0;
const ULTIMO = 9;                                                                // la casilla que queda encendida en acento

const TIT = fraseDiseno(TITULO, PALABRA_CLAVE, { familia: SANS, familiaClave: SANS, peso: 500, pesoClave: 700, tam: 64, factor: 2.4,
  ancho: W - 180, x: 90, y: 262, maxAlto: 390, maxRenglones: 3, alinear: 'centro', inter: .98 });

function vuelo(i, t) {                                                           // de la tormenta a su casilla por una curva
  const c = TORMENTA[i], s = SLOT(DESTINO[i]), d0 = T_VUELA + (DESTINO[i] % COLS) * .025 + Math.floor(DESTINO[i] / COLS) * .03;
  const k = aterriza(prog(t, d0, d0 + .42)), a = [c.x, c.y], b = [s.x, s.y], m = [(a[0] + b[0]) / 2 + (b[1] - a[1]) * .25, (a[1] + b[1]) / 2 - (b[0] - a[0]) * .25];
  const u = 1 - k, x = u * u * a[0] + 2 * u * k * m[0] + k * k * b[0], y = u * u * a[1] + 2 * u * k * m[1] + k * k * b[1];
  return { x, y, k, rot: c.rot * (1 - k), z: lerp(c.z, 1, k) };
}
function ventana(t, alto = 1, ancho = 1) {
  const a = easeOut(prog(t, T_VUELA - .05, T_VUELA + .3)); if (a <= 0) return;
  const cx = VW.x + VW.w / 2, cy = VW.y + VW.h / 2, w = VW.w * lerp(.6, 1, a) * ancho, h = VW.h * lerp(.6, 1, a) * alto;
  ctx.save(); ctx.globalAlpha = Math.min(1, a * 1.4);
  superficie(cx - w / 2, cy - h / 2, w, h, 30, 0);
  if (alto > .2) { ctx.fillStyle = COLORES.acento; ctx.fillRect(cx - w / 2 + 30, cy - h / 2 + 22, 5, 26);
    ctx.fillStyle = COLORES.texto2; ctx.font = `500 26px ${MONO}`; ctx.fillText(VENTANA, cx - w / 2 + 52, cy - h / 2 + 44);
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(cx - w / 2, cy - h / 2 + 62, w, 2); }
  ctx.restore();
}
function casilla(x, y, s, i, lit = 1, acento = false) {
  ctx.save(); ctx.globalAlpha *= lerp(.14, 1, lit);
  superficie(x, y, s, s, 18, 2, { sombra: false, borde: acento ? COLORES.acento : undefined, bordeW: acento ? 4 : 2 });
  if (!acento) miniatura(x + 10, y + 10, s - 20, s - 20, i);
  else { ctx.fillStyle = COLORES.acento; ctx.beginPath(); ctx.roundRect(x + s * .3, y + s * .3, s * .4, s * .4, 10); ctx.fill(); }
  ctx.restore();
}
function frenteLuz(t) { return lerp(VW.x - 200, VW.x + VW.w + 200, ease(prog(t, T_LUZ, T_LUZ + 1.1))); }
const litEn = (x, t) => clamp((frenteLuz(t) - x) / 220);

function cifraDeRuido(t, x, y, tam) {                                            // los dígitos se barajan y se fijan de a uno
  ctx.save(); ctx.font = `700 ${tam}px ${NUM}`; ctx.letterSpacing = `${-Math.round(tam * .045)}px`; ctx.textAlign = 'center'; ctx.fillStyle = COLORES.acento;
  const fijo = Math.floor((t - T_CIFRA) / .14), f = Math.floor(t * FPS / 2);
  const txt = [...CIFRA].map((ch, i) => i < fijo || !/\d/.test(ch) ? ch : String(Math.floor(hash2(i * 31 + f, 7) * 10))).join('');
  ctx.fillText(txt, x, y); ctx.restore();
}

arrancar(frame => {
  const t = frame / FPS; BOIL = Math.floor(frame / 4);
  pantalla(); ctx.globalAlpha = 1; ctx.drawImage(ESC, 0, 0);
  // ---- desorden: inclinación holandesa que se endereza al ordenar ----
  const holanda = -.035 * (1 - aterriza(prog(t, T_VUELA, T_VUELA + .45)));
  const aplasta = prog(t, T_APLASTA, T_ABRE);                                    // la ventana se aplasta como pantalla que se apaga
  const altoV = aplasta > 0 ? Math.max(.02, 1 - aterriza(prog(aplasta, 0, .55))) : 1, anchoV = aplasta > .55 ? Math.max(.14, 1 - aterriza(prog(aplasta, .55, 1))) : 1;
  if (t < T_ABRE) ventana(t, altoV, anchoV);
  const tile = SLOT(ULTIMO);
  if (t < T_APLASTA) for (let i = 0; i < N; i++) {
    const c = TORMENTA[i]; const tc = t < T_VUELA ? Math.min(t, T_CONGELA) : t;
    if (tc < c.t0) continue;
    const v = t < T_VUELA ? { x: c.x, y: c.y, k: 0, rot: c.rot, z: c.z } : vuelo(i, t);
    const pop = aterriza(prog(tc, c.t0, c.t0 + .2)), esc = v.z * lerp(.86, 1, pop);
    const w = lerp(380, LADO, v.k), h = lerp(104, LADO, v.k), d = DESTINO[i];
    // guardado: las casillas se retiran de a una (la del acento se queda)
    const sale = d === ULTIMO ? 0 : aterriza(prog(t, T_GUARDA + ((d * 7) % N) * .028, T_GUARDA + ((d * 7) % N) * .028 + .16));
    if (sale >= 1) continue;
    ctx.save(); pantalla(); ctx.translate(W / 2, H / 2); ctx.rotate(holanda); ctx.translate(-W / 2, -H / 2);
    ctx.translate(v.x + w / 2, v.y + h / 2); ctx.rotate(v.rot); ctx.scale(esc * (1 - sale), esc * (1 - sale)); ctx.translate(-w / 2, -h / 2);
    if (v.k < .55) { ctx.globalAlpha = 1 - prog(v.k, .3, .55); tarjeta(0, 0, w, h, i, 1 - prog(t, T_VUELA, T_VUELA + .3)); ctx.globalAlpha = 1; }
    if (v.k > .3) { ctx.globalAlpha = prog(v.k, .3, .55); const lit = v.k < 1 ? lerp(1, .3, v.k) : t < T_LUZ ? .3 : Math.max(.3, litEn(SLOT(d).x, t));
      casilla(0, 0, w, i, lit, d === ULTIMO && t >= T_GUARDA); ctx.globalAlpha = 1; }
    ctx.restore();
  }
  // captura real dentro de la ventana: el barrido de luz la enciende
  if (IMG && t >= T_LUZ && t < T_GUARDA) {
    const x0 = G0.x, y0 = G0.y, w0 = COLS * LADO + (COLS - 1) * GAP, h0 = FILAS * LADO + (FILAS - 1) * GAP, fr = frenteLuz(t);
    ctx.save(); ctx.beginPath(); ctx.roundRect(x0, y0, Math.max(0, Math.min(w0, fr - x0)), h0, 18); ctx.clip(); fotoCover(IMG, x0, y0, w0, h0, .5, 0); ctx.restore();
  }
  // banda de luz suave (brillo ≤ 20 %) que cruza la ventana
  if (t > T_LUZ && t < T_LUZ + 1.2) { const fx = frenteLuz(t); ctx.save(); ctx.beginPath(); ctx.roundRect(VW.x, VW.y, VW.w, VW.h, 30); ctx.clip();
    const g = ctx.createLinearGradient(fx - 160, 0, fx + 40, 0); g.addColorStop(0, 'rgba(200,220,255,0)'); g.addColorStop(.8, 'rgba(200,220,255,.14)'); g.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.fillStyle = g; ctx.fillRect(fx - 160, VW.y, 200, VW.h); ctx.restore(); }
  // la casilla del acento sola y luego se abre en la pantalla de la cifra
  if (t >= T_APLASTA) {
    const ab = aterriza(prog(t, T_ABRE, T_ABRE + .35)), cx = lerp(tile.x + LADO / 2, W / 2, ab), cy = lerp(tile.y + LADO / 2, 900, ab);
    const w = lerp(LADO, W - 160, ab), h = lerp(LADO, 760, ab);
    ctx.save(); superficie(cx - w / 2, cy - h / 2, w, h, lerp(18, 36, ab), 1, { borde: ab < 1 ? COLORES.acento : 'rgba(255,255,255,.08)', bordeW: ab < 1 ? 4 : 2 });
    if (ab < .4) { ctx.globalAlpha = 1 - ab / .4; ctx.fillStyle = COLORES.acento; ctx.beginPath(); ctx.roundRect(cx - w * .2, cy - h * .2, w * .4, h * .4, 10); ctx.fill(); }
    ctx.restore();
    if (t >= T_CIFRA) {
      const tam = autoajuste(CIFRA, NUM, 700, W - 300, 1, 440, 120).size;
      cifraDeRuido(t, W / 2, 900 + tam * .34, tam);
      if (t >= T_CIFRA + CIFRA.length * .14 + .2) { ctx.save(); ctx.font = `500 30px ${MONO}`; ctx.letterSpacing = '6px'; ctx.textAlign = 'center'; ctx.fillStyle = COLORES.texto2;
        ctx.fillText(CIFRA_DICE.toUpperCase(), W / 2, 900 + 300); ctx.restore(); }
    }
  }
  // titular: una línea por pantalla; se retira palabra por palabra cuando la ventana se guarda
  if (t >= T_TIT && t < T_APLASTA + .2) {
    const quita = Math.floor(Math.max(0, t - T_GUARDA - .1) / .09), n = TIT.palabras.length;
    const vis = { ...TIT, palabras: TIT.palabras.slice(0, Math.max(0, n - quita)) };
    pintarFrase(vis, t, T_TIT, .15, { col: COLORES.texto, colClave: COLORES.texto });
    const ult = vis.palabras.at(-1);
    if (ult && t >= finFrase(vis, T_TIT, .15) && Math.floor(t * 2.2) % 2 === 0) {   // el cursor del acento: el metrónomo
      ctx.font = ult.font; ctx.fillStyle = COLORES.acento; ctx.fillRect(ult.x + medir(ult.txt, ult.font) + 14, ult.y - ult.size * .74, Math.max(6, ult.size * .06), ult.size * .86);
    }
  }
});
window.SONIDOS = [
  { t: 0, tipo: 'ambiente' }, { t: .4, tipo: 'pop' }, { t: .8, tipo: 'pop' }, { t: T_CONGELA, tipo: 'golpe' }, { t: T_VUELA, tipo: 'swish' },
  { t: T_LUZ, tipo: 'desliz' }, { t: T_TIT, tipo: 'pop' }, { t: T_GUARDA, tipo: 'papel' }, { t: T_APLASTA, tipo: 'golpe' }, { t: T_ABRE, tipo: 'swish' },
  { t: T_CIFRA + CIFRA.length * .14, tipo: 'golpe' },
];
</script>
</body>
</html>
