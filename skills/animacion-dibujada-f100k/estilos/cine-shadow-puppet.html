<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Teatro de sombras</title>
<style>
  html,body{margin:0;background:#120804;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Estilo «Teatro de sombras» · ingeniería inversa de lemo-opuscar/styles/shadow-puppet (MIT, © 2026 LemoLab) · qué se tomó: imagen = luz de lámparas × transmisión del cuero × tela; piezas de cuero teñido caladas (los agujeros brillan, lo que se cruza oscurece), remaches, varillas, cartel de cuero con letras caladas que se aprieta contra la tela (grande y borroso → nítido) y lámparas que se encienden y blanquean el cuadro.
// ANATOMIA: estilizada — títere de cuero calado de perfil (cabeza grande con cara abierta, manga en otro tinte, varillas): convención del teatro de sombras, sin rasgos realistas.
// ====================== LO QUE PUEDES CAMBIAR ======================
const TITULO_CHICO = 'tu contenido';          // primera línea del cartel calado (máx. ~16 letras)
const TITULO_GRANDE = 'NO VENDE';             // la palabra clave, enorme y calada (máx. ~10 letras)
const PLACA = 'si nadie lo ve';               // la placa del narrador, abajo (máx. ~28 letras)
const COLORES = {                             // tintes de corte: bermellón, ocre, malaquita + cuero crudo + tinta
  bermellon: '#b8211a', ocre: '#dc9d1e', malaquita: '#236e3a', azul: '#22647e',
  cuero: '#e2bd80', tinta: '#1a100a',
  laca: '#5a1a0e',      // el marco del escenario
  oro: '#c98a26',
};
const DUR = 8;
// ===================================================================
const W = 1080, H = 1920, FPS = 30;
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/cine-impresion.js"></script>
<script src="../nucleo/cine-asia.js"></script>
<script>
const C = COLORES, TELA_R = { x: 70, y: 230, w: W - 140, h: 1330 }, PISO = 1430;
const T = { aprieta: [0, .55], lampara2: 1.0, lampara3: 1.35, placa: 2.3 };

// ---------- piezas de cuero fijas: franja de suelo calada y un árbol de encaje (se calan una vez) ----------
const FIJAS = (() => { const c = mk(), g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'multiply';
  const suelo = pieza([0, -40, W, 70], q => { q.fillStyle = C.cuero; q.beginPath(); q.moveTo(0, -10); for (let x = 0; x <= W; x += 30) q.lineTo(x, -14 + Math.sin(x * .02) * 8); q.lineTo(W, 70); q.lineTo(0, 70); q.fill();
    q.fillStyle = '#8a5a2a'; q.fillRect(0, 30, W, 40); cuentas(q, Array.from({ length: 34 }, (_, i) => [16 + i * 32, 10]), 5); for (let i = 0; i < 17; i++) moneda(q, 32 + i * 64, 50, 11);
    q.strokeStyle = C.tinta; q.lineWidth = 2; q.beginPath(); q.moveTo(0, -12); for (let x = 0; x <= W; x += 30) q.lineTo(x, -14 + Math.sin(x * .02) * 8); q.stroke(); }, { semilla: 3 });
  g.save(); g.translate(0, PISO); ponerPieza(g, suelo); g.restore();
  const arbol = pieza([-170, -560, 170, 0], q => { q.fillStyle = '#6b3a1c'; q.beginPath(); q.moveTo(-26, 0); q.quadraticCurveTo(-10, -200, -40, -330); q.lineTo(30, -330); q.quadraticCurveTo(10, -200, 26, 0); q.fill();
    q.fillStyle = C.malaquita; q.beginPath(); q.ellipse(0, -400, 165, 150, 0, 0, 6.283); q.fill();
    for (let i = 0; i < 26; i++) { const a = hash2(i, 3) * 6.283, r = hash2(i, 4) * 120, x = Math.cos(a) * r, y = -400 + Math.sin(a) * r * .85; recorte(q, p => p.ellipse(x, y, 16, 6, a, 0, 6.283)); }
    for (let i = 0; i < 6; i++) nubeEspiral(q, -100 + i * 40, -280 - (i % 2) * 18, 13, i, 2.4);
    q.strokeStyle = C.tinta; q.lineWidth = 2.2; q.beginPath(); q.ellipse(0, -400, 165, 150, 0, 0, 6.283); q.stroke(); }, { semilla: 9 });
  g.save(); g.translate(205, PISO - 8); ponerPieza(g, arbol); g.restore();
  return c; })();

// ---------- el títere (pieza por pieza, de perfil hacia la derecha) ----------
const P = {};
P.cuerpo = pieza([-110, -20, 120, 380], q => { q.fillStyle = C.azul; q.beginPath(); q.moveTo(-44, 0); q.lineTo(48, 0); q.quadraticCurveTo(80, 180, 110, 372); q.lineTo(-100, 372); q.quadraticCurveTo(-70, 180, -44, 0); q.fill();
  q.save(); q.clip(); celosia(q, -110, 60, 120, 230, 18, 4); escamasAbiertas(q, -110, 250, 120, 360, 11); q.restore();
  q.strokeStyle = C.tinta; q.lineWidth = 2.4; q.beginPath(); q.moveTo(-44, 0); q.lineTo(48, 0); q.quadraticCurveTo(80, 180, 110, 372); q.lineTo(-100, 372); q.quadraticCurveTo(-70, 180, -44, 0); q.stroke();
  q.fillStyle = C.ocre; q.beginPath(); q.moveTo(-70, 230); q.lineTo(90, 230); q.lineTo(96, 250); q.lineTo(-76, 250); q.fill(); q.stroke();
  q.fillStyle = C.ocre; q.beginPath(); q.ellipse(0, 6, 62, 26, 0, 0, 6.283); q.fill(); q.stroke(); for (let i = 0; i < 5; i++) nubeEspiral(q, -44 + i * 22, 8, 8, i, 1.8);  // cuello de nube
}, { semilla: 5 });
P.cabeza = pieza([-80, -230, 90, 20], q => {
  const perfil = p => { p.moveTo(-50, 10); p.quadraticCurveTo(-62, -60, -40, -110); p.lineTo(40, -112); p.quadraticCurveTo(52, -80, 54, -62); p.lineTo(72, -40); p.lineTo(52, -30); p.quadraticCurveTo(58, -6, 34, 10); p.closePath(); };
  q.fillStyle = C.cuero; q.beginPath(); perfil(q); q.fill();
  recorte(q, p => { p.moveTo(-34, -6); p.quadraticCurveTo(-44, -60, -26, -94); p.lineTo(34, -96); p.quadraticCurveTo(42, -70, 42, -56); p.lineTo(46, -42); p.quadraticCurveTo(44, -10, 24, -4); p.closePath(); });   // cara abierta: solo tiras de cuero
  q.fillStyle = C.tinta; q.beginPath(); q.moveTo(12, -64); q.quadraticCurveTo(26, -74, 40, -62); q.quadraticCurveTo(26, -58, 12, -64); q.fill();   // ojo
  q.lineWidth = 3.4; q.strokeStyle = C.tinta; q.beginPath(); q.moveTo(2, -78); q.quadraticCurveTo(24, -92, 46, -80); q.stroke();                     // ceja (une la tira)
  q.beginPath(); q.moveTo(30, -22); q.lineTo(46, -24); q.stroke();
  q.lineWidth = 2.2; q.beginPath(); perfil(q); q.stroke();
  q.fillStyle = C.bermellon; q.beginPath(); q.moveTo(-56, -104); q.lineTo(50, -108); q.lineTo(30, -196); q.quadraticCurveTo(-10, -214, -40, -190); q.closePath(); q.fill(); q.stroke();   // tocado grande
  q.save(); q.clip(); celosia(q, -60, -200, 60, -110, 14, 3.4); q.restore();
  q.fillStyle = C.ocre; q.beginPath(); q.ellipse(-4, -110, 60, 12, 0, 0, 6.283); q.fill(); q.stroke(); cuentas(q, [[-40, -110], [-20, -110], [0, -110], [20, -110], [40, -110]], 4);
  q.fillStyle = C.tinta; q.beginPath(); q.moveTo(-50, -40); q.quadraticCurveTo(-90, 40, -60, 20); q.quadraticCurveTo(-70, -10, -40, -60); q.fill();        // pelo
}, { semilla: 7 });
P.manga = pieza([-30, -30, 230, 50], q => { q.fillStyle = C.bermellon; q.beginPath(); q.moveTo(-20, -24); q.quadraticCurveTo(110, -40, 200, -14); q.lineTo(206, 22); q.quadraticCurveTo(100, 30, -20, 34); q.closePath(); q.fill();
  q.save(); q.clip(); escamasAbiertas(q, -20, -30, 210, 40, 9); q.restore(); q.strokeStyle = C.tinta; q.lineWidth = 2.2; q.stroke();
  q.fillStyle = C.ocre; q.fillRect(188, -18, 26, 42); q.strokeRect(188, -18, 26, 42); }, { semilla: 11 });
P.farol = pieza([-70, -10, 70, 230], q => { q.strokeStyle = C.tinta; q.lineWidth = 3; q.beginPath(); q.moveTo(0, 0); q.lineTo(0, 40); q.stroke();
  q.fillStyle = C.bermellon; q.beginPath(); q.ellipse(0, 110, 62, 72, 0, 0, 6.283); q.fill(); q.save(); q.clip(); celosia(q, -70, 40, 70, 190, 16, 3.2); q.restore();
  q.lineWidth = 2.2; q.stroke(); q.fillStyle = C.ocre; q.fillRect(-34, 34, 68, 12); q.fillRect(-34, 176, 68, 12);
  for (let i = 0; i < 5; i++) { q.strokeStyle = C.tinta; q.lineWidth = 2; q.beginPath(); q.moveTo(-12 + i * 6, 190); q.lineTo(-14 + i * 7, 226); q.stroke(); } }, { semilla: 13 });

// ---------- el cartel de cuero oscuro con letras CALADAS (la luz pasa por las letras) ----------
const FT = '"Hoefler Text", "Big Caslon", Georgia, serif';
const AJ_G = autoajuste(TITULO_GRANDE, FT, 900, 760, 1, 190, 80), AJ_C = autoajuste(TITULO_CHICO, FT, 700, 560, 1, 70, 36);
const CAR = { w: Math.max(medir(AJ_G.rs[0], AJ_G.font), medir(AJ_C.rs[0], AJ_C.font)) + 130, h: AJ_C.size * 1.3 + AJ_G.size * 1.05 + 90 };
const CARTEL = pieza([-CAR.w / 2, -CAR.h / 2, CAR.w / 2, CAR.h / 2], q => {
  q.fillStyle = '#3a1d0c'; q.beginPath(); q.roundRect(-CAR.w / 2, -CAR.h / 2, CAR.w, CAR.h, 26); q.fill();
  q.save(); q.globalCompositeOperation = 'destination-out'; q.fillStyle = '#000'; q.textAlign = 'center'; q.textBaseline = 'alphabetic';
  q.font = AJ_C.font; q.fillText(AJ_C.rs[0], 0, -CAR.h / 2 + 40 + AJ_C.size); q.font = AJ_G.font; q.fillText(AJ_G.rs[0], 0, CAR.h / 2 - 38 - AJ_G.size * .08); q.restore();
  recorteLinea(q, 3, p => p.roundRect(-CAR.w / 2 + 14, -CAR.h / 2 + 14, CAR.w - 28, CAR.h - 28, 16));          // borde tallado
  for (let i = 0; i < 4; i++) { const x = (i % 2 ? 1 : -1) * (CAR.w / 2 - 34), y = (i < 2 ? -1 : 1) * (CAR.h / 2 - 34); nubeEspiral(q, x, y, 12, i, 2.4); }
}, { semilla: 17, ss: 1.2 });

// ---------- el escenario de laca (se pinta una vez, con el hueco de la tela) ----------
const MARCO = (() => { const c = mk(), g = c.getContext('2d');
  const madera = g.createLinearGradient(0, 0, W, 0); madera.addColorStop(0, '#2a0b05'); madera.addColorStop(.06, C.laca); madera.addColorStop(.94, C.laca); madera.addColorStop(1, '#2a0b05');
  g.fillStyle = madera; g.fillRect(0, 0, W, H);
  g.fillStyle = '#2a0e06'; g.fillRect(0, TELA_R.y + TELA_R.h + 40, W, H);
  g.strokeStyle = C.oro; g.lineWidth = 3; g.strokeRect(TELA_R.x - 18, TELA_R.y - 18, TELA_R.w + 36, TELA_R.h + 36); g.lineWidth = 1.4; g.strokeRect(TELA_R.x - 30, TELA_R.y - 30, TELA_R.w + 60, TELA_R.h + 60);
  g.globalAlpha = .7; for (let i = 0; i < 7; i++) { const x = 130 + i * 136, y = 150; g.beginPath(); for (let k = 0; k <= 30; k++) { const a = k / 30 * 6.6, r = 22 * (1 - k / 38); g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } g.stroke(); }
  g.globalAlpha = 1; g.fillStyle = '#8a2a12'; g.fillRect(0, TELA_R.y + TELA_R.h + 40, W, 26);
  for (let i = 0; i < 5; i++) { const x = 110 + i * 215 + (i % 2) * 30, y = 1790 + (i % 2) * 40; g.fillStyle = '#0e0503'; g.beginPath(); g.ellipse(x, y, 82, 96, 0, 0, 6.283); g.fill(); g.beginPath(); g.ellipse(x, y + 190, 150, 120, 0, 0, 6.283); g.fill(); }   // público
  g.globalCompositeOperation = 'destination-out'; g.fillRect(TELA_R.x, TELA_R.y, TELA_R.w, TELA_R.h);
  return c; })();
// el resplandor cálido que se derrama en el borde interior del marco
function derrame(g, k) { g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = .22 * k;
  for (const [x, y, w, h] of [[TELA_R.x - 40, TELA_R.y, 40, TELA_R.h], [TELA_R.x + TELA_R.w, TELA_R.y, 40, TELA_R.h], [TELA_R.x, TELA_R.y - 40, TELA_R.w, 40]]) { g.fillStyle = 'rgb(240,140,60)'; g.fillRect(x, y, w, h); } g.restore(); }

// ---------- la placa del narrador: tabla de laca oscura, línea de oro y un sello chiquito ----------
const AJ_P = autoajuste(PLACA, FT, 600, 640, 1, 60, 34);
function placa(g, t) { if (t < T.placa) return;
  const w = medir(AJ_P.rs[0], AJ_P.font) + 170, h = 96, x = W / 2 - w / 2, y = PISO - 62 + (t < T.placa + .15 ? 10 * (1 - prog(t, T.placa, T.placa + .15)) : 0);
  g.save(); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x + 6, y + 8, w, h); g.fillStyle = '#24100a'; g.fillRect(x, y, w, h);
  g.strokeStyle = C.oro; g.lineWidth = 2; g.strokeRect(x + 8, y + 8, w - 16, h - 16);
  g.fillStyle = C.bermellon; g.fillRect(x + 26, y + 30, 36, 36); g.strokeStyle = '#f2e2c0'; g.lineWidth = 2; g.strokeRect(x + 32, y + 36, 24, 24);
  g.font = AJ_P.font; g.fillStyle = '#f2e2c0'; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillText(AJ_P.rs[0], x + 90, y + h / 2 + 3); g.restore(); }

const TRANS = mk(), tg = TRANS.getContext('2d'), LUZ = mk(), lg = LUZ.getContext('2d');
arrancar(frame => {
  const t = frame / FPS;
  // 1) transmisión: blanco + piezas multiplicadas (los agujeros quedan blancos, los cruces oscurecen solos)
  tg.setTransform(1, 0, 0, 1, 0, 0); tg.globalCompositeOperation = 'source-over'; tg.filter = 'none'; tg.drawImage(FIJAS, 0, 0); tg.globalCompositeOperation = 'multiply';
  // el títere: se desliza poco a poco con la varilla y respira (sin temblor); la manga levanta el farol cuando llega la luz
  const bx = 580 + 40 * ease(prog(t, 0, DUR)), by = PISO - 380 * 1.3, resp = Math.sin(t * 2.1) * 3;
  const sube = aterriza(prog(t, T.lampara2 - .2, T.lampara2 + .4)), ang = lerp(.18, -.32, sube);
  tg.save(); tg.translate(bx, by + resp); tg.scale(1.3, 1.3);
  ponerPieza(tg, P.cuerpo);
  tg.save(); tg.translate(18, 40); tg.rotate(ang); ponerPieza(tg, P.manga);
  tg.translate(200, 2); tg.rotate(-ang); ponerPieza(tg, P.farol); tg.restore();
  tg.save(); tg.translate(4, 6); tg.rotate(-.03 + .02 * sube); ponerPieza(tg, P.cabeza); tg.restore();
  remache(tg, 18, 40, 6); remache(tg, 4, 4, 5);
  tg.restore();
  const S13 = 1.3;
  // varillas: líneas grises finas que bajan fuera del biombo
  tg.strokeStyle = 'rgba(60,40,30,.55)'; tg.lineWidth = 3; tg.beginPath(); tg.moveTo(bx + 4, by + 10 + resp); tg.lineTo(bx - 30, H);
  const mx = bx + (18 + Math.cos(ang) * 200) * S13, my = by + resp + (40 + Math.sin(ang) * 200) * S13; tg.moveTo(mx, my); tg.lineTo(mx + 60, H); tg.stroke();
  // el cartel se aprieta contra la tela: llega grande y borroso (pegado a la lámpara) y queda nítido
  const ka = aterriza(prog(t, ...T.aprieta)), esc = lerp(1.55, 1, ka), bl = lerp(26, 0, ka);
  tg.save(); tg.translate(W / 2, 470); tg.scale(esc, esc); if (bl > .3) tg.filter = `blur(${bl}px)`; tg.globalAlpha = lerp(.55, 1, ka); ponerPieza(tg, CARTEL); tg.restore();
  tg.filter = 'none'; tg.globalAlpha = 1; tg.strokeStyle = 'rgba(60,40,30,.5)'; tg.lineWidth = 3;
  tg.beginPath(); tg.moveTo(W / 2 - CAR.w * .3, 470 + CAR.h / 2 * esc); tg.lineTo(W / 2 - CAR.w * .36, H); tg.moveTo(W / 2 + CAR.w * .3, 470 + CAR.h / 2 * esc); tg.lineTo(W / 2 + CAR.w * .36, H); tg.stroke();
  // 2) luz: una lámpara encendida desde el cuadro 0; dos más se encienden con un pico y blanquean la tela
  luzLamparas(lg, [{ x: 560, y: 820, r: 900, k: .7 }, { x: 260, y: 560, r: 900, k: prog(t, T.lampara2, T.lampara2 + .35) }, { x: 840, y: 1180, r: 950, k: prog(t, T.lampara3, T.lampara3 + .35) }], t);
  // 3) composición: luz × transmisión × tela, viñeta cálida
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(LUZ, 0, 0); ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(TRANS, 0, 0); ctx.drawImage(TELA(), 0, 0); ctx.globalCompositeOperation = 'source-over';
  viñetaCalida(ctx, .45);
  // 4) el escenario (no se mueve nunca) y la placa
  ctx.drawImage(MARCO, 0, 0); derrame(ctx, .6 + .4 * prog(t, T.lampara2, T.lampara3 + .4));
  placa(ctx, t);
});
window.SONIDOS = [{ t: 0, tipo: 'ambiente' }, { t: .05, tipo: 'desliz' }, { t: .55, tipo: 'golpe' }, { t: 1.0, tipo: 'swish' }, { t: 1.35, tipo: 'swish' }, { t: 2.3, tipo: 'golpe' }];
</script>
</body>
</html>
