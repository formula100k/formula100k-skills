<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vitral</title>
<style>
  html,body{margin:0;background:#0b0a09;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Estilo «Vitral» · ingeniería inversa de lemo-opuscar/styles/stained-glass (MIT, © 2026 LemoLab) · qué se tomó: vidrio que solo brilla con el sol detrás (versión apagada lechosa y versión encendida), piezas con vetas y orilla envejecida, red de plomo, grisalla, rombos (cuarterones) de fondo, borde de perlas, la banda de luz como reloj que sube por la ojiva medallón por medallón, haz de luz con polvo y la mancha de color proyectada en el piso de piedra.
// ====================== LO QUE PUEDES CAMBIAR ======================
const ENTRADA = 'tu contenido';                     // grabado chico en la piedra (se ve desde el cuadro 0)
const PALABRAS = ['atrae', 'nutre', 'vende'];       // una por medallión, de ABAJO hacia ARRIBA; la última es la clave (enorme)
const SIMBOLOS = ['iman', 'brote', 'llave'];        // el dibujo de cada medallión: 'iman' | 'brote' | 'llave' | 'sol'
const COLORES = {
  fondo: '#1d3f9e',     // vidrio que manda (hondo): cobalto
  caliente: '#b3202e',  // el segundo que manda: rubí (borde y figuras)
  oro: '#e0a92a',       // toques
  verde: '#3f8a3c',     // toques
  blanco: '#dfe8d6',    // vidrio blanco verdoso (fondo de los medallones)
  piedra: '#3b3631',    // la pared
  dorado: '#c9a24b',    // el grabado cuando le llega la luz (plano, sin degradado)
};
// ===================================================================
const W = 1080, H = 1920, FPS = 30, DUR = 8;
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/cine-grafica.js"></script>
<script>
const LAN = { x: 290, y: 280, w: 500, b: 1120 }, BORDE = 36, CXV = LAN.x + LAN.w / 2;
const OJ = ojivaPts(LAN.x, LAN.y, LAN.w, LAN.b - LAN.y, 30);
const OJ_IN = ojivaPts(LAN.x + BORDE, LAN.y + BORDE * 1.9, LAN.w - 2 * BORDE, LAN.b - BORDE - (LAN.y + BORDE * 1.9), 30);
const MED = [1000, 770, 540].map(y => ({ x: CXV, y, r: 108 }));     // de abajo hacia arriba
// la luz sube: el borde de la banda pasa cada medallión en su tiempo (la luz ES el reloj)
const T_LUZ = [.35, 2.4, 4.3], EDGE_KF = [[0, LAN.b + 60], [.35, LAN.b + 30], [.95, MED[0].y - 140], [2.4, MED[0].y - 160], [3.0, MED[1].y - 140], [4.3, MED[1].y - 160], [4.9, LAN.y - 40]];
function borde(t) { for (let i = 1; i < EDGE_KF.length; i++) { const [t0, y0] = EDGE_KF[i - 1], [t1, y1] = EDGE_KF[i]; if (t <= t1) return lerp(y0, y1, ease(prog(t, t0, t1))); } return LAN.y - 40; }

const circP = (cx, cy, r, n = 48) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * 6.283) * r, cy + Math.sin(i / n * 6.283) * r]);
const poli = (g, pts) => { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.closePath(); };

// ---------- el vitral (se arma UNA vez): VIDRIO (color) y PLOMO (red negra) por separado ----------
const [VID, vg] = lienzo(), [PLO, pg] = lienzo();
const PIEZAS = [];                                   // [pts, color]
// borde: banda de rubí con perlas + filete blanco
vg.save(); poli(vg, OJ); vg.clip(); vidrio(vg, OJ, COLORES.caliente, 3); vg.restore();
{ const L = largo([...OJ, OJ[0]]); for (let d = 18; d < L; d += 42) { const P = (() => { let acc = 0; const Q = [...OJ, OJ[0]]; for (let i = 1; i < Q.length; i++) { const s = Math.hypot(Q[i][0] - Q[i - 1][0], Q[i][1] - Q[i - 1][1]); if (acc + s >= d) { const u = (d - acc) / s; return [lerp(Q[i - 1][0], Q[i][0], u), lerp(Q[i - 1][1], Q[i][1], u), Q[i][0] - Q[i - 1][0], Q[i][1] - Q[i - 1][1]]; } acc += s; } return Q[0]; })();
    const n = Math.hypot(P[2], P[3]) || 1, px = P[0] - P[3] / n * 18, py = P[1] + P[2] / n * 18;
    if (py < LAN.b - 10) { vg.fillStyle = '#efe6c8'; vg.beginPath(); vg.arc(px, py, 7, 0, 7); vg.fill(); } } }
vg.save(); poli(vg, OJ_IN); vg.lineWidth = 16; vg.strokeStyle = COLORES.blanco; vg.stroke(); vg.restore();
// fondo de cuarterones: rombos cortados a mano (retícula con vértices compartidos y movidos)
{ const s = 74, r = rng(41), V = {}; const v = (i, j) => { const k = i + ',' + j; if (!V[k]) V[k] = [CXV + (i - j) * s / 2 + (r() - .5) * 8, LAN.y + (i + j) * s * .62 + (r() - .5) * 8]; return V[k]; };
  vg.save(); poli(vg, OJ_IN); vg.clip();
  for (let i = -14; i < 22; i++) for (let j = -14; j < 22; j++) { const q = [v(i, j), v(i + 1, j), v(i + 1, j + 1), v(i, j + 1)];
    if (q.every(p => p[1] < LAN.y - 40 || p[1] > LAN.b + 40 || p[0] < LAN.x - 40 || p[0] > LAN.x + LAN.w + 40)) continue;
    vidrio(vg, q, mezcla(COLORES.fondo, hash2(i, j) < .5 ? '#0a1a55' : '#3a5cc0', hash2(j, i) * .25), i * 97 + j);
    const c = q.reduce((a, p) => [a[0] + p[0] / 4, a[1] + p[1] / 4], [0, 0]);                     // motivo pintado en grisalla: una crucecita de puntos
    vg.fillStyle = 'rgba(40,22,10,.35)'; for (const [dx, dy] of [[0, -9], [0, 9], [-9, 0], [9, 0]]) { vg.beginPath(); vg.arc(c[0] + dx, c[1] + dy, 3, 0, 7); vg.fill(); }
    PIEZAS.push([q, 'cuarteron']); }
  vg.restore(); }
// medallones y sus figuras
function figura(tipo, m) {
  const { x, y, r } = m, out = [];
  if (tipo === 'iman') { const U = [...arc(x, y - r * .05, r * .55, Math.PI, Math.PI * 2), [x + r * .55, y + r * .45], [x + r * .25, y + r * .45], ...arc(x, y - r * .05, r * .25, 0, -Math.PI).map(([a, b]) => [a, b]), [x - r * .25, y + r * .45], [x - r * .55, y + r * .45]];
    out.push([U, COLORES.caliente], [[[x - r * .55, y + r * .45], [x - r * .25, y + r * .45], [x - r * .25, y + r * .7], [x - r * .55, y + r * .7]], '#c9ccd2'], [[[x + r * .25, y + r * .45], [x + r * .55, y + r * .45], [x + r * .55, y + r * .7], [x + r * .25, y + r * .7]], '#c9ccd2']); }
  if (tipo === 'brote') { out.push([[[x - r * .06, y + r * .7], [x + r * .06, y + r * .7], [x + r * .05, y - r * .15], [x - r * .05, y - r * .15]], COLORES.verde]);
    const hoja = (s) => [[x, y - r * .1], [x + s * r * .3, y - r * .55], [x + s * r * .75, y - r * .45], [x + s * r * .5, y - r * .05]];
    out.push([hoja(-1), mezcla(COLORES.verde, '#9fd06a', .35)], [hoja(1), mezcla(COLORES.verde, '#9fd06a', .2)]);
    out.push([[[x - r * .6, y + r * .72], [x + r * .6, y + r * .72], [x + r * .4, y + r * .45], [x - r * .4, y + r * .45]], '#6d2a4a']); }
  if (tipo === 'llave') { out.push([[...circP(x - r * .3, y, r * .32, 30)], COLORES.oro]);
    out.push([[[x - r * .02, y - r * .08], [x + r * .72, y - r * .08], [x + r * .72, y + r * .08], [x - r * .02, y + r * .08]], COLORES.oro]);
    out.push([[[x + r * .4, y + r * .08], [x + r * .52, y + r * .08], [x + r * .52, y + r * .32], [x + r * .4, y + r * .32]], COLORES.oro], [[[x + r * .6, y + r * .08], [x + r * .72, y + r * .08], [x + r * .72, y + r * .26], [x + r * .6, y + r * .26]], COLORES.oro]); }
  if (tipo === 'sol') { out.push([circP(x, y, r * .35, 30), COLORES.oro]);
    for (let k = 0; k < 8; k++) { const a = k / 8 * 6.283; out.push([[[x + Math.cos(a - .14) * r * .45, y + Math.sin(a - .14) * r * .45], [x + Math.cos(a) * r * .75, y + Math.sin(a) * r * .75], [x + Math.cos(a + .14) * r * .45, y + Math.sin(a + .14) * r * .45]], COLORES.oro]); } }
  return out;
}
MED.forEach((m, i) => {
  const ext = circP(m.x, m.y, m.r + 18, 60), ani = circP(m.x, m.y, m.r, 60);
  vidrio(vg, ext, COLORES.caliente, 300 + i); vg.save(); poli(vg, ext); vg.clip();                       // anillo de rubí con perlas
  for (let k = 0; k < 24; k++) { const a = k / 24 * 6.283; vg.fillStyle = '#efe6c8'; vg.beginPath(); vg.arc(m.x + Math.cos(a) * (m.r + 9), m.y + Math.sin(a) * (m.r + 9), 4.5, 0, 7); vg.fill(); } vg.restore();
  vidrio(vg, ani, COLORES.blanco, 310 + i);
  const fig = figura(SIMBOLOS[i] || 'sol', m); m.fig = fig;
  for (const [pts, col] of fig) { vidrio(vg, pts, col, 320 + i * 10 + fig.indexOf(fig.find(f => f[0] === pts)));
    vg.save(); poli(vg, pts); vg.clip(); vg.strokeStyle = 'rgba(55,30,12,.45)'; vg.lineWidth = 3;                // grisalla: trazo de sombra adentro del plomo
    vg.beginPath(); poli(vg, pts); vg.stroke(); vg.restore(); }
  PIEZAS.push([ext, null], [ani, null], ...fig);
});
// plomo: una sola red sobre todo
pg.save(); pg.beginPath(); OJ_IN.forEach((p, i) => i ? pg.lineTo(...p) : pg.moveTo(...p)); pg.closePath();     // los cuarterones solo adentro y nunca sobre un medallón
for (const m of MED) { pg.moveTo(m.x + m.r + 18, m.y); pg.arc(m.x, m.y, m.r + 18, 0, Math.PI * 2, true); } pg.clip('evenodd');
for (const [pts, k] of PIEZAS) if (k === 'cuarteron') plomo(pg, pts, 6);
pg.restore();
for (const [pts, k] of PIEZAS) if (k !== 'cuarteron') plomo(pg, pts, 6);
plomo(pg, OJ_IN, 8); plomo(pg, OJ, 12);
for (const y of [(MED[2].y + MED[1].y) / 2, (MED[1].y + MED[0].y) / 2]) { pg.fillStyle = '#0d0c0b'; pg.fillRect(LAN.x - 6, y - 5, LAN.w + 12, 10); }                       // barras de hierro
// versiones apagada (lechosa, oscura) y encendida (joya)
const [APAG, ag] = lienzo(), [ENC, eg] = lienzo();
ag.filter = 'brightness(.32) saturate(.7)'; ag.drawImage(VID, 0, 0); ag.filter = 'none';
ag.save(); poli(ag, OJ); ag.clip(); ag.fillStyle = 'rgba(150,150,140,.13)'; ag.fillRect(0, 0, W, H); ag.restore();               // velo de intemperie
eg.filter = 'brightness(1.18) saturate(1.2)'; eg.drawImage(VID, 0, 0); eg.filter = 'none';

// ---------- la sala (una vez): sillares, derrame de la ventana, alféizar y piso de lajas ----------
const SALA = (() => { const [c, g] = lienzo(), r = rng(8);
  g.fillStyle = '#141210'; g.fillRect(0, 0, W, H);
  for (let y = 0, f = 0; y < 1500; y += 92, f++) for (let x = -(f % 2) * 80; x < W; x += 160) {
    const v = .8 + r() * .35; g.fillStyle = mezcla(COLORES.piedra, '#000000', 1 - v * .7); g.fillRect(x + 3, y + 3, 154, 86);
    for (let k = 0; k < 60; k++) { g.fillStyle = r() < .5 ? 'rgba(255,240,220,.03)' : 'rgba(0,0,0,.08)'; g.fillRect(x + r() * 154, y + r() * 86, 2, 2); } }
  const ojE = ojivaPts(LAN.x - 70, LAN.y - 120, LAN.w + 140, LAN.b + 40 - (LAN.y - 120), 30);              // el derrame, más claro
  g.save(); poli(g, ojE); g.fillStyle = '#4a443d'; g.fill(); g.clip();
  const gr = g.createLinearGradient(LAN.x - 70, 0, LAN.x + LAN.w + 70, 0); gr.addColorStop(0, 'rgba(0,0,0,.35)'); gr.addColorStop(.5, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H); g.restore();
  g.fillStyle = '#56504a'; g.fillRect(LAN.x - 100, LAN.b + 20, LAN.w + 200, 30); g.fillStyle = '#26221f'; g.fillRect(LAN.x - 100, LAN.b + 50, LAN.w + 200, 10);   // alféizar
  // piso: lajas grandes e irregulares (no el aparejo de la pared)
  g.fillStyle = '#171513'; g.fillRect(0, 1500, W, H - 1500);
  for (let j = 0; j < 6; j++) for (let i = -1; i < 5; i++) { const y0 = 1500 + j * j * 14 + j * 50, y1 = 1500 + (j + 1) * (j + 1) * 14 + (j + 1) * 50, sh = (j % 2) * 130;
    const q = [[i * 280 + sh + (r() - .5) * 30, y0], [(i + 1) * 280 + sh + (r() - .5) * 30, y0], [(i + 1) * 300 + sh + (r() - .5) * 40, y1], [i * 300 + sh + (r() - .5) * 40, y1]];
    poli(g, q); g.fillStyle = mezcla('#2a2622', '#000000', r() * .4); g.fill(); g.strokeStyle = '#0c0b0a'; g.lineWidth = 4; g.stroke(); }
  g.fillStyle = '#0e0d0c'; g.fillRect(0, 1488, W, 14);
  return c; })();

// ---------- texto grabado en la piedra ----------
const F_ROM = '"Optima", "Big Caslon", "Hoefler Text", Georgia, serif';
const LAY = maquetar([
  { t: ENTRADA.toUpperCase(), tam: 50, fam: F_ROM, peso: 600, col: COLORES.dorado, track: .16 },
  { t: PALABRAS[0].toUpperCase() + ',', tam: 92, fam: F_ROM, peso: 700, col: COLORES.dorado, track: .08, nueva: true },
  { t: PALABRAS[1].toUpperCase() + ' Y', tam: 92, fam: F_ROM, peso: 700, col: COLORES.dorado, track: .08 },
  { t: PALABRAS[2].toUpperCase(), tam: 190, fam: F_ROM, peso: 700, col: COLORES.dorado, track: .06, nueva: true },
], { x: 90, y: 1190, w: 900, h: SEGURA.bottom - 1190 }, { alinea: 'centro', espacio: .3, interlinea: 1.02 });
const nEnt = ENTRADA.trim().split(/\s+/).length;
const T_PAL = LAY.palabras.map(p => p.parte === 0 ? T_LUZ[0] + .25 : p.parte === 1 ? T_LUZ[0] + .25 : p.parte === 2 ? T_LUZ[1] + .25 : T_LUZ[2] + .25);
function grabado(t) {
  for (const p of LAY.palabras) {
    const viva = t >= T_PAL[p.i];
    if (p.parte > 0 && !viva) continue;   // la entrada ya está grabada (oscura) desde el cuadro 0 y se dora con la primera luz                               // aparece con corte seco cuando le llega su luz
    ctx.save(); ctx.font = p.font; ctx.letterSpacing = p.track + 'px';
    ctx.fillStyle = '#7a7168'; ctx.fillText(p.txt, p.x, p.y + 3);      // labio claro de abajo
    ctx.fillStyle = viva ? COLORES.dorado : '#0f0d0b'; ctx.fillText(p.txt, p.x, p.y);   // el corte (oscuro) o el dorado
    ctx.restore();
  }
}

// ---------- luz: banda que sube, irradiación, haces con polvo y mancha en el piso ----------
const [TMP, tg] = lienzo(), [CH, chg] = lienzo(W / 4, H / 4);
function luz(t) {
  const e = borde(t), suave = 90;
  tg.setTransform(1, 0, 0, 1, 0, 0); tg.clearRect(0, 0, W, H); tg.drawImage(ENC, 0, 0);
  tg.globalCompositeOperation = 'destination-in';
  const gr = tg.createLinearGradient(0, e - suave, 0, e + suave); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,1)');
  tg.fillStyle = gr; tg.beginPath(); tg.moveTo(0, e - suave - 40); tg.lineTo(W, e - suave + 40); tg.lineTo(W, H); tg.lineTo(0, H); tg.fill();   // borde un poco ladeado
  tg.globalCompositeOperation = 'source-over';
  ctx.drawImage(TMP, 0, 0);
  // irradiación: el vidrio encendido se come un poco el plomo
  chg.clearRect(0, 0, W / 4, H / 4); chg.filter = 'blur(5px)'; chg.drawImage(TMP, 0, 0, W / 4, H / 4); chg.filter = 'none';
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .3; ctx.drawImage(CH, 0, 0, W, H); ctx.restore();
  return e;
}
function haces(t, e) {
  const k = clamp((LAN.b - e) / (LAN.b - LAN.y));                    // cuánto vidrio está encendido
  if (k <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const top = Math.max(e, LAN.y + 200);
  for (let i = 0; i < 3; i++) { const dx = (i - 1) * 120;
    const gr = ctx.createLinearGradient(0, top, 0, 1760); gr.addColorStop(0, 'rgba(120,150,255,0)'); gr.addColorStop(.4, `rgba(150,170,255,${.07 * k})`); gr.addColorStop(1, 'rgba(150,170,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(CXV - 160 + dx, top); ctx.lineTo(CXV + 160 + dx, top); ctx.lineTo(CXV + 420 + dx * 2.2, 1760); ctx.lineTo(CXV - 60 + dx * 2.2, 1760); ctx.fill(); }
  for (let i = 0; i < 70; i++) { const u = hash2(i, 3), v = (hash2(i, 9) + t * .03 * (.5 + hash2(i, 5))) % 1;     // polvo que flota
    const y = lerp(top, 1700, v), x = lerp(CXV - 140, CXV + 380, u) + (y - top) * .25 * (u - .3);
    ctx.fillStyle = `rgba(255,245,220,${.35 * k * Math.sin(v * Math.PI)})`; ctx.fillRect(x, y, 2.5, 2.5); }
  ctx.restore();
  // mancha de color en el piso: borrosa, algo desaturada, espejada y modulada por la piedra
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .5 * k; ctx.filter = 'blur(10px) saturate(.8)';
  ctx.translate(CXV + 150, 1560); ctx.scale(1.25, -.32); ctx.transform(1, 0, -.6, 1, 0, 0);
  ctx.drawImage(CH, -CXV / 1, -LAN.b, W, H); ctx.restore(); ctx.filter = 'none';
  glow(CXV, (LAN.y + LAN.b) / 2, 620, '120,140,230', .12 * k);         // la luz derramada en la piedra
}

arrancar(frame => {
  const t = frame / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  ctx.drawImage(SALA, 0, 0);
  ctx.drawImage(APAG, 0, 0);
  const e = luz(t);
  ctx.drawImage(PLO, 0, 0);
  haces(t, e);
  grabado(t);
});
window.SONIDOS = [{ t: 0, tipo: 'ambiente' }, { t: T_LUZ[0], tipo: 'golpe' }, { t: T_LUZ[0] + .25, tipo: 'pop' },
  { t: T_LUZ[1], tipo: 'swish' }, { t: T_LUZ[1] + .25, tipo: 'pop' }, { t: T_LUZ[2], tipo: 'swish' }, { t: T_LUZ[2] + .25, tipo: 'golpe' }];
</script>
</body>
</html>
