<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pizarra de análisis</title>
<style>
  html,body{margin:0;background:#080C0E;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Estilo «Pizarra de análisis» · ingeniería inversa de lemo-opuscar/styles/telestrator (MIT, © 2026 LemoLab) · qué se tomó: ver primero a 1×, rebobinar con barras de cinta, congelar con destello blanco + golpe 1,035→1 + desaturado + foco elíptico, y dibujar encima con el mismo encuadre (anillo en perspectiva, mancha roja del espacio vacío, flecha de plumón con contorno y punta), tarjetas con barra de color por rol, mosca de modo EN VIVO/ANÁLISIS/REPETICIÓN, reloj de cuadros, barrido amarillo inclinado y tarjeta de datos con el número clave encerrado.
// ====================== LO QUE PUEDES CAMBIAR ======================
const PROGRAMA = 'LA LUPA';                          // nombre del segmento en la mosca (inventado, ≤ 10 letras)
const FOTO = '';    // tu captura (perfil, reel, post), mejor vertical. Vacío = un perfil genérico dibujado
// Dónde está cada cosa EN TU CAPTURA, de 0 a 1 (x = izquierda→derecha, y = arriba→abajo). Con el perfil genérico ya calzan.
const OBJETIVO = { x: .45, y: .19, rx: .43, ry: .045 };   // congelado 1: lo que se encierra (la bio)
const HUECO = { x: .5, y: .268, rx: .44, ry: .022 };      // el espacio que nadie cubre (mancha roja): el botón o el link
const RECORRIDO = [[.32, .5], [.2, .4], [.3, .285]];    // congelado 2: la flecha de lo que debería pasar (punteada)
const ETIQUETAS = [                                       // una por congelado: lo que encontraste (≤ 26 letras) + línea chica
  { txt: 'Tu bio no dice qué vendes', sub: 'CONGELADO 1 · LA BIO', rol: 'nuestro' },
  { txt: 'Nadie llega a tu link', sub: 'CONGELADO 2 · EL CAMINO', rol: 'vacio' },
];
const TARJETA = [                                         // la tarjeta de datos del final: etiqueta + número. SOLO cifras del guion
  { etq: 'segundos para entenderte', num: '3' },
  { etq: 'clic hasta tu oferta', num: '1' },
];
const CLAVE_TARJETA = 0;                                  // qué fila lleva el círculo rojo
const COLORES = {
  nuestro: '#FFD400',   // amarillo fluorescente: lo nuestro, las flechas principales
  rival: '#3FD8FF',     // cian: lo que juega en contra
  vacio: '#FF3B30',     // rojo: el espacio que nadie cubre
  tiza: '#F4F1E8', pizarra: '#0C1411', tarjeta: 'rgba(8,12,14,0.9)',
};
// ===================================================================

const W = 1080, H = 1920, FPS = 30, DUR = 9;
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/cine-montaje.js"></script>
<script>
const C = COLORES;
const F_TIT = '"Avenir Next Condensed", "Helvetica Neue", Arial, sans-serif';
const F_MONO = 'Menlo, "Courier New", monospace';
let IM = null, IM_GRIS = null;
material(FOTO ? [FOTO] : [], ['perfil'], 1080, 1920).then(([im]) => { IM = gradear(im, 'frio', { filtro: 'contrast(1.04) saturate(0.9) brightness(0.97)' });
  IM_GRIS = gradear(im, 'frio', { filtro: 'saturate(0.58) contrast(1.06) brightness(0.9)' }); });
const texto = (s, x, y, font, col, al = 'left', ls = 0) => { ctx.save(); ctx.font = font; ctx.fillStyle = col; ctx.textAlign = al; ctx.letterSpacing = ls + 'px'; ctx.fillText(s, x, y); ctx.restore(); };
const easeIO = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

// ---------- guion de la pieza ----------
// 0–1,0 en vivo (la captura se recorre a 1×) · 1,0–1,6 rebobina · 1,6–3,8 congelado 1 · 3,8–4,4 cámara lenta · 4,4–6,4 congelado 2 · 6,4 barrido → tarjeta de datos
const T = { rew: 1.0, f1: 1.6, lento: 3.8, f2: 4.4, wipe: 6.4 };
function encuadre(zoom, u, w, yPant) {               // escala y esquina de la fuente para ver (u, w) en la altura yPant
  const iw = IM.width, ih = IM.height, e = Math.max(W / iw, H / ih) * zoom, sw = W / e, sh = H / e;
  return { e, sx: clamp(u * iw - W / 2 / e, 0, iw - sw), sy: clamp(w * ih - yPant / e, 0, ih - sh) };
}
function mezcla(A, B, q) { return { e: lerp(A.e, B.e, q), sx: lerp(A.sx, B.sx, q), sy: lerp(A.sy, B.sy, q) }; }
function vista(t) {                                    // en vivo se recorre la captura; cada congelado entra de golpe sobre su hallazgo
  const vivo0 = encuadre(1.12, .5, 0, 0), vivo1 = encuadre(1.12, .5, .62, H * .5);
  const c1 = encuadre(1.3, OBJETIVO.x, (OBJETIVO.y + HUECO.y) / 2, 820);
  const cen = RECORRIDO.concat([[HUECO.x, HUECO.y]]), mu = cen.reduce((a, p) => a + p[0], 0) / cen.length, mv = cen.reduce((a, p) => a + p[1], 0) / cen.length;
  const c2 = encuadre(1.25, .5, mv, 760);
  let base;
  if (t < T.rew) base = mezcla(vivo0, vivo1, t / T.rew);
  else if (t < T.f1) base = mezcla(vivo1, vivo0, easeIO((t - T.rew) / (T.f1 - T.rew)));     // rebobina
  else if (t < T.lento) base = c1;
  else if (t < T.f2) base = mezcla(c1, c2, easeIO((t - T.lento) / (T.f2 - T.lento)));       // cámara lenta hacia el segundo hallazgo
  else base = c2;
  const tc = t >= T.f2 ? T.f2 : t >= T.f1 && t < T.lento ? T.f1 : -9;
  const punch = tc > 0 ? lerp(1.035, 1, easeOut(prog(t, tc, tc + .35))) * (1 + .012 * prog(t, tc + .35, tc + 2.2)) : 1;
  return { ...base, punch, congelado: tc > 0, tc };
}
function aPantalla(v, u, w) {                          // punto de la captura (0..1) → pantalla, con el mismo golpe que la imagen
  const x = (u * IM.width - v.sx) * v.e, y = (w * IM.height - v.sy) * v.e;
  return [W / 2 + (x - W / 2) * v.punch, H / 2 + (y - H / 2) * v.punch, v.e * v.punch];
}
function imagen(t, v) {
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(v.punch, v.punch); ctx.translate(-W / 2, -H / 2);
  ctx.drawImage(v.congelado ? IM_GRIS : IM, v.sx, v.sy, W / v.e, H / v.e, 0, 0, W, H); ctx.restore();
  if (v.congelado) { ctx.fillStyle = 'rgba(30,60,90,.12)'; ctx.fillRect(0, 0, W, H); vineta(0, 0, W, H, .55); } else vineta(0, 0, W, H, .3);
}
function foco(v, o, a) {                               // todo lo de afuera de la elipse se oscurece a .42
  if (a <= 0) return; const [cx, cy, e] = aPantalla(v, o.x, o.y), rx = Math.min(W * .52, o.rx * IM.width * e * 1.15), ry = Math.max(o.ry * IM.height * e * 2.4, 150);
  ctx.save(); ctx.globalAlpha = a * .58; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.ellipse(cx, cy, rx, ry, 0, 0, 7); ctx.fill('evenodd'); ctx.restore();
}
function tarjeta(t, t0, et, x, y) {                    // etiqueta: tarjeta negra, barra del color del rol, línea grande + línea chica
  if (t < t0) return; const col = C[et.rol] || C.nuestro;
  const aj = autoajuste(et.txt, F_TIT, 800, 820, 1, 68, 40), w = Math.max(medir(aj.rs[0], aj.font), medir(et.sub, `600 26px ${F_TIT}`) + 40) + 70;
  const k = easeOut(prog(t, t0, t0 + .2));
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w * k, 150); ctx.clip();
  ctx.fillStyle = C.tarjeta; ctx.fillRect(x, y, w, 150); ctx.fillStyle = col; ctx.fillRect(x, y, 12, 150);
  texto(aj.rs[0], x + 36, y + 80, aj.font, C.tiza); texto(et.sub, x + 36, y + 124, `600 26px ${F_TIT}`, col, 'left', 3); ctx.restore();
}
function mosca(t, modo) {                              // mosca de la esquina: nombre en bloque amarillo + modo
  const f = `800 46px ${F_TIT}`, w = medir(PROGRAMA, f) + 40, x = SEGURA.right - w - 260, y = 262;
  ctx.fillStyle = C.nuestro; ctx.fillRect(x, y, w, 72); texto(PROGRAMA, x + 20, y + 54, f, '#080C0E');
  ctx.fillStyle = '#080C0E'; ctx.fillRect(x + w, y, 260, 72);
  const m = { vivo: ['EN VIVO', C.vacio], analisis: ['ANÁLISIS', C.nuestro], repeticion: ['REPETICIÓN', C.rival] }[modo];
  ctx.fillStyle = m[1]; if (modo === 'vivo') { ctx.beginPath(); ctx.arc(x + w + 30, y + 36, 9, 0, 7); ctx.fill(); } else ctx.fillRect(x + w + 22, y + 28, 16, 16);
  texto(m[0], x + w + 52, y + 50, `800 36px ${F_TIT}`, m[1], 'left', 1);
}
function relojCuadros(t, modo) {                       // ❚❚ 04.20s F106 — segundos y cuadro de la fuente
  const src = t < T.rew ? t : t < T.f1 ? T.rew - (t - T.rew) * 1.6 : t < T.lento ? .04 : t < T.f2 ? .04 + (t - T.lento) * .6 : .4;
  const s = `${modo === 'rew' ? '◀◀' : modo === 'lento' ? '▶ ½' : '❚❚'} ${Math.max(0, src).toFixed(2).padStart(5, '0')}s F${String(Math.round(Math.max(0, src) * 30)).padStart(3, '0')}`;
  ctx.fillStyle = 'rgba(8,12,14,.9)'; ctx.fillRect(SEGURA.left, 352, 400, 58); texto(s, SEGURA.left + 18, 392, `500 30px ${F_MONO}`, C.tiza);
}
function rebobina(t) {                                 // barras de cinta blancas + ◀◀ grande (sin temblor)
  const q = prog(t, T.rew, T.f1); if (q <= 0 || q >= 1) return;
  for (let i = 0; i < 4; i++) { const y = ((hash2(i, 3) * H + q * H * (1.4 + i * .3)) % H); ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(0, y, W, 8 + i * 4); ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(0, y + 14, W, 30); }
  texto('◀◀', W / 2, H / 2 + 20, `800 220px ${F_TIT}`, C.tiza, 'center'); texto('REBOBINA', W / 2, H / 2 + 120, `800 70px ${F_TIT}`, C.tiza, 'center', 10);
}

// ---------- tarjeta de datos (pizarra) ----------
const PIZ = (() => { const [c, p] = lienzo(W, H); p.fillStyle = C.pizarra; p.fillRect(0, 0, W, H);
  p.strokeStyle = 'rgba(244,241,232,.05)'; p.lineWidth = 1; for (let x = 0; x < W; x += 60) { p.beginPath(); p.moveTo(x, 0); p.lineTo(x, H); p.stroke(); } for (let y = 0; y < H; y += 60) { p.beginPath(); p.moveTo(0, y); p.lineTo(W, y); p.stroke(); } return c; })();
function datos(t) {
  ctx.drawImage(PIZ, 0, 0);
  const t0 = T.wipe + .25;
  texto('LO QUE SE CONTÓ', SEGURA.left, 470, `600 30px ${F_MONO}`, C.nuestro, 'left', 4);
  TARJETA.forEach((r, i) => { const y = 620 + i * 330, ti = t0 + .35 + i * .45;
    if (t < ti) return; const k = easeOut(prog(t, ti, ti + .3));
    ctx.save(); ctx.beginPath(); ctx.rect(0, y - 220, SEGURA.left + 1000 * k, 320); ctx.clip();
    const aj = autoajuste(r.etq, F_TIT, 700, 520, 2, 64, 36); aj.rs.forEach((s, j) => texto(s, SEGURA.left, y + j * aj.size * 1.05 - (aj.rs.length - 1) * aj.size * .5, aj.font, C.tiza));
    texto(r.num, SEGURA.right - 40, y + 70, `italic 800 260px ${F_TIT}`, C.nuestro, 'right');
    ctx.fillStyle = 'rgba(244,241,232,.12)'; ctx.fillRect(SEGURA.left, y + 110, SEGURA.right - SEGURA.left, 2); ctx.restore();
    if (i === CLAVE_TARJETA) { const p = prog(t, t0 + 1.4, t0 + 1.9); circuloTrazo(SEGURA.right - 120, y - 20, 150, 150, easeOut(p), { col: C.vacio, w: 9 }); }
  });
}

arrancar(frame => {
  const t = frame / FPS; BOIL = Math.floor(frame / 4);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (!IM) return;
  const v = vista(t);
  const escena = () => {
    imagen(t, v);
    if (t >= T.f1 && t < T.lento) {                    // congelado 1: anillo (qué) → tarjeta (hallazgo)
      foco(v, OBJETIVO, prog(t, T.f1, T.f1 + .3));
      const [cx, cy, e] = aPantalla(v, OBJETIVO.x, OBJETIVO.y);
      anilloPiso(cx, cy + OBJETIVO.ry * IM.height * e * .4, Math.min(W * .44, OBJETIVO.rx * IM.width * e), easeOut(prog(t, T.f1 + .15, T.f1 + .6)), t, C.nuestro);
      tarjeta(t, T.f1 + 1.15, ETIQUETAS[0], SEGURA.left, 1290);
    }
    if (t >= T.f2) {                                   // congelado 2: la flecha punteada de lo que debería pasar → la mancha roja del espacio vacío → tarjeta
      foco(v, { x: .3, y: (RECORRIDO[0][1] + HUECO.y) / 2, rx: .4, ry: .07 }, prog(t, T.f2, T.f2 + .3));
      const pts = RECORRIDO.map(([u, w]) => aPantalla(v, u, w).slice(0, 2));
      marcador(resample(pts, 20).length > 2 ? curva(pts) : pts, easeOut(prog(t, T.f2 + .2, T.f2 + 1.0)), { col: C.nuestro, w: 14, punteado: true, semilla: 4 });
      const [hx, hy, e2] = aPantalla(v, HUECO.x, HUECO.y), hp = easeOut(prog(t, T.f2 + .9, T.f2 + 1.2));
      if (hp > 0) { ctx.save(); ctx.globalAlpha = .36 * hp; ctx.fillStyle = C.vacio; ctx.beginPath(); ctx.ellipse(hx, hy, Math.min(W * .44, HUECO.rx * IM.width * e2), HUECO.ry * IM.height * e2 * 2.2, 0, 0, 7); ctx.fill();
        ctx.globalAlpha = hp; ctx.setLineDash([18, 12]); ctx.strokeStyle = C.vacio; ctx.lineWidth = 5; ctx.stroke(); ctx.restore(); }
      tarjeta(t, T.f2 + 1.2, ETIQUETAS[1], SEGURA.left, 1290);
    }
    const modo = t < T.rew ? 'vivo' : t < T.f1 ? 'repeticion' : t < T.lento ? 'analisis' : t < T.f2 ? 'repeticion' : 'analisis';
    mosca(t, modo); if (t >= T.rew) relojCuadros(t, t < T.f1 ? 'rew' : t >= T.lento && t < T.f2 ? 'lento' : 'pausa');
    rebobina(t);
    for (const tc of [T.f1, T.f2]) if (t >= tc && t < tc + .1) flash(.55 * (1 - (t - tc) / .1));   // destello del congelado
  };
  if (t < T.wipe) escena();
  else {
    // barrido de paquete: banda amarilla inclinada con bordes oscuros (0,34 s) hacia la pizarra
    const p = prog(t, T.wipe, T.wipe + .34);
    if (p < 1) { escena(); ctx.save(); clipBanda(p, -.35, [[30, '#080C0E'], [110, C.nuestro], [30, '#080C0E']]); datos(t); ctx.restore(); bandaWipe(p, -.35, [[30, '#080C0E'], [110, C.nuestro], [30, '#080C0E']]); }
    else datos(t);
    mosca(t, 'analisis');
  }
});
function curva(pts) {                                  // Catmull-Rom simple por los puntos del recorrido
  const out = []; for (let i = 0; i < pts.length - 1; i++) { const a = pts[Math.max(0, i - 1)], b = pts[i], c = pts[i + 1], d = pts[Math.min(pts.length - 1, i + 2)];
    for (let k = 0; k < 16; k++) { const u = k / 16, u2 = u * u, u3 = u2 * u; out.push([0, 1].map(e => .5 * (2 * b[e] + (c[e] - a[e]) * u + (2 * a[e] - 5 * b[e] + 4 * c[e] - d[e]) * u2 + (3 * b[e] - a[e] - 3 * c[e] + d[e]) * u3))); } }
  out.push(pts[pts.length - 1]); return out;
}
window.SONIDOS = [
  { t: T.rew, tipo: 'desliz' }, { t: T.f1, tipo: 'golpe' }, { t: T.f1 + .15, tipo: 'pop' }, { t: T.f1 + 1.15, tipo: 'pop' },
  { t: T.f2, tipo: 'golpe' }, { t: T.f2 + .2, tipo: 'desliz' }, { t: T.f2 + 1.2, tipo: 'pop' }, { t: T.wipe, tipo: 'swish' },
  ...TARJETA.map((_, i) => ({ t: T.wipe + .6 + i * .45, tipo: 'pop' })),
];
</script>
</body>
</html>
