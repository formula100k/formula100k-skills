<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Maqueta blanca</title>
<style>
  html,body{margin:0;background:#0b0c0e;display:grid;place-items:center;height:100vh}
  canvas{height:100vh;width:auto;max-width:100vw}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Estilo «Maqueta blanca» · ingeniería inversa de lemo-opuscar/styles/white-model (MIT, © 2026 LemoLab) · qué se tomó: maqueta blanca mate sobre plinto oscuro, la luz de sala que se corta con relé, el proyector que enciende con un parpadeo y pinta los datos como LUZ (color × (0,42 + 0,58·N·proyector) × alcance), capas que llegan de a una (un lavado que se abre desde el eje, el que se queda solo) y la sala que vuelve a encenderse
// ====================== LO QUE PUEDES CAMBIAR ======================
const FRASE = 'Haz que tu oferta destaque entre todas';   // arriba (máx. ~60 letras)
const PALABRA_CLAVE = 'destaque';                       // enorme, en su propio renglón
const CAPA_1 = 'todo lo que publicas';                  // la primera capa de luz (se enciende todo)
const CAPA_2 = 'lo que vende';                          // la segunda: queda UN solo edificio prendido
const PIN = { titulo: 'TU OFERTA', sub: 'la que te nombran' };   // la etiqueta del edificio que se queda solo
const DATOS = {                                         // SOLO cifras del guion
  etiqueta: 'publicaciones que la muestran',
  valor: '1 de 12',
  nota: 'contadas en tu perfil',
};
const COLORES = {
  maqueta: '#F3F3F1',   // blanco mate
  sala: '#0b0c0e',
  plinto: '#1b1c1f',
  capa1: ['#2a3f8f', '#47b6d6', '#e9fbff'],   // rampa fría (azul → cian → blanco)
  destaca: '#ffb04a',   // el acento: el edificio que se queda solo
};
// ===================================================================
const W = 1080, H = 1920, FPS = 30, DUR = 9;
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/cine-evidencia.js"></script>
<script>
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const BLANCO = hex(COLORES.maqueta), R1 = COLORES.capa1.map(hex), ACC = hex(COLORES.destaca);
// ---------- la maqueta: manzanas con edificios (más altos hacia el centro), un río que la cruza ----------
const NB = 8, MB = 12, M = 11, CALLE = 3.2, ANCHO = NB * (M + CALLE), LARGO = MB * (M + CALLE);
const rio = x => LARGO * .62 + (x - ANCHO / 2) * .55;
const EDIF = [];
{ const r = rng(12);
  for (let j = 0; j < MB; j++) for (let i = 0; i < NB; i++) {
    const bx = i * (M + CALLE) + CALLE / 2, by = j * (M + CALLE) + CALLE / 2;
    if (Math.abs(by + M / 2 - rio(bx + M / 2)) < 8) continue;               // el río no se construye
    const partes = r() < .3 ? 1 : r() < .6 ? 2 : 4;
    for (let k = 0; k < partes; k++) {
      const w = partes === 1 ? M : partes === 2 ? M / 2 - .4 : M / 2 - .4, d = partes === 4 ? M / 2 - .4 : M;
      const x = bx + (partes === 1 ? 0 : (k % 2) * (M / 2 + .4)), y = by + (partes === 4 ? Math.floor(k / 2) * (M / 2 + .4) : 0);
      const dc = Math.hypot(x - ANCHO * .45, y - LARGO * .4) / 80, h = (3 + r() * 6) * (1 + 3.2 * Math.max(0, 1 - dc) * (r() < .35 ? 2 : 1) * .6);
      EDIF.push({ x, y, w, d, h, rk: r() });
    } } }
const BLANCO_I = (() => { let m = -1e9, b = 0; EDIF.forEach((e, i) => { const s = -Math.hypot(e.x - ANCHO * .55, e.y - LARGO * .58); if (s > m) { m = s; b = i; } }); EDIF[b].h = Math.max(EDIF[b].h, 30); return b; })();   // el elegido: cerca del centro, el más alto de su manzana
const CX = ANCHO / 2, CY = LARGO / 2;

const FR = armarFrase(FRASE, PALABRA_CLAVE, { y: 300, fam: F_SANS, peso: 300, famClave: F_SANS, pesoClave: 200, chica: 66, grande: 200, col: '#f1f1ee' });
const T = { cortaSala: [.4, .62], lampara: .72, capa1: [.75, 2.0], capa2: [3.3, 3.9], pin: 4.0, lectura: 4.4, sala: [7.0, 8.0], frase: 1.7 };

function luzSala(t) { return t < T.cortaSala[0] ? 1 : t < T.sala[0] ? lerp(1, 0, prog(t, ...T.cortaSala)) : lerp(0, 1, ease(prog(t, ...T.sala))); }
function lampara(t) {                                    // enciende con un parpadeo corto y suave
  if (t < T.lampara) return 0; const u = t - T.lampara;
  return u > .3 ? 1 : .55 + .45 * (u < .06 ? .3 : u < .1 ? .9 : u < .14 ? .6 : u < .2 ? 1 : .85);
}
function camara(t) {
  const k = ease(prog(t, 0, DUR));
  const v = vista({ cx: W / 2 + lerp(20, -10, k), cy: lerp(1000, 1030, k), esc: lerp(5.6, 5.0, k), yaw: lerp(.48, .7, k), pitch: lerp(.5, .64, k) });
  const p = (x, y, z) => v(x - CX, y - CY, z); p.lado = v.lado; p.yaw = v.yaw; p.pitch = v.pitch; p.esc = v.esc; return p;   // la maqueta, centrada
}
const yawC = p => (x, y) => (x - CX) * Math.sin(p.yaw) + (y - CY) * Math.cos(p.yaw);
function proyeccion(e, i, t) {                            // la luz que el proyector pone en este edificio
  const L = lampara(t); if (L <= 0) return null;
  const dc = Math.hypot(e.x + e.w / 2 - CX, e.y + e.d / 2 - CY), R = lerp(-10, 150, ease(prog(t, ...T.capa1)));
  const lav = clamp((R - dc) / 26);                                         // el lavado: borde ancho y suave, nunca una raya
  const k2 = ease(prog(t, ...T.capa2)), elegido = i === BLANCO_I;
  let c = [0, 0, 0];
  if (lav > 0) { const h = clamp(e.h / 22), cc = h < .5 ? mezclar(R1[0], R1[1], h * 2) : mezclar(R1[1], R1[2], (h - .5) * 2); c = cc.map(v => v * lav * (1 - k2)); }
  if (elegido && t > T.capa2[0]) { const fl = t < T.capa2[0] + .12 ? 1.3 : 1; c = mezclar(c, ACC.map(v => v * fl * 1.45), clamp(k2 * 1.6)); }
  c = c.map(v => v * L * (t > T.sala[0] && !elegido ? 1 - prog(t, ...T.sala) : 1));
  return c.map((v, j) => v + [9, 12, 18][j] * L);              // el negro del proyector: frío, nunca negro puro
}
function edificio(p, e, i, t, ls) {
  const pr = proyeccion(e, i, t), k2 = i === BLANCO_I ? ease(prog(t, ...T.capa2)) : 0, base = mezclar(BLANCO, ACC, .6 * k2 * ls).map(v => v * (.1 + .9 * ls));
  const fac = pr ? (cara, n) => { const toP = [0, -.3, .95], d = Math.max(0, n[0] * toP[0] + n[1] * toP[1] + n[2] * toP[2]); return pr.map(v => v * (.42 + .58 * d) * .9); } : null;
  return caja(p, e.x, e.y, 0, e.w, e.d, e.h, base, { luz: [-.55, -.35, .8], ambiente: .58, proy: fac });
}
arrancar(frame => {
  const t = frame / FPS; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  const ls = luzSala(t), L = lampara(t);
  ctx.fillStyle = rgb(mezclar(hex(COLORES.sala), [44, 46, 50], ls)); ctx.fillRect(0, 0, W, H);
  const p = camara(t), m = 6;
  // plinto oscuro y placa base blanca (con el río como incrustación satinada)
  caja(p, -m - 4, -m - 4, -9, ANCHO + 2 * m + 8, LARGO + 2 * m + 8, 8, hex(COLORES.plinto).map(v => v * (.5 + .5 * ls) + 6), { luz: [-.55, -.35, .8], ambiente: .6 });
  sombraSuelo(p, [[-m, -m, -1], [ANCHO + m + 14, -m, -1], [ANCHO + m + 14, LARGO + m + 20, -1], [-m, LARGO + m + 20, -1]], { alpha: .25 * ls, borroso: 30 });
  const placaC = BLANCO.map(v => v * (.05 + .9 * ls)), pl = caja(p, -m, -m, -1, ANCHO + 2 * m, LARGO + 2 * m, 1, placaC, { luz: [-.55, -.35, .8], ambiente: .62 });
  { const q = [[-m, rio(-m) - 5], [ANCHO + m, rio(ANCHO + m) - 5], [ANCHO + m, rio(ANCHO + m) + 5], [-m, rio(-m) + 5]].map(([x, y]) => p(x, y, 0.02));
    ctx.beginPath(); q.forEach((v, i) => i ? ctx.lineTo(v[0], v[1]) : ctx.moveTo(v[0], v[1])); ctx.closePath(); ctx.fillStyle = rgb([70, 74, 80].map(v => v * (.15 + .85 * ls))); ctx.fill(); }
  // derrame del proyector sobre la placa (pasa un poco del borde)
  if (L > 0 && t < T.capa2[1] + .4) { const c = p(CX, CY, 0), R = lerp(0, 150, ease(prog(t, ...T.capa1))) * p.esc;
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], Math.max(1, R)); g.addColorStop(0, `rgba(60,120,170,${.22 * L * (1 - ease(prog(t, ...T.capa2)))})`); g.addColorStop(1, 'rgba(60,120,170,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  // edificios en orden de pintor (de lejos a cerca)
  const prof = yawC(p), orden = EDIF.map((e, i) => i).sort((a, b) => prof(EDIF[a].x + EDIF[a].w / 2, EDIF[a].y + EDIF[a].d / 2) - prof(EDIF[b].x + EDIF[b].w / 2, EDIF[b].y + EDIF[b].d / 2));
  let techoElegido = null;
  for (const i of orden) { const top = edificio(p, EDIF[i], i, t, ls); if (i === BLANCO_I) techoElegido = top; }
  // el pin: línea fina del techo a una etiqueta sobre placa oscura
  if (t > T.pin && techoElegido) { const a = techoElegido[2], ty = Math.max(FR.y1 + 30, a[1] - 230), tx = Math.min(SEGURA.right - 330, a[0] + 30);
    const k = ease(prog(t, T.pin, T.pin + .35)); pelo([a, [a[0], lerp(a[1], ty + 40, k)]], { w: 1.8, col: '#f3f3f1' });
    if (k >= 1) { placa(a[0] - 2, ty - 10, 340, 100, { col: 'rgba(10,11,13,.82)', r: 4 });
      escribir(PIN.titulo, a[0] + 18, ty + 34, `600 36px ${F_SANS}`, COLORES.destaca); escribir(PIN.sub, a[0] + 18, ty + 72, `400 26px ${F_SANS}`, 'rgba(243,243,241,.8)'); } }
  // la lectura de la capa, en el tercio izquierdo: índice + nombre, cifra, etiqueta, fuente, barra de leyenda
  if (t > T.capa1[0] + .2) { const dos = t > T.capa2[0], x = SEGURA.left, y = 1180;
    placa(x - 24, y - 44, 610, t > T.lectura ? 320 : 90, { col: 'rgba(10,11,13,.8)', r: 6 });
    escribir((dos ? '02' : '01') + '  ' + (dos ? CAPA_2 : CAPA_1), x, y, `500 28px ${F_MONO}`, 'rgba(243,243,241,.85)');
    const lb = [x, y + 22]; for (let i = 0; i < 40; i++) { const c = dos ? ACC : (i < 20 ? mezclar(R1[0], R1[1], i / 20) : mezclar(R1[1], R1[2], (i - 20) / 20)); ctx.fillStyle = rgb(c); ctx.fillRect(lb[0] + i * 9, lb[1], 9, 8); }
    if (t > T.lectura) lectura(x, y + 54, { etiqueta: DATOS.etiqueta, valor: DATOS.valor, nota: DATOS.nota, k: prog(t, T.lectura, T.lectura + .6), tam: 130, col: COLORES.destaca, tinta: '#f3f3f1', ancho: 560 }); }
  // etiqueta de identidad, discreta
  escribir('MAQUETA BLANCA · DATOS DE MUESTRA', SEGURA.left, 270, `400 22px ${F_MONO}`, `rgba(243,243,241,${.35 + .4 * (1 - ls)})`);
  vineta(.5);
  pintarFrase(FR, t, T.frase, .17);
});
window.SONIDOS = [{ t: .4, tipo: 'golpe' }, { t: .72, tipo: 'golpe' }, { t: .9, tipo: 'desliz' }, { t: 3.3, tipo: 'golpe' }, { t: 4.0, tipo: 'pop' }, { t: 7.0, tipo: 'ambiente' }];
</script>
</body>
</html>
