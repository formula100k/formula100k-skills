<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Con tu video · Auto-Edición</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&display=swap">
<style>html,body{margin:0;background:#111}canvas{display:block;max-height:100vh;margin:0 auto}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Auto-Edición · modo «Con tu video». Esta pieza dibuja SOLO los gráficos: donde va tu video pinta verde #00FF00
// y video/componer.py pone tu video debajo. La escena «recorte» te pone encima de los gráficos (Depth UI, fondo que cambia).
// Lo que va DELANTE de ti en una escena recorte se dibuja dentro de frente(() => …) y se activa con la constante FRENTE.
// PALABRAS, PLANO y DUR los inyecta video/armar.sh.
const PALABRAS = __PALABRAS__;
const PLANO = __PLANO__;
const DUR = __DUR__;
const [W, H] = PLANO.formato === '16:9' ? [1920, 1080] : [1080, 1920];
const FPS = 30;
const VERDE = new URLSearchParams(location.search).has('verde');   // pasada de la capa de frente
const FRENTE = true;                                               // pon false si ninguna escena dibuja delante de ti
// Sobre el hueco verde dibuja solo cosas OPACAS: una sombra o un velo translúcido sobre verde queda como tinte verde encima de tu video.
const C = {
  verde: '#00FF00',                                         // solo para el hueco del video: no lo uses en gráficos
  fondo: '#202226', fondo2: '#141518', tarjeta: '#26282D', borde: 'rgba(255,255,255,.10)',
  blanco: '#FFFFFF', gris: 'rgba(255,255,255,.55)', tenue: 'rgba(255,255,255,.22)',
  acento: '#FF7A1A', bien: '#2FB85A', mal: '#E5383B',
  sans: 'Inter, -apple-system, Helvetica, Arial, sans-serif',
  diseno: '"Instrument Serif", Georgia, serif',             // la letra de diseño del tema (palabra clave)
  golpe: '"Bricolage Grotesque", Inter, sans-serif',        // la línea enorme del gancho
};
// arreglos de la transcripción (Whisper confunde nombres propios)
const CORREGIR = { 'cloud': 'Claude' };   // en minúscula; respeta la puntuación pegada («Cloud,» → «Claude,»)
PALABRAS.forEach(p => { const m = p.w.match(/^(.*?)([.,;:!?¿¡]*)$/); if (CORREGIR[m[1].toLowerCase()]) p.w = CORREGIR[m[1].toLowerCase()] + m[2]; });
const dicho = k => PALABRAS[k] ? PALABRAS[k].s : 1e9;   // segundo en que se dice la palabra k
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/titulos.js"></script>
<script>
let FOTOS = {}, MODO_FRENTE = false;
// ---------- piezas del kit (planas: sin brillo, sin rebote; todo entra con corte seco) ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
let CONTORNO = 0;   // >0: contorno plano oscuro para el texto que va encima del video (se lee sobre cualquier fondo, sin brillo)
function tx(s, x, y, tam, peso = 700, color = C.blanco, alinear = 'center', fam = C.sans) {
  const it = /^italic /.test(fam); if (it) fam = fam.slice(7);   // «italic» va antes del peso en la fuente del canvas
  ctx.save(); ctx.font = `${it ? 'italic ' : ''}${peso} ${tam}px ${fam}`; ctx.fillStyle = color; ctx.textAlign = alinear; ctx.textBaseline = 'alphabetic';
  if (CONTORNO) { ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(4, tam * CONTORNO); ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillText(s, x, y); ctx.restore();
}
function tarjeta(x, y, w, h, o = {}) {
  ctx.save(); ctx.fillStyle = o.color || C.tarjeta; rr(x, y, w, h, o.r ?? 28); ctx.fill();
  ctx.strokeStyle = o.activa ? C.acento : C.borde; ctx.lineWidth = o.activa ? 4 : 2; ctx.stroke(); ctx.restore();
}
function hueco(x, y, w, h, r = 0) { ctx.save(); ctx.fillStyle = C.verde; if (r) { rr(x, y, w, h, r); ctx.fill(); } else ctx.fillRect(x, y, w, h); ctx.restore(); }
function fondo(oscuro = false) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, oscuro ? '#0E0F11' : C.fondo); g.addColorStop(1, C.fondo2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
// en la pasada de frente (?verde) la escena dibuja en un lienzo de descarte y solo frente(…) llega al lienzo real
const DESCARTE = document.createElement('canvas').getContext('2d'); let REAL = null;
function frente(fn) { if (!MODO_FRENTE) return; const c = ctx; ctx = REAL; fn(); ctx = c; }   // lo que va delante de ti (escenas «recorte»)
function detras(fn) { if (!MODO_FRENTE) fn(); }  // lo que va detrás de ti

// ---------- títulos con plantilla (21 plantillas de gancho en motor/titulos.js: Titulos.lista) ----------
// Para el gancho: 'gigante' (palabra que llena el ancho), 'cartel', 'contraste', 'recorte', 'revista', 'pixel', 'sello', 'gastado', 'compinche', 'plumon'.
// NO uses 'titular' ni 'caramelo' en un gancho: traen brillo (regla de la casa: sin brillo ni degradado).
// Las líneas van con la palabra que manda entre *asteriscos*. PLANO.gancho / PLANO.titulo eligen la plantilla del reel.
// Van en la capa de GRÁFICOS, nunca dentro de frente(…): su sombra suave sobre el verde deja un borde verde. Ubícalos donde no tapen tu cara.
// o.jerarquia = 'clave' agranda la línea con *asteriscos* en las plantillas de una sola letra (tecla, plumon, sello…).
function titulo(lineas, t, o = {}) {
  if (t < (o.desde ?? 0) || (o.hasta != null && t >= o.hasta)) return;
  const pl = o.plantilla || PLANO.titulo || PLANO.gancho || 'gigante';
  const ancho = o.ancho ?? (W > H ? 1080 : W), x0 = o.x ?? (W - ancho) / 2;
  ctx.save(); ctx.translate(x0, 0);
  // sin sombra difusa: translúcida sobre el hueco verde deja un borde verde en tu video (o.sombra = true la deja, solo sobre fondo opaco)
  const c = o.sombra ? ctx : new Proxy(ctx, { get: (r, k) => { const v = r[k]; return typeof v === 'function' ? v.bind(r) : v; },
    set: (r, k, v) => { r[k] = k === 'shadowColor' ? 'transparent' : k === 'shadowBlur' ? 0 : v; return true; } });
  try { Titulos.dibujar(c, ancho, lineas.filter(Boolean), o.y ?? 300, pl, o.color || C.acento, { tamano: o.tamano ?? 1, jerarquia: o.jerarquia }); } finally { ctx.restore(); }
}
// gancho golpe: línea chica + línea ENORME que se leen como UNA frase; entran con corte seco (sin animación)
function gancho(chica, enorme, t, o = {}) {
  const ls = [];
  if (chica && t >= (o.tChica ?? 0)) ls.push(chica);
  if (t >= (o.tEnorme ?? 0)) ls.push(`*${enorme.replace(/\*/g, '')}*`);
  if (!ls.length) return;
  titulo(o.enormeArriba ? ls.reverse() : ls, t, { ...o, plantilla: o.plantilla || PLANO.gancho || 'gigante', tamano: o.tamano ?? 1.2, y: o.y ?? 260 });
}

// subtítulo «ajustado»: la frase que se va diciendo, con su *clave* destacada por la plantilla de título del reel
// trozos = [[desdeK, hastaK, 'texto con *clave*'], …]  (índices de PALABRAS). y = arriba del bloque.
function subAjustado(t, trozos, y = 1080, sobreVideo = true, o = {}) {
  const tr = trozos.find(([a, b]) => t >= dicho(a) && t < (PALABRAS[b + 1] ? dicho(b + 1) : DUR)); if (!tr) return;
  const [a, , texto] = tr, ws = texto.split(' '); let k = -1;
  for (let i = 0; i < ws.length; i++) if (t >= dicho(a + i)) k = i;   // palabras ya dichas (secuencial, corte seco)
  const iClave = ws.findIndex(w => /\*/.test(w));
  const vis = (lista, base) => lista.filter((_, j) => base + j <= k).join(' ');
  if (iClave < 0) return titulo([vis(ws, 0)], t, { y, ...o });
  const antes = vis(ws.slice(0, iClave), 0), clave = k >= iClave ? ws[iClave] : '', despues = vis(ws.slice(iClave + 1), iClave + 1);
  titulo([antes, clave && despues ? `${clave} ${despues}` : clave].filter(Boolean), t, { y, ...o });
}

// lista de pasos que se acumula: el nuevo resalta, los anteriores se quedan atenuados
function pasos(x, y, w, items, t, o = {}) {   // items = [[k, 'texto', '✓'|'✗'|''], …]
  const h = o.h || 120, gap = o.gap || 22;
  items.forEach(([k, s, marca], i) => {
    if (t < dicho(k)) return;
    const ultimo = !items[i + 1] || t < dicho(items[i + 1][0]);
    tarjeta(x, y + i * (h + gap), w, h, { activa: ultimo });
    ctx.save(); ctx.globalAlpha = ultimo ? 1 : .55;
    tx(String(i + 1).padStart(2, '0'), x + 40, y + i * (h + gap) + h / 2 + 14, 36, 700, C.acento, 'left');
    tx(s, x + 120, y + i * (h + gap) + h / 2 + 16, 46, 700, C.blanco, 'left');
    if (marca) tx(marca, x + w - 50, y + i * (h + gap) + h / 2 + 18, 54, 800, marca === '✓' ? C.bien : C.mal, 'right');
    ctx.restore();
  });
}
// contador gigante: cifra en acento + rótulo chico
function contador(x, y, valor, rotulo, o = {}) {
  tarjeta(x, y, o.w || 420, o.h || 260);
  tx(rotulo, x + 36, y + 64, 32, 600, C.gris, 'left');
  tx(valor, x + 32, y + (o.h || 260) - 46, o.tam || 140, 800, o.color || C.acento, 'left');
}
// calendario de un mes; marcados = días resaltados
function calendario(x, y, w, mes, marcados = [], o = {}) {
  const h = w * 1.02; tarjeta(x, y, w, h);
  tx(mes, x + 40, y + 76, 48, 800, C.blanco, 'left'); tx(o.anio || '', x + w - 40, y + 76, 34, 600, C.gris, 'right');
  const c = (w - 80) / 7;
  ['L', 'M', 'X', 'J', 'V', 'S', 'D'].forEach((d, i) => tx(d, x + 40 + c * i + c / 2, y + 140, 28, 600, C.gris));
  for (let d = 1; d <= (o.dias || 31); d++) {
    const p = d - 1 + (o.empieza || 0), cx = x + 40 + (p % 7) * c, cy = y + 170 + Math.floor(p / 7) * c * .9;
    if (marcados.includes(d)) { ctx.save(); ctx.fillStyle = C.acento; rr(cx + 6, cy, c - 12, c * .8, 14); ctx.fill(); ctx.restore(); }
    tx(String(d), cx + c / 2, cy + c * .52, 32, marcados.includes(d) ? 800 : 500, marcados.includes(d) ? '#111' : C.blanco);
  }
}
// notificación plana tipo iOS (va delante de ti en Depth UI)
function notificacion(x, y, w, app, texto, o = {}) {
  ctx.save(); ctx.fillStyle = '#1E1F23'; rr(x, y, w, 150, 34); ctx.fill(); ctx.restore();
  ctx.save(); ctx.fillStyle = o.color || C.acento; rr(x + 28, y + 35, 80, 80, 20); ctx.fill(); ctx.restore();
  tx(o.icono || '★', x + 68, y + 92, 44, 800, '#111');
  tx(app, x + 132, y + 66, 30, 600, C.gris, 'left'); tx(texto, x + 132, y + 112, 40, 700, C.blanco, 'left');
  if (o.valor) tx(o.valor, x + w - 36, y + 98, 56, 800, o.colorValor || C.bien, 'right');
}
// tablero que se llena (top N / niveles): filas fijas; cada item cae a su fila cuando se dice
function tablero(x, y, w, titulo, filas, items, t) {   // items = [[k, fila, 'texto'], …]
  tx(titulo, x + w / 2, y, 54, 800, C.acento);
  filas.forEach((f, i) => {
    const fy = y + 40 + i * 110;
    ctx.save(); ctx.fillStyle = i === 0 ? C.acento : '#3A3C42'; rr(x, fy, 96, 92, 16); ctx.fill(); ctx.restore();
    tx(f, x + 48, fy + 64, 50, 800, i === 0 ? '#111' : C.blanco);
    tarjeta(x + 112, fy, w - 112, 92, { r: 16 });
    const it = items.find(([k, fila]) => fila === i && t >= dicho(k));
    if (it) tx(it[2], x + 150, fy + 62, 46, 700, C.blanco, 'left');
  });
}

// ---------- ESCENAS: demo de los 19 efectos ----------
function etiqueta(n, nombre) {   // rótulo chico arriba: número + nombre del efecto (solo en el demo)
  ctx.save(); ctx.font = `800 34px ${C.sans}`; const w = ctx.measureText(nombre).width + 120, x = (W - w) / 2, y = 200;
  ctx.fillStyle = '#FFF'; rr(x, y, w, 64, 14); ctx.fill(); ctx.fillStyle = EFX.rojo; rr(x + 10, y + 10, 64, 44, 10); ctx.fill(); ctx.restore();
  tx(String(n).padStart(2, '0'), x + 42, y + 44, 28, 800, '#FFF'); tx(nombre, x + 92, y + 45, 34, 800, '#111', 'left');
}
function palabra(t, y = 1480) {   // subtítulo de a una palabra, en la letra golpe con contorno plano
  const p = PALABRAS.findLast(p => p.s <= t); if (!p || t > p.e + .35) return;
  CONTORNO = .1; tx(p.w.replace(/[.,¿?]/g, ''), W / 2, y, 92, 800, '#FFF', 'center', C.golpe); CONTORNO = 0;
}
const NOMBRES = ['Acercamiento seco', 'Vidrio roto', 'Foto que escapa', 'Lista que se marca', 'Tormenta de titulares', 'Zoom de cámara', 'Portal',
  'Curva que sube', 'Dentro del iPhone', 'Chat que edita', 'Portada de revista', 'Editor y línea de tiempo', 'Órbita de fotos', 'Zoom que atraviesa',
  'Vértigo', 'Estudio que se enciende', 'Recorte de papel', 'Pantalla verde', 'Lista final'];
const ESC = [
  (e, t) => { hueco(0, 0, W, H); gancho('faltan', '75 DÍAS', t, { y: 300 }); },                                        // 01 acercamiento + gancho
  (e, t) => { fondoEfecto(t); tx('el 1 de', W / 2, 820, 70, 400, '#FFF', 'center', 'italic ' + C.diseno); tx('ENERO', W / 2, 1010, 210, 800, '#FFF', 'center', C.golpe); },   // 02 vidrio roto: debajo aparece lo que sigue
  (e, t) => { fondoEfecto(t); etiqueta(3, NOMBRES[2]);
    if (t >= dicho(14)) { tx('el 1 de', 300, 410, 60, 400, '#FFF', 'center', 'italic ' + C.diseno); tx('ENERO', 640, 430, 120, 800, '#FFF', 'center', C.golpe); } },
  (e, t) => { hueco(0, 0, W, H); etiqueta(4, NOMBRES[3]);
    checklistPop([[24, 'Editar', '✗'], [28, 'Carruseles', '✗'], [34, 'Usarla', '✗']], t, { x: 50, y: 1180 }); },
  (e, t) => { hueco(0, 0, W, H); etiqueta(5, NOMBRES[4]);
    tormentaTitulares([[37, 'YO ERA TEAM CHATGPT'], [40, 'TEAM CHATGPT'], [41, 'HASTA LA MUERTE'], [43, 'HASTA LA MUERTE']], t); },
  (e, t) => { camaraUI(t, PLANO.escenas[5].efecto.pasos); etiqueta(6, NOMBRES[5]); palabra(t); },
  (e, t) => { hueco(0, 0, W, H); if (t < 18.82) etiqueta(7, NOMBRES[6]); palabra(t); },
  (e, t) => { curvaCrecimiento(t, { tA: dicho(70), tB: dicho(73), texto: 'CIENTOS' }); etiqueta(8, NOMBRES[7]);
    if (t >= dicho(75)) tx('de aplicaciones', 330, 520, 54, 400, '#FFF', 'center', 'italic ' + C.diseno); },
  (e, t) => { iphone(t, { w: 560, y: 420 }); etiqueta(9, NOMBRES[8]);
    if (t >= dicho(78)) { tx('dos', W / 2 - 150, 1720, 64, 400, '#FFF', 'center', 'italic ' + C.diseno); tx('APPS', W / 2 + 60, 1730, 110, 800, '#FFF', 'center', C.golpe); } },
  (e, t) => { ventanaChat(t, { pedido: 'Hazme el contenido de esta semana para mi comunidad.', kPedido: 87,
    items: [[91, 'Investigaciones'], [92, 'Guiones'], [93, 'Carruseles']] }); etiqueta(10, NOMBRES[9]); },
  (e, t) => { portadaRevista(t, { nombre: 'CARRUSELES', edicion: 'CONECTADA', fecha: 'DISEÑO DIRECTO', lados: ['DISEÑA', 'TUS', 'CARRUSELES'], sello: 'DIRECTO' });
    etiqueta(11, NOMBRES[10]); },
  (e, t) => { editorLinea(t, { titulo: 'EDITOR · B-ROLL', desde: e.desde, dur: e.hasta - e.desde }); etiqueta(12, NOMBRES[11]);
    if (t >= dicho(118)) { tx('editar', 300, 1750, 64, 400, '#FFF', 'center', 'italic ' + C.diseno); tx('VIDEOS', 640, 1760, 110, 800, '#FFF', 'center', C.golpe); } },
  (e, t) => { hueco(0, 0, W, H); etiqueta(13, NOMBRES[12]); orbita(['cine_10', 'leer_00', 'pintar_03', 'musica_08', 'robot_01', 'yoga_06'].map(k => FOTOS[k]), t, { desde: e.desde, rx: 430, ry: 150, dy: 60 }); palabra(t, 1560); },
  (e, t) => { hueco(0, 0, W, H); etiqueta(14, NOMBRES[13]); palabra(t); },
  (e, t) => { hueco(0, 0, W, H); etiqueta(15, NOMBRES[14]); palabra(t); },
  (e, t) => { estudio(t, dicho(153)); etiqueta(16, NOMBRES[15]); },
  (e, t) => { fondoPapel(t); etiqueta(17, NOMBRES[16]);
    if (t >= dicho(161)) tx('ARTE', 70, 420, 110, 800, '#FFF', 'left', C.golpe);
    if (t >= dicho(167)) tx('ROBÓTICA', W - 70, 1800, 110, 800, '#111', 'right', C.golpe); },
  (e, t) => { pantallaVerde(t, dicho(176), FOTOS.cine_00); etiqueta(18, NOMBRES[17]); if (t >= dicho(176)) tx('CINE', W / 2, 1760, 150, 800, '#FFF', 'center', C.golpe); },
  (e, t) => { hueco(0, 0, W, H); subAjustado(t, [[177, 182, 'he podido consumir mucho *más*'], [183, 188, 'las cosas que me *gustaban*'], [189, 191, 'Volví a *leer*'], [192, 195, 'algo *increíble*']], 1250); },
  (e, t) => { checklistFinal(NOMBRES.slice(0, 18).concat('Lista final'), t, { tA: e.desde + .3, dur: 2.4, rotulo: 'Todos en tu video.' }); },
];

function draw(f) {
  const t = f / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let i = PLANO.escenas.findIndex(e => t >= e.desde && t < e.hasta); if (i < 0) i = PLANO.escenas.length - 1;
  const e = PLANO.escenas[i];
  MODO_FRENTE = VERDE;
  if (!VERDE) return ESC[i](e, t);
  ctx.fillStyle = C.verde; ctx.fillRect(0, 0, W, H);   // capa de frente: todo verde salvo lo de frente(…)
  REAL = ctx; DESCARTE.canvas.width = W; DESCARTE.canvas.height = H; ctx = DESCARTE;
  try { ESC[i](e, t); } finally { ctx = REAL; }
}

const CLAVES = ['cine_10', 'leer_00', 'pintar_03', 'musica_08', 'robot_01', 'yoga_06', 'cine_00'];
window.LISTO = Promise.all([
  Titulos.cargar(),
  cargarFotos(CLAVES.map(k => `fotos/${k}.jpg`)).then(ims => CLAVES.forEach((k, j) => FOTOS[k] = ims[j])),
  document.fonts.load(`800 100px "Bricolage Grotesque"`), document.fonts.load(`italic 400 100px "Instrument Serif"`), document.fonts.load(`400 100px "Instrument Serif"`),
  document.fonts.load(`500 60px Inter`), document.fonts.load(`600 60px Inter`), document.fonts.load(`700 60px Inter`), document.fonts.load(`800 60px Inter`),
]);
arrancar(draw);
</script>
</body>
