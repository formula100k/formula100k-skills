<!doctype html>
<!--
  ESTILO «Top 5» (top-five-ranking) · modo «Con tu video» · 9:16
  Qué es: arriba, un tablero numerado 1–5 (el 1 en acento) con el título chico encima; abajo, tú. Cada cosa que nombras
  cae a su fila con su foto real, en CUALQUIER orden (por ejemplo, de abajo hacia arriba como cuenta regresiva).
  La última que cayó lleva borde de acento. Subtítulo chico a la altura del pecho.
  persona: una caja propia abajo {"x":0,"y":940,"w":1080,"h":980} con "cara" bien puesta (la cabeza queda bajo el tablero).
  Piezas propias: tableroLleno (pieza común «tablero que se llena», eje 'filas', mini 'ficha'), subFrase y cargarFotosSuave.
  Para usarlo: cambia RUTAS, GANCHO, TITULO y COSAS ({k: palabra en que lo nombras, grupo: 0 = fila 1 … 4 = fila 5, texto, foto}).
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Con tu video · Top 5</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&display=swap">
<style>html,body{margin:0;background:#111}canvas{display:block;max-height:100vh;margin:0 auto}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Auto-Edición · modo «Con tu video». Esta pieza dibuja SOLO los gráficos: donde va tu video pinta verde #00FF00
// y video/componer.py pone tu video debajo. La escena «recorte» te pone encima de los gráficos (Depth UI, fondo que cambia).
// Lo que va DELANTE de ti en una escena recorte se dibuja dentro de frente(() => …) y se activa con la constante FRENTE.
// PALABRAS, PLANO y DUR los inyecta scripts/video.mjs.
const PALABRAS = __PALABRAS__;
const PLANO = __PLANO__;
const DUR = __DUR__;
const [W, H] = PLANO.formato === '16:9' ? [1920, 1080] : [1080, 1920];
const FPS = 30;
const VERDE = new URLSearchParams(location.search).has('verde');   // pasada de la capa de frente
const FRENTE = false;                                               // pon false si ninguna escena dibuja delante de ti
// Sobre el hueco verde dibuja solo cosas OPACAS: una sombra o un velo translúcido sobre verde queda como tinte verde encima de tu video.
const C = {
  verde: '#00FF00',                                         // solo para el hueco del video: no lo uses en gráficos
  fondo: '#202226', fondo2: '#141518', tarjeta: '#26282D', borde: 'rgba(255,255,255,.10)',
  blanco: '#FFFFFF', gris: 'rgba(255,255,255,.55)', tenue: 'rgba(255,255,255,.22)',
  acento: '#FF7A1A', bien: '#2FB85A', mal: '#E5383B',
  sans: 'Inter, -apple-system, Helvetica, Arial, sans-serif',
  diseno: '"Instrument Serif", Georgia, serif',             // la letra de diseño del tema (palabra clave)
  golpe: '"Bricolage Grotesque", Inter, sans-serif',        // la línea enorme del gancho
};
// arreglos de la transcripción (Whisper confunde nombres propios)
const CORREGIR = { 'cloud': 'Claude' };   // en minúscula; respeta la puntuación pegada («Cloud,» → «Claude,»)
PALABRAS.forEach(p => { const m = p.w.match(/^(.*?)([.,;:!?¿¡]*)$/); if (CORREGIR[m[1].toLowerCase()]) p.w = CORREGIR[m[1].toLowerCase()] + m[2]; });
const dicho = k => PALABRAS[k] ? PALABRAS[k].s : 1e9;   // segundo en que se dice la palabra k
</script>
<script src="../nucleo/nucleo.js"></script>
<script src="../nucleo/titulos.js"></script>
<script>
let FOTOS = {}, MODO_FRENTE = false;
// ---------- piezas del kit (planas: sin brillo, sin rebote; todo entra con corte seco) ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
let CONTORNO = 0;   // >0: contorno plano oscuro para el texto que va encima del video (se lee sobre cualquier fondo, sin brillo)
function tx(s, x, y, tam, peso = 700, color = C.blanco, alinear = 'center', fam = C.sans) {
  const it = /^italic /.test(fam); if (it) fam = fam.slice(7);   // «italic» va antes del peso en la fuente del canvas
  ctx.save(); ctx.font = `${it ? 'italic ' : ''}${peso} ${tam}px ${fam}`; ctx.fillStyle = color; ctx.textAlign = alinear; ctx.textBaseline = 'alphabetic';
  if (CONTORNO) { ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(4, tam * CONTORNO); ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillText(s, x, y); ctx.restore();
}
function tarjeta(x, y, w, h, o = {}) {
  ctx.save(); ctx.fillStyle = o.color || C.tarjeta; rr(x, y, w, h, o.r ?? 28); ctx.fill();
  ctx.strokeStyle = o.activa ? C.acento : C.borde; ctx.lineWidth = o.activa ? 4 : 2; ctx.stroke(); ctx.restore();
}
function hueco(x, y, w, h, r = 0) { ctx.save(); ctx.fillStyle = C.verde; if (r) { rr(x, y, w, h, r); ctx.fill(); } else ctx.fillRect(x, y, w, h); ctx.restore(); }
function fondo(oscuro = false) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, oscuro ? '#0E0F11' : C.fondo); g.addColorStop(1, C.fondo2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
// en la pasada de frente (?verde) la escena dibuja en un lienzo de descarte y solo frente(…) llega al lienzo real
const DESCARTE = document.createElement('canvas').getContext('2d'); let REAL = null;
function frente(fn) { if (!MODO_FRENTE) return; const c = ctx; ctx = REAL; fn(); ctx = c; }   // lo que va delante de ti (escenas «recorte»)
function detras(fn) { if (!MODO_FRENTE) fn(); }  // lo que va detrás de ti

// ---------- títulos con plantilla (las 21 plantillas de Titulos.lista) ----------
// Para el gancho: 'gigante' (palabra que llena el ancho), 'cartel', 'contraste', 'recorte', 'revista', 'pixel', 'sello', 'gastado', 'compinche', 'plumon'.
// NO uses 'titular' ni 'caramelo' en un gancho: traen brillo (regla de la casa: sin brillo ni degradado).
// Las líneas van con la palabra que manda entre *asteriscos*. PLANO.gancho / PLANO.titulo eligen la plantilla del reel.
// Van en la capa de GRÁFICOS, nunca dentro de frente(…): su sombra suave sobre el verde deja un borde verde. Ubícalos donde no tapen tu cara.
function titulo(lineas, t, o = {}) {
  if (t < (o.desde ?? 0) || (o.hasta != null && t >= o.hasta)) return;
  const pl = o.plantilla || PLANO.titulo || PLANO.gancho || 'gigante';
  const ancho = o.ancho ?? (W > H ? 1080 : W), x0 = o.x ?? (W - ancho) / 2;
  ctx.save(); ctx.translate(x0, 0);
  try { Titulos.dibujar(ctx, ancho, lineas.filter(Boolean), o.y ?? 300, pl, o.color || C.acento, { tamano: o.tamano ?? 1 }); } finally { ctx.restore(); }
}
// gancho golpe: línea chica + línea ENORME que se leen como UNA frase; entran con corte seco (sin animación)
function gancho(chica, enorme, t, o = {}) {
  const ls = [];
  if (chica && t >= (o.tChica ?? 0)) ls.push(chica);
  if (t >= (o.tEnorme ?? 0)) ls.push(`*${enorme.replace(/\*/g, '')}*`);
  if (!ls.length) return;
  titulo(o.enormeArriba ? ls.reverse() : ls, t, { ...o, plantilla: o.plantilla || PLANO.gancho || 'gigante', tamano: o.tamano ?? 1.2, y: o.y ?? 260 });
}

// subtítulo «ajustado»: la frase que se va diciendo, con su *clave* destacada por la plantilla de título del reel
// trozos = [[desdeK, hastaK, 'texto con *clave*'], …]  (índices de PALABRAS). y = arriba del bloque.
function subAjustado(t, trozos, y = 1080, sobreVideo = true, o = {}) {
  const tr = trozos.find(([a, b]) => t >= dicho(a) && t < (PALABRAS[b + 1] ? dicho(b + 1) : DUR)); if (!tr) return;
  const [a, , texto] = tr, ws = texto.split(' '); let k = -1;
  for (let i = 0; i < ws.length; i++) if (t >= dicho(a + i)) k = i;   // palabras ya dichas (secuencial, corte seco)
  const iClave = ws.findIndex(w => /\*/.test(w));
  const vis = (lista, base) => lista.filter((_, j) => base + j <= k).join(' ');
  if (iClave < 0) return titulo([vis(ws, 0)], t, { y, ...o });
  const antes = vis(ws.slice(0, iClave), 0), clave = k >= iClave ? ws[iClave] : '', despues = vis(ws.slice(iClave + 1), iClave + 1);
  titulo([antes, clave && despues ? `${clave} ${despues}` : clave].filter(Boolean), t, { y, ...o });
}

// lista de pasos que se acumula: el nuevo resalta, los anteriores se quedan atenuados
function pasos(x, y, w, items, t, o = {}) {   // items = [[k, 'texto', '✓'|'✗'|''], …]
  const h = o.h || 120, gap = o.gap || 22;
  items.forEach(([k, s, marca], i) => {
    if (t < dicho(k)) return;
    const ultimo = !items[i + 1] || t < dicho(items[i + 1][0]);
    tarjeta(x, y + i * (h + gap), w, h, { activa: ultimo });
    ctx.save(); ctx.globalAlpha = ultimo ? 1 : .55;
    tx(String(i + 1).padStart(2, '0'), x + 40, y + i * (h + gap) + h / 2 + 14, 36, 700, C.acento, 'left');
    tx(s, x + 120, y + i * (h + gap) + h / 2 + 16, 46, 700, C.blanco, 'left');
    if (marca) tx(marca, x + w - 50, y + i * (h + gap) + h / 2 + 18, 54, 800, marca === '✓' ? C.bien : C.mal, 'right');
    ctx.restore();
  });
}
// contador gigante: cifra en acento + rótulo chico
function contador(x, y, valor, rotulo, o = {}) {
  tarjeta(x, y, o.w || 420, o.h || 260);
  tx(rotulo, x + 36, y + 64, 32, 600, C.gris, 'left');
  tx(valor, x + 32, y + (o.h || 260) - 46, o.tam || 140, 800, o.color || C.acento, 'left');
}
// calendario de un mes; marcados = días resaltados
function calendario(x, y, w, mes, marcados = [], o = {}) {
  const h = w * 1.02; tarjeta(x, y, w, h);
  tx(mes, x + 40, y + 76, 48, 800, C.blanco, 'left'); tx(o.anio || '', x + w - 40, y + 76, 34, 600, C.gris, 'right');
  const c = (w - 80) / 7;
  ['L', 'M', 'X', 'J', 'V', 'S', 'D'].forEach((d, i) => tx(d, x + 40 + c * i + c / 2, y + 140, 28, 600, C.gris));
  for (let d = 1; d <= (o.dias || 31); d++) {
    const p = d - 1 + (o.empieza || 0), cx = x + 40 + (p % 7) * c, cy = y + 170 + Math.floor(p / 7) * c * .9;
    if (marcados.includes(d)) { ctx.save(); ctx.fillStyle = C.acento; rr(cx + 6, cy, c - 12, c * .8, 14); ctx.fill(); ctx.restore(); }
    tx(String(d), cx + c / 2, cy + c * .52, 32, marcados.includes(d) ? 800 : 500, marcados.includes(d) ? '#111' : C.blanco);
  }
}
// notificación plana tipo iOS (va delante de ti en Depth UI)
function notificacion(x, y, w, app, texto, o = {}) {
  ctx.save(); ctx.fillStyle = '#1E1F23'; rr(x, y, w, 150, 34); ctx.fill(); ctx.restore();
  ctx.save(); ctx.fillStyle = o.color || C.acento; rr(x + 28, y + 35, 80, 80, 20); ctx.fill(); ctx.restore();
  tx(o.icono || '★', x + 68, y + 92, 44, 800, '#111');
  tx(app, x + 132, y + 66, 30, 600, C.gris, 'left'); tx(texto, x + 132, y + 112, 40, 700, C.blanco, 'left');
  if (o.valor) tx(o.valor, x + w - 36, y + 98, 56, 800, o.colorValor || C.bien, 'right');
}
// tablero que se llena (top N / niveles): filas fijas; cada item cae a su fila cuando se dice
function tablero(x, y, w, titulo, filas, items, t) {   // items = [[k, fila, 'texto'], …]
  tx(titulo, x + w / 2, y, 54, 800, C.acento);
  filas.forEach((f, i) => {
    const fy = y + 40 + i * 110;
    ctx.save(); ctx.fillStyle = i === 0 ? C.acento : '#3A3C42'; rr(x, fy, 96, 92, 16); ctx.fill(); ctx.restore();
    tx(f, x + 48, fy + 64, 50, 800, i === 0 ? '#111' : C.blanco);
    tarjeta(x + 112, fy, w - 112, 92, { r: 16 });
    const it = items.find(([k, fila]) => fila === i && t >= dicho(k));
    if (it) tx(it[2], x + 150, fy + 62, 46, 700, C.blanco, 'left');
  });
}

// ================= TABLERO QUE SE LLENA · pieza común de la familia =================
// La misma pieza sirve para Ranking por niveles, Top 5, Siempre / Nunca, Lista rápida, Si / entonces y Explainer con panel.
// Todo es OPACO (se puede poner encima de tu video sin teñirlo de verde) y entra con corte seco: nada se desliza ni rebota.
//
// tableroLleno(t, o)
//   o.eje      'filas'    → una fila por grupo con su rótulo a la izquierda (S·A·B…, 1–5, 01·02·03)
//              'columnas' → una columna por grupo con su encabezado arriba (Siempre/Nunca, Si/entonces)
//              'lista'    → renglones numerados repartidos en columnas sueltas (Lista rápida: a los lados de tu cabeza)
//   o.x, o.y, o.w, o.h   la caja del tablero
//   o.grupos   [{ rotulo, color, tinta, fondo, fuente }]  color = rótulo/encabezado · fondo = cuerpo de la columna
//   o.items    [{ k, cae, grupo, texto, foto, color, n }]
//              k   = índice de la palabra en que aparece (dicho(k))
//              cae = palabra en que baja a su fila o columna (si no la pones, cae en k). Entre k y cae se ve la tarjeta grande.
//              foto = clave de FOTOS (captura o foto real). Si no hay foto, la tarjeta va solo con texto: nunca un marcador gris.
//   o.grande   { x, y, w, h }  dónde va la tarjeta grande del ítem que se está nombrando
//   o.grandeSigue  true: la tarjeta grande del último ítem dicho se queda hasta que se nombra el siguiente (Lista rápida)
//   o.mini     'ficha' (foto chica + texto al lado) · 'cuadro' (miniatura con el texto abajo; varias por fila)
//   o.T        true: tabla en T (encabezados en letra de diseño + dos líneas, sin cajas)
//   o.panel    color del fondo del tablero · null = sin fondo (cuando va sobre un fondo propio)
//   o.rotulo   ancho del rótulo ('filas') o alto del encabezado ('columnas')
//   o.fuente   letra de rótulos y títulos de tarjeta (por defecto C.golpe)
//   o.activa   color del borde del ítem recién llegado (por defecto C.acento)
//   lista:     o.columnas = [{ x, y }], o.porColumna, o.renglon (alto), o.tam (letra)
function fotoEn(clave, x, y, w, h, r = 12, fx = .5, fy = .4) {
  const im = FOTOS[clave]; if (!im) return false;
  ctx.save(); rr(x, y, w, h, r); ctx.clip(); ctx.fillStyle = '#000'; ctx.fillRect(x, y, w, h); fotoCover(im, x, y, w, h, fx, fy); ctx.restore(); return true;
}
function txAjustado(s, x, y, ancho, tamMax, peso, color, alinear, fam) {   // una línea que se achica hasta caber
  let tam = tamMax; while (tam > 18 && medir(s, `${peso} ${tam}px ${fam}`) > ancho) tam -= 2;
  tx(s, x, y, tam, peso, color, alinear, fam); return tam;
}
function miniFicha(it, x, y, w, h, activa, o) {   // foto chica a la izquierda + texto al lado
  ctx.save(); ctx.fillStyle = it.color || o.ficha || C.tarjeta; rr(x, y, w, h, 12); ctx.fill();
  ctx.strokeStyle = activa ? (o.activa || C.acento) : C.borde; ctx.lineWidth = activa ? 4 : 2; ctx.stroke(); ctx.restore();
  const p = Math.round(h * .12), lado = h - 2 * p, hayFoto = it.foto && FOTOS[it.foto];
  if (hayFoto) fotoEn(it.foto, x + p, y + p, lado * 1.3, lado, 8);
  const tx0 = hayFoto ? x + p * 2 + lado * 1.3 : x + p * 2;
  txAjustado(it.texto, tx0, y + h / 2 + h * .14, x + w - tx0 - p, o.tamFicha || Math.round(h * .4), 700, o.tintaFicha || C.blanco, 'left', o.fuenteFicha || C.sans);
}
function tamFichas(items, ancho, h, fam) {     // un solo tamaño de letra para todas las fichas del tablero (el de la más larga)
  const p = Math.round(h * .12), lado = h - 2 * p; let tam = Math.round(h * .4);
  for (const it of items) { const disp = ancho - (it.foto && FOTOS[it.foto] ? p * 3 + lado * 1.3 : p * 3);
    while (tam > 18 && medir(it.texto, `700 ${tam}px ${fam}`) > disp) tam -= 2; }
  return tam;
}
function miniCuadro(it, x, y, w, h, activa, o) {  // miniatura: foto que llena + franja con el texto abajo
  ctx.save(); ctx.fillStyle = it.color || C.tarjeta; rr(x, y, w, h, 10); ctx.fill(); ctx.restore();
  const franja = Math.round(h * .3);
  if (it.foto && FOTOS[it.foto]) fotoEn(it.foto, x, y, w, h - franja, 10);
  ctx.save(); ctx.fillStyle = '#0E0F11'; rr(x, y + h - franja, w, franja, 10); ctx.fill(); ctx.restore();
  txAjustado(it.texto.toUpperCase(), x + w / 2, y + h - franja * .3, w - 10, Math.round(franja * .62), 400, C.blanco, 'center', o.fuente || C.golpe);
  ctx.save(); ctx.strokeStyle = activa ? (o.activa || C.acento) : C.borde; ctx.lineWidth = activa ? 4 : 2; rr(x, y, w, h, 10); ctx.stroke(); ctx.restore();
}
function tarjetaGrande(it, b, o) {               // la tarjeta del ítem que se está nombrando: foto real arriba, nombre en letra de diseño abajo
  const banda = it.foto && FOTOS[it.foto] ? Math.round(b.h * .3) : b.h;
  ctx.save(); ctx.fillStyle = it.color || '#1B1C20'; rr(b.x, b.y, b.w, b.h, 24); ctx.fill(); ctx.restore();
  if (banda < b.h) fotoEn(it.foto, b.x + 14, b.y + 14, b.w - 28, b.h - banda - 14, 16, .5, it.fy ?? .4);
  const cy = b.y + b.h - banda / 2;
  if (it.n != null) {                             // numerada (Lista rápida): número grande + nombre
    tx(String(it.n), b.x + b.w / 2, cy + (banda < b.h ? -4 : -20), Math.round(Math.min(banda * .52, 200)), 800, C.blanco, 'center', o.fuente || C.golpe);
    txAjustado(it.texto, b.x + b.w / 2, cy + (banda < b.h ? banda * .34 : 90), b.w - 40, 46, 700, C.blanco, 'center', C.sans);
  } else txAjustado(o.mayus === false ? it.texto : it.texto.toUpperCase(), b.x + b.w / 2, cy + banda * .17, b.w - 50, Math.round(Math.min(banda * .5, 120)), 400, o.tintaGrande || C.blanco, 'center', o.fuente || C.golpe);
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; rr(b.x, b.y, b.w, b.h, 24); ctx.stroke(); ctx.restore();
}
function tableroLleno(t, o) {
  const items = o.items.map((it, i) => ({ ...it, i, cae: it.cae ?? it.k }));
  const dichos = items.filter(it => t >= dicho(it.k)).sort((a, b) => dicho(b.k) - dicho(a.k));
  const ultimo = dichos[0], llegados = items.filter(it => t >= dicho(it.cae));
  const recien = llegados.slice().sort((a, b) => dicho(b.cae) - dicho(a.cae))[0];   // el último que cayó: borde de acento
  const fam = o.fuente || C.golpe, n = o.grupos.length, gap = o.gap ?? 10;
  if (o.panel !== null) { ctx.save(); ctx.fillStyle = o.panel || '#141518'; rr(o.x - 18, o.y - 18, o.w + 36, o.h + 36, 26); ctx.fill(); ctx.restore(); }
  if (o.eje === 'filas') {
    const R = o.rotulo ?? 90, fh = (o.h - gap * (n - 1)) / n;
    if (o.mini !== 'cuadro') o = { ...o, tamFicha: tamFichas(items, o.w - R - 20, fh - 12, o.fuenteFicha || C.sans) };
    o.grupos.forEach((g, gi) => {
      const fy = o.y + gi * (fh + gap);
      ctx.save(); ctx.fillStyle = g.color; rr(o.x, fy, R, fh, 12); ctx.fill(); ctx.fillStyle = g.fondo || o.carril || '#1E1F23'; rr(o.x + R + 8, fy, o.w - R - 8, fh, 12); ctx.fill(); ctx.restore();
      txAjustado(g.rotulo, o.x + R / 2, fy + fh / 2 + Math.min(fh * .56, 64) * .36, R - 12, Math.min(fh * .56, 64), 800, g.tinta || '#111', 'center', g.fuente || fam);
      llegados.filter(it => it.grupo === gi).forEach((it, j) => {
        if (o.mini === 'cuadro') { const ch = fh - 12, cw = Math.round(ch * 1.25); miniCuadro(it, o.x + R + 16 + j * (cw + 10), fy + 6, cw, ch, it === recien, o); }
        else miniFicha(it, o.x + R + 14, fy + 6, o.w - R - 20, fh - 12, it === recien, o);
      });
    });
  } else if (o.eje === 'columnas') {
    const E = o.rotulo ?? 96, cw = (o.w - gap * (n - 1)) / n, ch = o.celda ?? 150;
    if (!o.celdaVertical) o = { ...o, tamFicha: tamFichas(items, cw - (o.T ? 36 : 20), ch, o.fuenteFicha || C.sans) };
    o.grupos.forEach((g, gi) => {
      const cx = o.x + gi * (cw + gap);
      if (o.T) tx(g.rotulo, cx + cw / 2, o.y + E * .72, E * .9, 400, g.color, 'center', g.fuente || fam);
      else {
        ctx.save(); ctx.fillStyle = g.color; rr(cx, o.y, cw, E, 12); ctx.fill(); ctx.fillStyle = g.fondo || '#1E1F23'; rr(cx, o.y + E + 8, cw, o.h - E - 8, 12); ctx.fill(); ctx.restore();
        txAjustado(g.rotulo, cx + cw / 2, o.y + E / 2 + E * .16, cw - 20, Math.round(E * .42), 800, g.tinta || '#111', 'center', g.fuente || fam);
      }
      llegados.filter(it => it.grupo === gi).forEach((it, j) => {
        const y0 = o.y + E + (o.T ? 26 : 22) + j * (ch + 14);
        if (o.celdaVertical) celdaVertical(it, cx + 10, y0, cw - 20, ch, it === recien, o);
        else miniFicha(it, cx + (o.T ? 18 : 10), y0, cw - (o.T ? 36 : 20), ch, it === recien, o);
      });
    });
    if (o.T) {   // la T: una línea bajo los encabezados y otra que separa las columnas
      ctx.save(); ctx.fillStyle = o.lineaT || 'rgba(235,235,235,1)';
      ctx.fillRect(o.x, o.y + E, o.w, 5);
      for (let gi = 1; gi < n; gi++) ctx.fillRect(o.x + gi * (cw + gap) - gap / 2 - 2.5, o.y + E, 5, o.h - E);
      ctx.restore();
    }
  } else if (o.eje === 'lista') {
    const por = o.porColumna, rh = o.renglon ?? 70, tam = o.tam ?? 36;
    o.columnas.forEach((c, ci) => {
      for (let r = 0; r < por; r++) {
        const num = ci * por + r + 1, y = c.y + r * rh, it = items.find(i => i.n === num && t >= dicho(i.k));
        tx(num + '.', c.x, y, tam, 700, it ? C.blanco : C.gris, 'left', C.sans);
        if (it) txAjustado(it.texto, c.x + tam * 1.35, y, (c.ancho ?? 280) - tam * 1.35, tam, 700, it === ultimo ? (o.activa || C.acento) : C.blanco, 'left', C.sans);
      }
    });
  }
  if (o.grande && ultimo) {
    const viaje = items.filter(it => t >= dicho(it.k) && t < dicho(it.cae)).sort((a, b) => dicho(b.k) - dicho(a.k))[0];
    const g = o.grandeSigue ? ultimo : viaje;
    if (g) tarjetaGrande(g, o.grande, o);

}
function celdaVertical(it, x, y, w, h, activa, o) {   // celda de rejilla: foto arriba, texto abajo (Si / entonces)
  ctx.save(); ctx.fillStyle = it.color || o.ficha || '#F4F4F2'; rr(x, y, w, h, 12); ctx.fill(); ctx.restore();
  const hayFoto = it.foto && FOTOS[it.foto], fh = hayFoto ? Math.round(h * .58) : 0;
  if (hayFoto) fotoEn(it.foto, x + 10, y + 10, w - 20, fh - 10, 8, .5, it.fy ?? .4);
  const lineas = it.texto.split('|'), zona = h - fh, tam = Math.round(Math.min(zona / (lineas.length + .6), o.tamCelda ?? 52));
  lineas.forEach((l, i) => txAjustado(l, x + w / 2, y + fh + zona / 2 + (i - (lineas.length - 1) / 2) * tam * 1.05 + tam * .35, w - 24, tam, 800, o.tintaFicha || '#111', 'center', o.fuenteFicha || C.sans));
  ctx.save(); ctx.strokeStyle = activa ? (o.activa || C.blanco) : 'rgba(0,0,0,.15)'; ctx.lineWidth = activa ? 6 : 2; rr(x, y, w, h, 12); ctx.stroke(); ctx.restore();
}
// subtítulo de una línea: las palabras salen de PALABRAS (lo que de verdad dijo) y entran de a una con corte seco.
// trozos = [[desdeK, hastaK, claveK?], …]; la palabra claveK va en letra de diseño, más grande y en acento.
// o: { tam, color, fam, famClave, colorClave, mayus, sobreVideo, ancho, x }
function subFrase(t, trozos, y, o = {}) {
  const tr = trozos.find(([a, b]) => t >= dicho(a) && t < (PALABRAS[b + 1] ? dicho(b + 1) : DUR)); if (!tr) return;
  const [a, b, kc] = tr, tam0 = o.tam ?? 54, fam = o.fam || C.sans, famC = o.famClave || ('italic ' + C.diseno), ancho = o.ancho ?? W - 120;
  const limpio = s => { s = s.replace(/[.,;:¿?¡!]+$/g, '').replace(/^[¿¡]/, ''); return o.mayus ? s.toUpperCase() : s; };
  const ws = []; for (let k = a; k <= b; k++) ws.push({ k, s: limpio(PALABRAS[k].w), clave: k === kc });
  const escC = o.escalaClave ?? 1.5, pesoC = o.pesoClave ?? 400;   // misma letra que el resto: famClave = fam, escalaClave ≈ 1.2, pesoClave = peso
  const fuente = (w, tam) => w.clave ? `${/^italic /.test(famC) ? 'italic ' : ''}${pesoC} ${Math.round(tam * escC)}px ${famC.replace(/^italic /, '')}` : `${o.peso ?? 700} ${tam}px ${fam}`;
  let tam = tam0, total;
  const mide = tm => ws.reduce((s, w) => s + medir(w.s, fuente(w, tm)), 0) + medir(' ', `700 ${tm}px ${fam}`) * (ws.length - 1);
  while ((total = mide(tam)) > ancho && tam > 24) tam -= 2;
  let x = (o.x ?? W / 2) - total / 2; const esp = medir(' ', `700 ${tam}px ${fam}`);
  CONTORNO = o.sobreVideo ? .08 : 0;
  try {
    for (const w of ws) {
      const ww = medir(w.s, fuente(w, tam));
      if (t >= dicho(w.k)) {
        if (w.clave) tx(w.s, x, y, Math.round(tam * escC), pesoC, o.colorClave || C.acento, 'left', famC);
        else tx(w.s, x, y, tam, o.peso ?? 700, o.color || C.blanco, 'left', fam);
      }
      x += ww + esp;
    }
  } finally { CONTORNO = 0; }
}
// carga las fotos sin romper el render si falta alguna (la tarjeta queda solo con texto)
function cargarFotosSuave(rutas) {
  const claves = Object.keys(rutas);
  return Promise.all(claves.map(k => new Promise(ok => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => { console.error('No encontré la foto: ' + rutas[k]); ok(null); }; im.src = rutas[k]; })))
    .then(ims => claves.forEach((k, j) => { if (ims[j]) FOTOS[k] = ims[j]; }));
}
// ================= fin del tablero que se llena =================

const RUTAS = { arte: 'fotos/arte.jpg', robotica: 'fotos/robotica.jpg', cine: 'fotos/cine.jpg', libros: 'fotos/libros.jpg' };
const GANCHO = ['clases de', 'ARTE'];   // [línea chica, LÍNEA ENORME]: lo que dices en los primeros segundos
const TITULO = { texto: 'estoy en *clases*', k: 7 };   // título del tablero con la *clave*; k = palabra en que lo dices
const PUESTOS = ['1', '2', '3', '4', '5'].map((r, i) => ({ rotulo: r, color: i === 0 ? C.acento : '#2E3036', tinta: i === 0 ? '#111' : C.blanco }));
// cuenta regresiva en el orden en que lo nombra: lo primero que dice va al 5 y lo último al 1
const COSAS = [
  { k: 6, grupo: 4, texto: 'Clases de arte', foto: 'arte' },
  { k: 12, grupo: 3, texto: 'Clases de robótica', foto: 'robotica' },
  { k: 21, grupo: 2, texto: 'Clases de cine', foto: 'cine' },
  { k: 25, grupo: 1, texto: 'Consumir lo que me gusta' },
  { k: 34, grupo: 0, texto: 'Volví a leer', foto: 'libros' },
];
const SUBS = [[0, 6, 6], [7, 12, 12], [13, 15], [16, 21, 21], [22, 27, 25], [28, 33], [34, 36, 36], [37, 40, 40]];
function topCinco(e, t) {
  fondo(true);
  const p = Array.isArray(e.persona) ? e.persona[0] : { y: 940 };
  hueco(0, p.y, W, H - p.y);
  if (t < dicho(TITULO.k)) gancho(GANCHO[0], GANCHO[1], t, { y: 60, tamano: .95 });     // gancho golpe (PLANO.gancho) desde el cuadro 0, encima del tablero
  else titulo([TITULO.texto], t, { y: 190, tamano: .8, desde: dicho(TITULO.k) });     // el título del tablero entra cuando lo dices
  tableroLleno(t, { eje: 'filas', x: 60, y: 350, w: 960, h: 540, grupos: PUESTOS, items: COSAS, mini: 'ficha', rotulo: 84, gap: 10, panel: null, carril: '#202227' });
  subFrase(t, SUBS, 1740, { tam: 46, peso: 600, sobreVideo: true, famClave: C.sans, escalaClave: 1.2, pesoClave: 800 });   // una sola letra
}
const ESC = [topCinco, topCinco, topCinco, topCinco, topCinco, topCinco];

function draw(f) {
  const t = f / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  let i = PLANO.escenas.findIndex(e => t >= e.desde && t < e.hasta); if (i < 0) i = PLANO.escenas.length - 1;
  const e = PLANO.escenas[i];
  MODO_FRENTE = VERDE;
  if (!VERDE) return ESC[i](e, t);
  ctx.fillStyle = C.verde; ctx.fillRect(0, 0, W, H);   // capa de frente: todo verde salvo lo de frente(…)
  REAL = ctx; DESCARTE.canvas.width = W; DESCARTE.canvas.height = H; ctx = DESCARTE;
  try { ESC[i](e, t); } finally { ctx = REAL; }
}

window.LISTO = Promise.all([
  Titulos.cargar(),
  cargarFotosSuave(RUTAS),
  document.fonts.load(`800 100px "Bricolage Grotesque"`), document.fonts.load(`italic 400 100px "Instrument Serif"`), document.fonts.load(`400 100px "Instrument Serif"`), document.fonts.load(`500 60px Inter`), document.fonts.load(`600 60px Inter`), document.fonts.load(`700 60px Inter`), document.fonts.load(`800 60px Inter`)
]);
arrancar(draw);
