<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Ejemplo mínimo de HTML libre: cumple el contrato de references/plantillas.md.
     Textos de relleno. Cambia --acento y la letra por las de tu marca (mi-marca.md). -->
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;600;800&display=block" rel="stylesheet">
<style>
  :root { --fondo: #f6f3ee; --tinta: #161616; --acento: #e4572e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #888; }
  .slide { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: var(--fondo);
    color: var(--tinta); font-family: 'Inter', sans-serif; padding: 110px 96px; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .eyebrow { font-weight: 800; font-size: 28px; letter-spacing: 3px; text-transform: uppercase; color: var(--acento); }
  h1 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 104px; line-height: 1.06; padding-bottom: .12em; }
  p { font-size: 40px; line-height: 1.4; max-width: 820px; }
  .check { display: flex; gap: 24px; align-items: flex-start; font-size: 44px; line-height: 1.3; }
  .check b { color: var(--acento); }
  .handle { position: absolute; left: 96px; bottom: 64px; font-size: 28px; font-weight: 600; opacity: .6; }
  .num { position: absolute; right: 96px; bottom: 64px; font-size: 28px; opacity: .45; }
</style>
</head>
<body>
  <section class="slide">
    <div class="eyebrow">Checklist</div>
    <h1>Lo que revisas antes de publicar</h1>
    <p>Texto de relleno para probar el render.</p>
    <div class="handle">@tuhandle</div><div class="num">1/2</div>
  </section>
  <section class="slide">
    <div class="check"><b>✓</b><span>La portada se entiende en un segundo.</span></div>
    <div class="check"><b>✓</b><span>Una idea por slide.</span></div>
    <div class="check"><b>✓</b><span>El cierre pide una palabra clave del tema.</span></div>
    <div class="handle">@tuhandle</div><div class="num">2/2</div>
  </section>
</body>
</html>
