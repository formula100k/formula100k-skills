<script>
// Línea «Claude explicado en tarjetas» · piloto 01 v2 = MIX de 3 refs:
//  IG Dfxmz3ggKQ5 (paleta crema, tarjetas planas, Claudito) + IG De96Bc9MIsZ y Dd6HP5tsQsu (algo cambia cada 0,3–0,6 s:
//  terminal que escribe, chat que entra, multitud de mascotas pixel, marcador rojo a mano, cursor que hace clic,
//  cámara que entra al detalle, subtítulo píldora oscura mono que se arma palabra por palabra).
// Tiempos de cada escena = segundos de la palabra en la voz (whisper por palabra), no fracciones.
const W = 1080, H = 1920, FPS = 30;
const C = { fondo: '#F1ECE3', durazno: '#EBC9AE', tarjeta: '#FBF8F2', naranja: '#D9653B', oscuro: '#26221F', tinta: '#1E1B18', gris: '#9A938A', linea: '#E4DDD2', rojo: '#D63C31', crema2: '#EFE8DC' };
const SANS = '"Inter Tight", Helvetica, Arial, sans-serif', SERIF = '"Instrument Serif", Georgia, serif', MONO = '"JetBrains Mono", Menlo, monospace';
const PAUSA = 0.25;
const LINEAS = [
  { d: 3.36, txt: 'Deja de copiar a mano los videos que te gustan: Claude los *clona.*', gancho: true },
  { d: 2.54, txt: 'Ayer vi un reel con un estilo que me *encantó.*' },
  { d: 1.45, txt: 'Le pasé el *link* a Claude.' },
  { d: 5.83, txt: 'Lo vio *cuadro* por cuadro y me sacó la *receta:* colores, letra y cada cuánto cambia la pantalla.' },
  { d: 2.52, txt: 'Le di mi *idea* y armó el video con ese *estilo.*' },
  { d: 2.49, txt: 'Sin *editora* y sin gastar *créditos* de video.' },
  { d: 2.33, txt: 'Este video que estás viendo salió *así.*' },
];
// subtítulos: grupos separados por |, palabra:segundo, * = clave
const SUBS = [
  '',
  'Ayer:0 vi:.29 un:.44 *reel:.59 | con:.89 un:1.11 *estilo:1.26 | que:1.71 me:1.93 *encantó:2.08',
  'Le:0 pasé:.24 el:.49 *link:.65 | a:.98 Claude:1.06',
  'Lo:0 vio:.14 *cuadro:.35 | por:.85 cuadro:1.05 | y:1.52 me:1.55 sacó:1.70 | la:2.00 *receta:2.15 | *colores:2.90 | *letra:3.58 | y:4.13 cada:4.27 cuánto:4.50 | cambia:4.96 la:5.26 *pantalla:5.39',
  'Le:0 di:.13 mi:.26 *idea:.39 | y:.65 armó:.71 el:.96 video:1.09 | con:1.43 ese:1.61 *estilo:1.80',
  'Sin:.07 *editora:.24 | y:.86 sin:.88 gastar:1.10 | *créditos:1.60 de:2.20 video:2.36',
  'Este:0 video:.28 | que:.63 estás:.89 viendo:1.19 | salió:1.63 *así:1.96',
].map(s => s ? s.split('|').map(g => g.trim().split(' ').map(w => { const [p, t] = w.split(':'); return { s: p.replace('*', ''), t: +t, clave: p.startsWith('*') }; })) : []);
const INICIOS = []; { let a = 0; for (const l of LINEAS) { INICIOS.push(a); a += l.d + PAUSA; } }
const DUR = INICIOS.at(-1) + LINEAS.at(-1).d + 0.6;

<script src="../nucleo/nucleo.js"></script>
<script>
let F = {};
const NOMBRES = ['ref1', 'ref2', 'ref3', 'ref4', 'ref5', 'ref6', 'hoja', 'mio1', 'mio2', 'mio3', 'mio4'];
const cargaUna = (n) => new Promise(ok => { const im = new Image(); im.onload = () => ok([n, im]); im.onerror = () => ok([n, null]); im.src = 'fotos/' + n + (n === 'hoja' || n.startsWith('ref') ? '.jpg' : '.png'); });
window.LISTO = Promise.all([
  Promise.all(NOMBRES.map(cargaUna)).then(r => { F = Object.fromEntries(r); }),
  document.fonts.load(`900 100px ${SANS}`), document.fonts.load(`800 100px ${SANS}`), document.fonts.load(`600 40px ${SANS}`),
  document.fonts.load(`italic 100px ${SERIF}`), document.fonts.load(`500 30px ${MONO}`), document.fonts.load(`700 30px ${MONO}`), document.fonts.load(`800 30px ${MONO}`),
]);

// ---------- piezas base ----------
function txt(s, x, y, tam, { peso = 800, color = C.tinta, al = 'left', fam = SANS } = {}) {
  ctx.save(); ctx.font = fam === SERIF ? `italic ${tam}px ${SERIF}` : `${peso} ${tam}px ${fam}`;
  ctx.fillStyle = color; ctx.textAlign = al; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); ctx.restore();
}
function ancho(s, tam, peso = 800, fam = SANS) { ctx.save(); ctx.font = `${peso} ${tam}px ${fam}`; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function tarjeta(x, y, w, h, { oscura = false, r = 26 } = {}) {
  ctx.save(); ctx.shadowColor = 'rgba(80,50,20,.14)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 14;
  ctx.fillStyle = oscura ? C.oscuro : C.tarjeta; rr(x, y, w, h, r); ctx.fill(); ctx.restore();
  if (!oscura) { ctx.save(); ctx.strokeStyle = C.linea; ctx.lineWidth = 2; rr(x, y, w, h, r); ctx.stroke(); ctx.restore(); }
}
function semaforo(x, y) { ['#E36A5A', '#E8B04A', '#7FB069'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + i * 30, y, 9, 0, 7); ctx.fill(); }); }
function foto(im, x, y, w, h, r = 18, desenfoque = 0, fx = .5, fy = .3) {
  if (!im) { ctx.save(); ctx.fillStyle = C.linea; rr(x, y, w, h, r); ctx.fill(); ctx.restore(); return; }
  ctx.save(); rr(x, y, w, h, r); ctx.clip(); if (desenfoque) ctx.filter = `blur(${desenfoque}px)`; fotoCover(im, x, y, w, h, fx, fy); ctx.restore();
}
// un cuadro de la hoja real (8 columnas × 5 filas)
function cuadroHoja(n, x, y, w, h, r = 10) {
  const im = F.hoja; if (!im) return foto(null, x, y, w, h, r);
  const cw = im.width / 8, ch = im.height / 5, c = n % 8, f = Math.floor(n / 8) % 5;
  ctx.save(); rr(x, y, w, h, r); ctx.clip(); ctx.drawImage(im, c * cw, f * ch, cw, ch, x, y, w, h); ctx.restore();
}
function fondo() {
  ctx.fillStyle = C.fondo; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * .5, H * 1.02, 60, W * .5, H * 1.02, 900);
  g.addColorStop(0, 'rgba(235,201,174,.85)'); g.addColorStop(1, 'rgba(235,201,174,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function chip(s, x, y, { tam = 30, fondoC = C.naranja, color = C.tarjeta, al = 'center', fam = SANS, peso = 800 } = {}) {
  ctx.save(); ctx.font = `${peso} ${tam}px ${fam}`; const w = ctx.measureText(s).width + tam * .8, h = tam * 1.45;
  const x0 = al === 'center' ? x - w / 2 : x; ctx.fillStyle = fondoC; rr(x0, y - h * .72, w, h, 10); ctx.fill();
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(s, x0 + tam * .4, y); ctx.restore(); return w;
}
function etiqueta(s, x, y, { color = C.gris, al = 'left', tam = 22 } = {}) { txt(s.toUpperCase(), x, y, tam, { peso: 500, fam: MONO, color, al }); }
// texto que se escribe letra por letra (terminal / chat)
function tecleo(s, x, y, tam, p, { color = C.tinta, fam = MONO, peso = 500, cursor = true } = {}) {
  const n = Math.floor(s.length * clamp(p)); txt(s.slice(0, n), x, y, tam, { color, fam, peso });
  if (cursor && p < 1.05 && Math.floor(FR / 8) % 2 === 0) { const w = ancho(s.slice(0, n), tam, peso, fam); ctx.fillStyle = color; ctx.fillRect(x + w + 3, y - tam * .8, tam * .5, tam); }
}

// ANATOMIA: estilizada — Claudito es pixel art de 10×6 cuadritos (brazos de 1 cuadrito), sin manos ni cara vectorial
// ---------- Claudito ACTOR (pixel): ojos, cejas, brazos, gorros — actúa cada escena como las mascotas de las refs ----------
const CUERPO = ['..XXXXXX..', '.XXXXXXXX.', 'XXXXXXXXXX', 'XXXXXXXXXX', '.XXXXXXXX.'];
const PATAS = ['.X.X..X.X.', 'X..X..X..X'];
const COLORES = ['#D9653B', '#E8A15C', '#6F9BD6', '#7DB47A', '#B784D1', '#E36A5A', '#4FB3AE', '#E9B949'];
const OJOS = {
  normal: [[2, 2], [7, 2]], der: [[3, 2], [8, 2]], izq: [[1, 2], [6, 2]],
  enojo: [[2, 2], [7, 2], [2, 1], [3, 2], [7, 1], [6, 2]],
  feliz: [[1, 3], [2, 2], [3, 3], [6, 3], [7, 2], [8, 3]],
  sorpresa: [[2, 1], [2, 2], [7, 1], [7, 2]],
  cerrado: [[1, 2], [2, 2], [3, 2], [6, 2], [7, 2], [8, 2]],
};
const CORAZON_OJOS = [[1, 2], [3, 2], [2, 3], [6, 2], [8, 2], [7, 3]];
// brazo derecho (columnas 10+); el izquierdo es su espejo (9 - x)
const BRAZOS = {
  abajo: [[10, 3], [10, 4]], lado: [[10, 3], [11, 3]], arriba: [[10, 2], [10, 1], [10, 0]],
  adelante: [[10, 3], [11, 3], [12, 3]], alto: [[10, 2], [11, 1], [12, 0], [12, -1]],
  golpe: [[10, 3], [11, 4], [12, 5], [13, 5]], escribe: [[10, 3], [11, 4], [12, 4]], nada: [],
};
const mezcla = (a, b, t) => { const h = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = h(a), B = h(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); };
function claudito(x, y, p, o = {}) {
  const { color = C.naranja, ojos = 'normal', bi = 'abajo', bd = 'abajo', paso: ps = 0, rojo = 0, gorro = null, espejo = false } = o;
  const col = rojo ? mezcla(color, '#C0261C', rojo) : color;
  const px = (i, j, c) => { ctx.fillStyle = c; ctx.fillRect(x + (espejo ? 9 - i : i) * p, y + j * p, p + .5, p + .5); };
  CUERPO.forEach((fila, j) => [...fila].forEach((c, i) => { if (c !== '.') px(i, j, col); }));
  [...PATAS[ps % 2]].forEach((c, i) => { if (c === 'X') px(i, 5, col); });
  BRAZOS[bd].forEach(([i, j]) => px(i, j, col));
  BRAZOS[bi].forEach(([i, j]) => px(9 - i, j, col));
  if (ojos === 'corazon') CORAZON_OJOS.forEach(([i, j]) => px(i, j, '#8E1222'));
  else OJOS[ojos].forEach(([i, j]) => px(i, j, C.oscuro));
  if (gorro === 'chef') { ['...XXXX...', '..XXXXXX..', '..XXXXXX..', '...XXXX...'].forEach((f, j) => [...f].forEach((c, i) => { if (c === 'X') { px(i, j - 4, '#FFFFFF'); ctx.strokeStyle = C.linea; ctx.lineWidth = 1; ctx.strokeRect(x + (espejo ? 9 - i : i) * p, y + (j - 4) * p, p, p); } })); }
  if (gorro === 'casco') { ['..XXXXXX..', 'XXXXXXXXXX'].forEach((f, j) => [...f].forEach((c, i) => { if (c === 'X') px(i, j - 2, '#E9B949'); })); }
}
// punto de la mano derecha (o izquierda) en pantalla, para pegarle lápiz, cuchara, lupa…
function mano(x, y, p, brazo, izq = false) { const b = BRAZOS[brazo].at(-1); const i = izq ? 9 - b[0] : b[0]; return [x + i * p + p / 2, y + b[1] * p + p / 2]; }
function bicho(x, y, p, color = C.naranja, ps = 0, ojos = 'normal') { claudito(x, y, p, { color, paso: ps, ojos }); }
const paso = (sem = 0) => Math.floor(FR / 5 + sem) % 2;
function corazon(x, y, p, c = '#E0483E') { ['.X.X.', 'XXXXX', '.XXX.', '..X..'].forEach((f, j) => [...f].forEach((k, i) => { if (k === 'X') { ctx.fillStyle = c; ctx.fillRect(x + i * p, y + j * p, p + .5, p + .5); } })); }
function vapor(x, y, u, s = 1) { for (let k = 0; k < 3; k++) { const f = ((u * 2.2 + k / 3) % 1); ctx.save(); ctx.globalAlpha = .55 * (1 - f); ctx.fillStyle = '#9A938A'; ctx.beginPath(); ctx.arc(x + (k - 1) * 26 * s, y - f * 90 * s, (12 + 10 * f) * s, 0, 7); ctx.fill(); ctx.restore(); } }
function laptop(x, y, w, h, abierta, contenido) {
  // y = línea de la base; la tapa crece hacia arriba
  const hh = h * clamp(abierta);
  ctx.fillStyle = '#3A3430'; rr(x - 14, y - 4, w + 28, 18, 6); ctx.fill();
  if (hh > 6) { ctx.fillStyle = C.oscuro; rr(x, y - hh, w, hh, 12); ctx.fill(); ctx.save(); rr(x + 10, y - hh + 10, w - 20, hh - 20, 6); ctx.clip(); contenido && contenido(x + 10, y - hh + 10, w - 20, hh - 20); ctx.restore(); }
  else { ctx.fillStyle = C.oscuro; ctx.fillRect(x, y - 10, w, 8); }
}
function impacto(x, y, t) { if (t < 0 || t > .5) return; ctx.save(); ctx.strokeStyle = C.tinta; ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (let k = 0; k < 7; k++) { const a = -Math.PI + k * Math.PI / 6, r1 = 40 + 30 * t, r2 = 85 + 50 * t; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); ctx.stroke(); } ctx.restore(); }
// cierre con CTA propio (para quien no usa un cierre aparte): Claudito sostiene el cartel con la palabra
function cartelCTA(u, palabra, chica = 'y te lo regalo') {
  txt('Comenta', 540, 640, 90, { peso: 900, al: 'center' });
  if (u >= .25) chip(palabra.toUpperCase(), 540, 820, { tam: 120, fam: SANS, peso: 900 });
  if (u >= .6) txt(chica, 540, 960, 70, { fam: SERIF, color: C.naranja, al: 'center' });
  claudito(450, 1240 - 6 * 18, 18, { bi: 'arriba', bd: Math.floor(u / .2) % 2 ? 'arriba' : 'alto', ojos: 'feliz' });
}
function exclama(x, y, p) { ctx.fillStyle = C.naranja; ctx.fillRect(x, y, p, p * 3); ctx.fillRect(x, y + p * 4, p, p); }

// ---------- marcador rojo a mano, cursor y clic ----------
function marcador(pts, p, { color = C.rojo, gros = 9 } = {}) {
  if (p <= 0) return; const n = Math.max(2, Math.round(pts.length * clamp(p)));
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = gros; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = .92;
  ctx.beginPath(); pts.slice(0, n).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); ctx.restore();
}
function ovalo(cx, cy, rx, ry, sem = 1) { const pts = []; for (let i = 0; i <= 60; i++) { const a = -2.2 + i / 60 * 6.9, w = 1 + .04 * Math.sin(i * .7 + sem); pts.push([cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]); } return pts; }
function raya(x1, y1, x2, y2, sem = 1) { const pts = []; for (let i = 0; i <= 30; i++) { const t = i / 30; pts.push([lerp(x1, x2, t), lerp(y1, y2, t) + 4 * Math.sin(t * 9 + sem)]); } return pts; }
function cursor(x, y, clic = -1) {
  if (clic >= 0 && clic < .4) { const r = 18 + 70 * clic; ctx.save(); ctx.strokeStyle = 'rgba(30,27,24,' + (.5 - clic) + ')'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.restore(); }
  ctx.save(); ctx.translate(x, y); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 52); ctx.lineTo(13, 40); ctx.lineTo(23, 62); ctx.lineTo(32, 58); ctx.lineTo(22, 37); ctx.lineTo(39, 37); ctx.closePath();
  ctx.fillStyle = C.tinta; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
}
// recorrido del cursor: [[t,x,y],...]
function ruta(keys, u) { let [, x, y] = keys[0]; for (let j = 1; j < keys.length; j++) { const [t, xx, yy] = keys[j], a = ease(prog(u, t - .35, t)); x = lerp(x, xx, a); y = lerp(y, yy, a); } return [x, y]; }

// ---------- subtítulo: píldora oscura mono, se arma palabra por palabra (corte seco) ----------
function subtitulo(i, u) {
  const G = SUBS[i]; if (!G.length) return;
  let g = G.findLastIndex(gr => u >= gr[0].t); if (g < 0) return;
  const pals = G[g].filter(w => u >= w.t); const tam = 46, esp = 18;
  ctx.save(); ctx.font = `800 ${tam}px ${MONO}`;
  const ws = pals.map(w => ctx.measureText(w.s.toUpperCase()).width); const tot = ws.reduce((a, b) => a + b, 0) + esp * (pals.length - 1);
  const pad = 30, h = 82, y = 1420; ctx.fillStyle = C.oscuro; rr(W / 2 - tot / 2 - pad, y - h / 2, tot + pad * 2, h, 14); ctx.fill();
  let x = W / 2 - tot / 2; ctx.textBaseline = 'middle';
  pals.forEach((w, k) => { ctx.fillStyle = w.clave ? '#F08A5D' : C.tarjeta; ctx.fillText(w.s.toUpperCase(), x, y + 3); x += ws[k] + esp; });
  ctx.restore();
}

// ---------- cámara que entra al detalle: [[t, cx, cy, zoom], ...] ----------
function camara(keys, u) { let [, cx, cy, z] = keys[0]; for (let j = 1; j < keys.length; j++) { const [t, x, y, zz] = keys[j], a = ease(prog(u, t, t + .32)); cx = lerp(cx, x, a); cy = lerp(cy, y, a); z = lerp(z, zz, a); } return [cx, cy, z]; }


const CAM = [
  [[0, 540, 880, 1]],
  [[0, 540, 820, 1.0], [1.2, 620, 700, 1.14], [1.95, 520, 860, 1.06]],
  [[0, 560, 1000, 1.12], [1.0, 600, 900, 1.06]],
  [[0, 540, 880, 1.0], [1.45, 520, 980, 1.06], [2.8, 430, 580, 1.14], [3.5, 440, 800, 1.15], [4.2, 540, 1080, 1.12], [5.3, 540, 840, 1.0]],
  [[0, 540, 560, 1.08], [.65, 540, 840, 1.0], [1.75, 600, 980, 1.08]],
  [[0, 540, 560, 1.1], [.85, 540, 860, 1.0], [1.85, 520, 1040, 1.12]],
  [[0, 540, 840, 1.0], [.85, 540, 660, 1.12], [1.6, 600, 900, 1.06]],
];

const ESC = [
  // 0 · GANCHO: Claudito copia a mano el reel, se frustra y golpea la laptop → «Claude los clona» → ×12
  (u) => {
    txt('NO COPIES', 540, 700, 150, { peso: 900, al: 'center' });
    txt('A MANO', 540, 840, 150, { peso: 900, al: 'center' });
    txt('clona el estilo', 540, 922, 74, { fam: SERIF, color: C.naranja, al: 'center' });
    const mesa = 1290;
    if (u < 3.05) {
      // escena actuada en grande: se escala desde el borde de arriba (anclada al bloque del gancho)
      ctx.save(); ctx.translate(540, 985); ctx.scale(1.45, 1.45); ctx.translate(-540, -840 - 222);
      ctx.fillStyle = '#D9B898'; rr(180, mesa, 720, 20, 8); ctx.fill();
      // la laptop con el reel que le gustó (real, desenfocado)
      const abierta = u < 1.9 ? 1 : (u < 2.4 ? 1 - prog(u, 1.9, 1.97) : prog(u, 2.4, 2.52));
      laptop(595, mesa, 285, 200, abierta, (x, y, w, h) => {
        if (u < 2.4) foto(F['ref' + (2 + Math.floor(u / .22) % 5)], x, y, w, h, 4, 3);
        else { ctx.fillStyle = C.tarjeta; ctx.fillRect(x, y, w, h); txt('✳', x + w / 2, y + h / 2 + 10, 90, { color: C.naranja, peso: 900, al: 'center' }); txt('Claude', x + w / 2, y + h - 22, 30, { fam: MONO, peso: 800, al: 'center' }); }
      });
      // la hoja donde copia a mano
      const hx = 200, hy = 1065, hw = 165, hh = 220;
      ctx.save(); ctx.translate(hx + hw / 2, hy + hh / 2); ctx.rotate(-.05); ctx.translate(-hx - hw / 2, -hy - hh / 2); tarjeta(hx, hy, hw, hh, { r: 8 });
      const cont = [...raya(hx + 25, hy + 30, hx + hw - 30, hy + 40, 1), ...raya(hx + hw - 30, hy + 40, hx + hw - 40, hy + hh - 40, 2), ...raya(hx + hw - 40, hy + hh - 40, hx + 30, hy + hh - 30, 3), ...raya(hx + 30, hy + hh - 30, hx + 25, hy + 30, 4)];
      const lin = raya(hx + 45, hy + 90, hx + hw - 60, hy + 105, 5), lin2 = raya(hx + 45, hy + 140, hx + hw - 80, hy + 130, 6);
      const zig = []; for (let k = 0; k <= 9; k++) zig.push([hx + 30 + (k % 2) * (hw - 60), hy + 50 + k * 15 + 8 * Math.sin(k)]);
      marcador(cont, prog(u, 0, .7), { gros: 5, color: C.tinta }); marcador(lin, prog(u, .6, .85), { gros: 10, color: C.tinta }); marcador(lin2, prog(u, .8, 1.0), { gros: 10, color: C.tinta });
      marcador(zig, prog(u, 1.15, 1.6), { gros: 7, color: C.rojo });
      ctx.restore();
      // Claudito
      const P = 15, cx = 392, cy = mesa - 6 * P;
