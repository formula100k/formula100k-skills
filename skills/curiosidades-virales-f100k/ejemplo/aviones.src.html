// Clon de edición de un reel de @viani.pro («¿Por qué los aviones no vuelan en línea recta?»), con marca propia.
// Todo el mapa se reproyecta por píxel desde la textura satelital de la NASA (Blue Marble): Mercator, globo y gajos.
// Letra (edición sin olor a IA): Inter 900 para la palabra clave, Instrument Serif itálica para los conectores, corte seco, sin entrada animada.
const W = 1080, H = 1920, FPS = 30;
const C = { fondo: '#050509', tinta: '#f4f1ea', oro: '#F5C542', rojo: '#E5484D', pelo: '#24242e', carbon: '#0b0b10', hilo: '#ff5a4f' };
const PAUSA = 0.28;
// CTA: la palabra y lo que se manda (el regalo de la persona). La captura de su página va en assets/regalo-pagina-completa.jpg.
const PALABRA = 'GUIA', REGALO = ['y te mando', 'la guía'];
// una frase = una escena · *palabra* = clave (grande, dorada)
const LINEAS = [
  { d: 1.44, txt: 'Tu mapa te miente.' },
  { d: 1.81, txt: 'Mira este vuelo de *Santiago* a *Sídney*.' },
  { d: 3.68, txt: 'En vez de cruzar derecho el océano, baja casi hasta la *Antártida*.' },
  { d: 3.92, txt: 'Parece un desvío enorme. Pero esa curva es el camino más *corto*.' },
  { d: 3.29, txt: 'Son unos *1.400 kilómetros* menos que ir derecho.' },
  { d: 3.65, txt: 'El que te engaña es el *mapa*. La Tierra es una *pelota*.' },
  { d: 4.4, txt: 'Y aplanar una pelota es como aplastar la cáscara de una *naranja*: se *rompe*.' },
  { d: 4.08, txt: 'Para tapar los huecos, el mapa *estira* todo lo que está cerca de los polos.' },
  { d: 2.8, txt: 'Por eso *Groenlandia* parece tan grande como *África*.' },
  { d: 2.56, txt: 'Pero África es *catorce veces* más grande.' },
  { d: 3.62, txt: 'Ahora pon un *hilo* tenso sobre el globo, de Santiago a Sídney.' },
  { d: 3.2, txt: 'El hilo se va al sur, donde la Tierra es más *angosta*.' },
  { d: 3.28, txt: 'Al aplanarla en el mapa, ese hilo recto se ve *torcido*.' },
  { d: 3.32, txt: 'El avión sí vuela recto. El torcido es el *mapa*.' },
  { d: 3.2, txt: 'Este video lo hizo *Claude*, sin cámara y sin editor.' },
  { d: 4.16, txt: 'Comenta *GUIA* y te mando la *guía* para hacer videos así.' },
];
const INICIOS = []; { let a = 0; for (const l of LINEAS) { INICIOS.push(a); a += l.d + PAUSA; } }
const DUR = INICIOS.at(-1) + LINEAS.at(-1).d + 1.4;

<script>
// ---------------- geografía ----------------
const RAD = Math.PI / 180, R_KM = 6371;
const SCL = [-70.79, -33.39], SYD = [151.18, -33.95];
const wrapPi = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const mercY = lat => Math.log(Math.tan(Math.PI / 4 + lat / 2));
const vec = ([lo, la]) => [Math.cos(la * RAD) * Math.cos(lo * RAD), Math.cos(la * RAD) * Math.sin(lo * RAD), Math.sin(la * RAD)];
// ortodrómica (el hilo tenso) y loxodrómica (la «recta» del mapa), de Santiago a Sídney
const ORTO = (() => { const a = vec(SCL), b = vec(SYD), om = Math.acos(a[0] * b[0] + a[1] * b[1] + a[2] * b[2]), o = [];
  for (let i = 0; i <= 240; i++) { const t = i / 240, s1 = Math.sin((1 - t) * om) / Math.sin(om), s2 = Math.sin(t * om) / Math.sin(om);
    const x = s1 * a[0] + s2 * b[0], y = s1 * a[1] + s2 * b[1], z = s1 * a[2] + s2 * b[2];
    o.push([Math.atan2(y, x) / RAD, Math.asin(z) / RAD]); } return o; })();
const LOXO = (() => { const o = [], m0 = mercY(SCL[1] * RAD), m1 = mercY(SYD[1] * RAD), l0 = SCL[0], l1 = SYD[0] - 360;   // hacia el oeste
  for (let i = 0; i <= 240; i++) { const t = i / 240; o.push([l0 + (l1 - l0) * t, Math.atan(Math.sinh(m0 + (m1 - m0) * t)) / RAD]); } return o; })();

// ---------------- textura ----------------
let TEX, TW, TH, OUT;
const imgTierra = new Image(); imgTierra.src = 'assets/earth-blue-marble.jpg';
const imgRegalo = new Image(); imgRegalo.src = 'assets/regalo-pagina-completa.jpg';   // la página del regalo entera (390 px de ancho a 560): scripts/capturar-pagina.mjs
const cargada = im => new Promise((ok, mal) => { if (im.complete && im.naturalWidth) ok(); else { im.onload = ok; im.onerror = () => mal(new Error(im.src)); } });

// ---------------- vistas (reproyección por píxel) ----------------
// Mercator: lon0 (centro, grados), mC (mercY del centro), k (px por radián), cy (fila del centro)
function vistaMerc(v) {
  const d = OUT.data, lon0 = v.lon0 * RAD, filas = new Int32Array(H), cols = new Int32Array(W), vale = new Uint8Array(H);
  for (let y = 0; y < H; y++) { const m = v.mC - (y - v.cy) / v.k, la = Math.atan(Math.sinh(m)); vale[y] = Math.abs(la) < 85 * RAD;
    filas[y] = Math.min(TH - 1, Math.max(0, Math.floor((0.5 - la / Math.PI) * TH))) * TW; }
  for (let x = 0; x < W; x++) { const lo = wrapPi(lon0 + (x - W / 2) / v.k); cols[x] = Math.min(TW - 1, Math.floor((lo / (2 * Math.PI) + 0.5) * TW)); }
  const os = v.oscuro ?? .86;
  for (let y = 0; y < H; y++) { let p = y * W * 4; const f = filas[y];
    if (!vale[y]) { for (let x = 0; x < W; x++, p += 4) { d[p] = 5; d[p + 1] = 5; d[p + 2] = 9; d[p + 3] = 255; } continue; }
    for (let x = 0; x < W; x++, p += 4) { const t = (f + cols[x]) * 4; d[p] = TEX[t] * os; d[p + 1] = TEX[t + 1] * os; d[p + 2] = TEX[t + 2] * os; d[p + 3] = 255; } }
  ctx.putImageData(OUT, 0, 0);
}
const projMerc = (v, [lo, la]) => [W / 2 + wrapPi((lo - v.lon0) * RAD) * v.k, v.cy - (mercY(la * RAD) - v.mC) * v.k];

// Globo ortográfico: centro (cx, cy), radio r, mirando a (lon0, lat0)
function vistaGlobo(v) {
  fondoEstrellas();
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  const sl = Math.sin(v.lat0 * RAD), cl = Math.cos(v.lat0 * RAD), lon0 = v.lon0 * RAD, r = v.r;
  const y0 = Math.max(0, Math.floor(v.cy - r)), y1 = Math.min(H - 1, Math.ceil(v.cy + r));
  for (let y = y0; y <= y1; y++) { const yy = -(y - v.cy) / r;
    for (let x = Math.max(0, Math.floor(v.cx - r)); x <= Math.min(W - 1, Math.ceil(v.cx + r)); x++) {
      const xx = (x - v.cx) / r, rho2 = xx * xx + yy * yy; if (rho2 > 1) continue;
      const z = Math.sqrt(1 - rho2), la = Math.asin(z * sl + yy * cl), lo = wrapPi(lon0 + Math.atan2(xx, z * cl - yy * sl));
      const t = (Math.min(TH - 1, Math.floor((0.5 - la / Math.PI) * TH)) * TW + Math.min(TW - 1, Math.floor((lo / (2 * Math.PI) + 0.5) * TW))) * 4;
      const luz = .42 + .58 * Math.pow(z, .6), p = (y * W + x) * 4, a = clamp((1 - Math.sqrt(rho2)) * r / 1.5);   // borde suave de 1,5 px
      d[p] = lerp(d[p], TEX[t] * luz, a); d[p + 1] = lerp(d[p + 1], TEX[t + 1] * luz, a); d[p + 2] = lerp(d[p + 2], TEX[t + 2] * luz, a);
    } }
  ctx.putImageData(img, 0, 0);
  ctx.save(); ctx.strokeStyle = 'rgba(140,190,255,.55)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(v.cx, v.cy, r + 2, 0, 7); ctx.stroke(); ctx.restore();
}
function projGlobo(v, [lo, la]) {
  const sl = Math.sin(v.lat0 * RAD), cl = Math.cos(v.lat0 * RAD), p = la * RAD, l = (lo - v.lon0) * RAD;
  const cosc = sl * Math.sin(p) + cl * Math.cos(p) * Math.cos(l);
  return [v.cx + v.r * Math.cos(p) * Math.sin(l), v.cy - v.r * (cl * Math.sin(p) - sl * Math.cos(p) * Math.cos(l)), cosc > 0];
}

// Gajos de naranja → Mercator. s = 0: 12 gajos (la cáscara aplastada) · s = 1: Mercator completo.
function vistaGajos(v, s) {
  const d = OUT.data, n = 12, ancho = 2 * Math.PI / n;
  for (let y = 0; y < H; y++) { const vv = (v.cy - y) / v.k;
    const la = lerp(vv, Math.atan(Math.sinh(vv)), s), fuera = Math.abs(la) > 84 * RAD || (Math.abs(vv) > Math.PI / 2 && s < .02);
    const f = lerp(Math.cos(la), 1, s), fila = Math.min(TH - 1, Math.max(0, Math.floor((0.5 - la / Math.PI) * TH))) * TW;
    let p = y * W * 4;
    for (let x = 0; x < W; x++, p += 4) {
      const u = (x - W / 2) / v.k; let ok = !fuera && Math.abs(u) <= Math.PI;
      let lo = 0;
      if (ok) { const g = Math.min(n - 1, Math.floor((u + Math.PI) / ancho)), gc = -Math.PI + (g + .5) * ancho; lo = gc + (u - gc) / Math.max(.001, f); ok = Math.abs(lo - gc) <= ancho / 2; }
      if (!ok) { d[p] = 5; d[p + 1] = 5; d[p + 2] = 9; d[p + 3] = 255; continue; }
      const t = (fila + Math.min(TW - 1, Math.floor((wrapPi(lo + v.lon0 * RAD) / (2 * Math.PI) + 0.5) * TW))) * 4;
      d[p] = TEX[t] * .86; d[p + 1] = TEX[t + 1] * .86; d[p + 2] = TEX[t + 2] * .86; d[p + 3] = 255;
    } }
  ctx.putImageData(OUT, 0, 0);
}

function fondoEstrellas() {
  ctx.fillStyle = C.fondo; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(244,241,234,.5)';
  for (let i = 0; i < 140; i++) { const x = hash2(i, 1) * W, y = hash2(i, 2) * H, r = hash2(i, 3) < .9 ? 1.2 : 2; ctx.fillRect(x, y, r, r); }
}

// ---------------- trazos sobre el mapa ----------------
function trazo(pts, proj, o = {}) {
  const { col = C.oro, w = 6, hasta = 1, guion = null, alfa = 1 } = o, n = Math.max(2, Math.round(pts.length * clamp(hasta)));
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = alfa; if (guion) ctx.setLineDash(guion);
  ctx.beginPath(); let antes = null;
  for (let i = 0; i < n; i++) { const p = proj(pts[i]); if (p[2] === false) { antes = null; continue; }
    if (!antes || Math.abs(p[0] - antes[0]) > W * .6) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); antes = p; }
  ctx.stroke(); ctx.restore();
}
function avion(x, y, ang, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s); ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 10;
  ctx.beginPath();   // vista cenital, nariz hacia +x
  ctx.moveTo(34, 0); ctx.quadraticCurveTo(30, -5, 20, -5); ctx.lineTo(4, -5); ctx.lineTo(-8, -34); ctx.lineTo(-16, -34); ctx.lineTo(-10, -5);
  ctx.lineTo(-24, -5); ctx.lineTo(-30, -15); ctx.lineTo(-35, -15); ctx.lineTo(-32, 0);
  ctx.lineTo(-35, 15); ctx.lineTo(-30, 15); ctx.lineTo(-24, 5); ctx.lineTo(-10, 5); ctx.lineTo(-16, 34); ctx.lineTo(-8, 34); ctx.lineTo(4, 5);
  ctx.lineTo(20, 5); ctx.quadraticCurveTo(30, 5, 34, 0); ctx.fill(); ctx.restore();
}
function avionEn(pts, proj, t, s) {
  const n = pts.length - 1, i = Math.min(n - 1, Math.floor(t * n)), a = proj(pts[i]), b = proj(pts[i + 1]);
  avion(lerp(a[0], b[0], t * n - i), lerp(a[1], b[1], t * n - i), Math.atan2(b[1] - a[1], b[0] - a[0]), s);
}
function ciudad(p, nombre, lado) {
  if (p[2] === false) return;
  ctx.save(); ctx.fillStyle = C.oro; ctx.beginPath(); ctx.arc(p[0], p[1], 9, 0, 7); ctx.fill();
  ctx.font = '500 30px Inter'; const w = ctx.measureText(nombre).width + 32, x = lado < 0 ? p[0] - w - 18 : p[0] + 18;
  ctx.fillStyle = 'rgba(11,11,16,.88)'; ctx.strokeStyle = C.pelo; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, p[1] - 64, w, 46, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.tinta; ctx.textBaseline = 'middle'; ctx.fillText(nombre, x + 16, p[1] - 41); ctx.restore();
}
function forma(rings, proj, relleno, alfa, borde) {
  ctx.save(); ctx.globalAlpha = alfa; ctx.beginPath();
  for (const r of rings) r.forEach((c, i) => { const p = proj(c); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
  if (relleno) { ctx.fillStyle = relleno; ctx.fill('evenodd'); }
  if (borde) { ctx.strokeStyle = borde; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
}
function reticula(proj, alfa) {
  for (let lo = -180; lo < 180; lo += 30) { const p = []; for (let la = -84; la <= 84; la += 3) p.push([lo, la]); trazo(p, proj, { col: '#ffffff', w: 1.5, alfa }); }
  for (let la = -60; la <= 60; la += 30) { const p = []; for (let lo = -180; lo <= 180; lo += 3) p.push([lo, la]); trazo(p, proj, { col: '#ffffff', w: 1.5, alfa }); }
}
function paralelo(la, proj, o) { const p = []; for (let lo = -180; lo <= 180; lo += 2) p.push([lo, la]); trazo(p, proj, o); }

// Groenlandia a tamaño real, trasladada a (lonC, latC): cada vértice conserva su distancia en km al centroide
const GL = FORMAS.groenlandia[0], GLc = [-41, 74];
const glVerdadera = (lonC, latC, esc = 1) => [GL.map(([lo, la]) => {
  const dx = (lo - GLc[0]) * Math.cos(la * RAD) * esc, dy = (la - GLc[1]) * esc;
  return [lonC + dx / Math.cos(latC * RAD), latC + dy]; })];
const CASILLAS = [[-6, 24], [6, 25], [18, 25], [30, 24], [-10, 12], [2, 11], [14, 12], [26, 12], [38, 9], [13, -1], [25, -1], [16, -13], [28, -13], [24, -25]];

// ---------------- letra: palabras secuenciales, corte seco, tamaños distintos ----------------
// las claves con espacio (*1.400 kilómetros*) se marcan palabra por palabra
function fichasFrase(txt) { let dentro = false; return txt.split(' ').map(p => { const abre = p.startsWith('*'), cierra = /\*[.,:;]?$/.test(p);
  const clave = dentro || abre; if (abre) dentro = true; if (cierra) dentro = false; return { p: p.replace(/\*/g, ''), clave }; }); }
function trozos(fs) { const o = []; let cur = [];
  fs.forEach((f, i) => { cur.push(f); if (/[.,:;]$/.test(f.p) || cur.length >= 6) { o.push(cur); cur = []; } }); if (cur.length) o.push(cur); return o; }
const estiloFicha = (f, rojo) => f.clave ? { font: '900 116px Inter', ls: '-4px', col: rojo ? C.rojo : C.oro, alto: 116 } : { font: 'italic 400 64px "Instrument Serif"', ls: '0px', col: C.tinta, alto: 64 };
function maquetar(fs, maxW, rojo) {
  const lineas = []; let cur = [], ancho = 0;
  for (const f of fs) { const e = estiloFicha(f, rojo); ctx.font = e.font; ctx.letterSpacing = e.ls; const w = ctx.measureText(f.p).width, esp = f.clave ? 26 : 16;
    if (cur.length && ancho + esp + w > maxW) { lineas.push(cur); cur = []; ancho = 0; }
    cur.push({ ...f, e, w }); ancho += (cur.length > 1 ? esp : 0) + w; }
  if (cur.length) lineas.push(cur); return lineas;
}
function escribir(fs, visibles, y0, rojo = false) {
  const lineas = maquetar(fs, 960, rojo); let y = y0, k = 0;
  ctx.save(); ctx.textBaseline = 'alphabetic'; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 16;
  for (const l of lineas) { const alto = Math.max(...l.map(f => f.e.alto)); y += alto * .92;
    const total = l.reduce((a, f, i) => a + f.w + (i ? (f.clave ? 26 : 16) : 0), 0); let x = W / 2 - total / 2;
    l.forEach((f, i) => { if (i) x += f.clave ? 26 : 16; if (k++ < visibles) { ctx.font = f.e.font; ctx.letterSpacing = f.e.ls; ctx.fillStyle = f.e.col; ctx.fillText(f.p, x, y); } x += f.w; });
    y += 14; }
  ctx.restore(); ctx.letterSpacing = '0px';
}
// subtítulo de la frase i al avance q: muestra el trozo actual, palabra por palabra
function subtitulo(i, q, y0 = 300) {
  const fs = fichasFrase(LINEAS[i].txt), tr = trozos(fs), letras = fs.map(f => f.p.length + 1), total = letras.reduce((a, b) => a + b, 0);
  const dichas = clamp(q / .9) * total; let acum = 0, n = 0; for (const l of letras) { if (acum + l * .35 <= dichas) n++; acum += l; }
  n = Math.max(1, n); let base = 0;
  for (const t of tr) { if (n <= base + t.length) { escribir(t, n - base, y0); return; } base += t.length; }
  escribir(tr.at(-1), tr.at(-1).length, y0);
}
function sombraArriba(a = .6) { const g = ctx.createLinearGradient(0, 160, 0, 760); g.addColorStop(0, `rgba(5,5,9,${a})`); g.addColorStop(1, 'rgba(5,5,9,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 760); }
function gancho() {   // gancho golpe: «tu mapa / TE MIENTE», en pantalla desde el cuadro 0
  ctx.save(); ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = 20;
  ctx.font = 'italic 400 96px "Instrument Serif"'; ctx.fillStyle = C.tinta; ctx.fillText('tu mapa', W / 2, 400);
  ctx.font = '900 196px Inter'; ctx.letterSpacing = '-7px'; ctx.fillStyle = C.rojo; ctx.fillText('TE MIENTE', W / 2, 590);
  ctx.restore(); ctx.letterSpacing = '0px';
}
function contador(valor, unidad, y = 1430) {
  ctx.save(); ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = 16;
  ctx.font = '900 170px Inter'; ctx.letterSpacing = '-6px'; ctx.fillStyle = C.tinta; ctx.fillText(valor, W / 2, y);
  ctx.font = 'italic 400 64px "Instrument Serif"'; ctx.letterSpacing = '0px'; ctx.fillStyle = C.oro; ctx.fillText(unidad, W / 2, y + 74); ctx.restore();
}

// ---------------- vistas base ----------------
const PAC = { lon0: -139.8, mC: mercY(-45 * RAD), k: 330, cy: 1060 };                 // el Pacífico sur: Santiago a la derecha, Sídney a la izquierda
const MUNDO = { lon0: 0, mC: 0, k: 159, cy: 1060 };
const ATL = { lon0: -12, mC: mercY(31 * RAD), k: 262, cy: 1040 };                   // Groenlandia arriba, África abajo
const GLOBO = (lon0, lat0, r = 420) => ({ cx: W / 2, cy: 1080, r, lon0, lat0 });
const mezclaMerc = (a, b, t) => ({ lon0: lerp(a.lon0, b.lon0, t), mC: lerp(a.mC, b.mC, t), k: lerp(a.k, b.k, t), cy: lerp(a.cy, b.cy, t) });
const pm = v => c => projMerc(v, c), pg = v => c => projGlobo(v, c);
function pacifico(v, o = {}) {
  vistaMerc(v); const P = pm(v);
  if (o.reticula) reticula(P, o.reticula);
  trazo(LOXO, P, { col: '#ffffff', w: 4, guion: [16, 14], alfa: o.recta ?? .9 });
  if (o.curva) trazo(ORTO, P, { col: o.colCurva || C.oro, w: 7, hasta: o.curva });
  ciudad(P(SCL), 'Santiago', -1); ciudad(P(SYD), 'Sídney', 1);
  return P;
}

// ---------------- apertura en 3D (frases 1 y 2): el avión sale de Santiago, va recto y gira al sur ----------------
// Tierra de radio 1000 (1 unidad ≈ 6,4 km) con Blue Marble; encima, un parche de alta (NASA BMNG, 1,8 km/px) sobre Chile.
// El avión no está a escala: mide como la cámara lo necesita, igual que en la referencia.
const R3 = 1000, ALT = 8, VEL = 11;                       // altura de vuelo y velocidad (unidades / s)
const RUMBO0 = 270, RUMBO1 = 214.5;                        // la «recta» del mapa va al oeste; la ruta real sale al suroeste (214,5°)
const v3 = (lo, la, alt = 0) => { const ph = (lo + 180) * RAD, th = (90 - la) * RAD, r = R3 + alt;
  return new THREE.Vector3(-r * Math.cos(ph) * Math.sin(th), r * Math.cos(th), r * Math.sin(ph) * Math.sin(th)); };
const norte3 = (lo, la) => v3(lo, la + .01).sub(v3(lo, la)).normalize();
const este3 = (lo, la) => v3(lo + .01, la).sub(v3(lo, la)).normalize();
const rumbo3 = (lo, la, h) => norte3(lo, la).multiplyScalar(Math.cos(h * RAD)).add(este3(lo, la).multiplyScalar(Math.sin(h * RAD)));
let G3 = null;   // se arma cuando cargan las texturas
