<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Noticia de escándalo</title>
<style>html,body{margin:0;background:#000;display:grid;place-items:center;height:100vh}canvas{height:100vh;width:auto}
@font-face{font-family:"F Anton";src:url("fuentes/Anton-Regular.ttf")}
@font-face{font-family:"F Diario";src:url("fuentes/DMSerifDisplay-Regular.ttf")}
@font-face{font-family:"F Nota";font-style:italic;src:url("fuentes/InstrumentSerif-Italic.ttf")}
@font-face{font-family:"F Sans";font-weight:100 900;src:url("fuentes/Montserrat.ttf")}
@font-face{font-family:"F Mono";font-weight:400;src:url("fuentes/JetBrainsMono-Regular.ttf")}
@font-face{font-family:"F Mono";font-weight:700;src:url("fuentes/JetBrainsMono-Bold.ttf")}
</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<!-- config.js lo escribe build.mjs a partir de config.json; si no está, se usan los valores de ejemplo de abajo -->
<script src="config.js"></script>
<script>
// NOTICIA DE ESCÁNDALO — un detalle absurdo y chico en primer plano (lo absurdo), la cámara viaja hasta la
// consecuencia enorme (el titular), un sello entra con corte seco, se alejan los dos unidos por un hilo rojo
// («esto chico tumbó esto grande») y cierra en una nota de papel donde se teclea la palabra del CTA.
// Subtítulo palabra por palabra con la clave en caja.
// El ejemplo es MAQUETA (ticket, periódico y titular inventados, marcados como tales). En producción cada recorte
// se reemplaza por la captura real de la fuente (config.json → fotos) y se apaga la marca (maqueta: false).
// Contrato del renderizador: window.draw(frame), window.FRAMES, window.FPS, window.LISTO.
const CFG = window.CONFIG || {};
const W = 1080, H = 1920, FPS = 30, DUR = 7.0;
window.FPS = FPS; window.FRAMES = Math.round(DUR * FPS);
const c = document.getElementById('c'), ctx = c.getContext('2d');

// ---------- LO QUE PUEDES CAMBIAR (todo sale de config.json; esto es el ejemplo por defecto) ----------
const CTA = String(CFG.cta || 'GUÍA').toUpperCase();
const MAQUETA = CFG.maqueta !== false;                    // true = marca «MAQUETA» en cada recorte (ejemplo inventado)
// Subtítulo: [desde, hasta, palabras]; la palabra entre *asteriscos* va en caja (la clave). {CTA} = tu palabra.
const FRASES = (CFG.frases || [
  [0.00, 1.50, 'Un *sándwich* cobrado doble…'],
  [1.50, 2.95, '…y cayó el *director*.'],
  [2.95, 4.50, 'Lo chico tumba lo *grande*.'],
  [4.50, 7.00, 'Comenta *{CTA}* y te la mando.'],
]).map(([a, b, s]) => [a, b, s.replaceAll('{CTA}', CTA)]);
const TICKET = Object.assign({ titulo: 'CAFETERÍA', subtitulo: 'consumo en mesa', pie: 'gracias por su visita', lineas: ['café con leche', 'jugo de naranja', 'sándwich de jamón', 'sándwich de jamón', 'galleta'], marcada: [2, 3], nota: 'cobrado doble' }, CFG.ticket);
const DIARIO = Object.assign({ cabecera: 'EL DIARIO DE LA MAÑANA', titular: 'Renuncia el director tras el caso del sándwich', bajada: 'La junta acepta su salida después de la queja de un cliente.' }, CFG.diario);
const SELLO = CFG.sello || 'ESCÁNDALO';
const ETIQ = CFG.etiquetas || ['lo absurdo', 'la caída'];
const CIERRE = Object.assign({ pide: 'Comenta', debajo: 'y te la mando' }, CFG.cierre);
// En producción: rutas a capturas reales (PNG/JPG, relativas a index.html). null = recorte de maqueta dibujado.
const FOTOS = Object.assign({ ticket: null, titular: null }, CFG.fotos);
const COL = Object.assign({ amarillo: '#F5C842', rojo: '#E5383B', cielo: ['#1F3263', '#0A1128'] }, CFG.colores);
const AMARILLO = COL.amarillo, ROJO = COL.rojo;
// --------------------------------------------

const SANS = '"F Sans","Avenir Next","Helvetica Neue",Arial,sans-serif', SERIF = '"F Diario",Georgia,serif', NOTA = '"F Nota",Georgia,serif';
const MONO = '"F Mono",Menlo,Consolas,monospace', COND = '"F Anton","Arial Narrow",sans-serif';
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), prog = (t, a, b) => clamp((t - a) / (b - a));
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2, eo = x => 1 - Math.pow(1 - x, 3);
const lerp = (a, b, k) => a + (b - a) * k;
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function T(s, x, y, font, col, al = 'left') { ctx.font = font; ctx.fillStyle = col; ctx.textAlign = al; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y); }
function envolver(s, font, ancho) { ctx.font = font; const ps = s.split(' '), rs = []; let r = '';
  for (const p of ps) { const n = r ? r + ' ' + p : p; if (ctx.measureText(n).width > ancho && r) { rs.push(r); r = p; } else r = n; } if (r) rs.push(r); return rs; }

// ---------- texturas hechas una vez ----------
const grano = (() => { const g = document.createElement('canvas'); g.width = g.height = 256; const x = g.getContext('2d'), d = x.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random(); d.data[i] = d.data[i + 1] = d.data[i + 2] = v > .5 ? 255 : 60; d.data[i + 3] = Math.random() * 22; } x.putImageData(d, 0, 0); return g; })();
const fotoTrama = (() => {               // «foto» de agencia en trama de puntos (edificio de oficinas), en gris
  const w = 760, h = 430, src = document.createElement('canvas'); src.width = w; src.height = h; const s = src.getContext('2d');
  const cielo = s.createLinearGradient(0, 0, 0, h); cielo.addColorStop(0, '#d8d8d8'); cielo.addColorStop(1, '#9a9a9a'); s.fillStyle = cielo; s.fillRect(0, 0, w, h);
  s.fillStyle = '#5a5a5a'; s.fillRect(80, 120, 150, h); s.fillStyle = '#3a3a3a'; s.fillRect(260, 40, 260, h); s.fillStyle = '#6a6a6a'; s.fillRect(550, 150, 160, h);
  s.fillStyle = '#c8c8c8'; for (let j = 0; j < 14; j++) for (let i = 0; i < 6; i++) if (rnd(i * 9 + j) > .3) s.fillRect(282 + i * 40, 66 + j * 26, 22, 12);
  s.fillStyle = '#222'; s.fillRect(0, h - 70, w, 70); s.fillStyle = '#444'; s.fillRect(330, h - 120, 120, 50);
  const px = s.getImageData(0, 0, w, h).data, out = document.createElement('canvas'); out.width = w; out.height = h; const o = out.getContext('2d');
  o.fillStyle = '#EFE9DC'; o.fillRect(0, 0, w, h); o.fillStyle = '#1b1b1b'; const p = 8;
  for (let y = p / 2; y < h; y += p) for (let x = (y / p) % 2 ? p : p / 2; x < w; x += p) { const v = px[(Math.floor(y) * w + Math.floor(x)) * 4] / 255, r = (1 - v) * p * .62;
    if (r > .3) { o.beginPath(); o.arc(x, y, r, 0, 7); o.fill(); } }
  return out; })();
const sucio = (() => { const g = document.createElement('canvas'); g.width = 900; g.height = 260; const x = g.getContext('2d');   // máscara de sello gastado
  for (let i = 0; i < 1400; i++) { x.fillStyle = `rgba(0,0,0,${rnd(i) * .9})`; x.beginPath(); x.arc(rnd(i + 3) * 900, rnd(i + 7) * 260, 1 + rnd(i + 11) * 4, 0, 7); x.fill(); } return g; })();
const IMGS = {};
const LETRAS = [`400 20px ${COND}`, `400 20px ${SERIF}`, `italic 400 20px ${NOTA}`, `700 20px ${SANS}`, `400 20px ${MONO}`, `700 20px ${MONO}`];
window.LISTO = Promise.all([...LETRAS.map(f => document.fonts.load(f).catch(() => null)), ...Object.entries(FOTOS).filter(([, v]) => v).map(([k, v]) => new Promise((ok, mal) => { const i = new Image(); i.onload = () => { IMGS[k] = i; ok(); }; i.onerror = () => mal(new Error(v)); i.src = v; }))]);

// ---------- recortes en coordenadas de mundo ----------
const C1 = { x: 210, y: 1480, w: 440, h: 620, rot: -.07 };   // el detalle absurdo
const C2 = { x: 640, y: 2170, w: 880, h: 1060, rot: .025 }; // la consecuencia
function papel(R, semilla, fondo = '#F4EFE3') {               // recorte con bordes rasgados y sombra plana
  const pts = [], n = 26;
  for (let i = 0; i <= n; i++) pts.push([-R.w / 2 + R.w * i / n, -R.h / 2 + (rnd(semilla + i) - .5) * 12]);
  for (let i = 0; i <= n; i++) pts.push([R.w / 2 + (rnd(semilla + 50 + i) - .5) * 6, -R.h / 2 + R.h * i / n]);
  for (let i = n; i >= 0; i--) pts.push([-R.w / 2 + R.w * i / n, R.h / 2 + (rnd(semilla + 100 + i) - .5) * 14]);
  for (let i = n; i >= 0; i--) pts.push([-R.w / 2 + (rnd(semilla + 150 + i) - .5) * 6, -R.h / 2 + R.h * i / n]);
  const camino = () => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.closePath(); };
  ctx.save(); ctx.translate(14, 18); camino(); ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill(); ctx.restore();
  camino(); ctx.fillStyle = fondo; ctx.fill(); ctx.save(); camino(); ctx.clip();
  ctx.fillStyle = ctx.createPattern(grano, 'repeat'); ctx.fillRect(-R.w / 2, -R.h / 2, R.w, R.h);
  return () => ctx.restore();
}
function marcaMaqueta(R) { if (MAQUETA) T('MAQUETA · inventado', R.w / 2 - 18, R.h / 2 - 18, `600 18px ${MONO}`, 'rgba(120,110,95,.9)', 'right'); }
function foto(k, R) { const i = IMGS[k]; const s = Math.max(R.w / i.width, R.h / i.height); ctx.drawImage(i, -i.width * s / 2, -i.height * s / 2, i.width * s, i.height * s); }

function ticket(t) {
  ctx.save(); ctx.translate(C1.x, C1.y); ctx.rotate(C1.rot); const R = C1, fin = papel(R, 3, '#F7F4EC');
  if (IMGS.ticket) foto('ticket', R); else {
    const x0 = -R.w / 2 + 40, x1 = R.w / 2 - 40;
    T(TICKET.titulo, 0, -R.h / 2 + 80, `700 34px ${MONO}`, '#222', 'center');
    T(TICKET.subtitulo, 0, -R.h / 2 + 118, `400 20px ${MONO}`, '#666', 'center');
    ctx.setLineDash([6, 6]); ctx.strokeStyle = '#999'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, -R.h / 2 + 145); ctx.lineTo(x1, -R.h / 2 + 145); ctx.stroke(); ctx.setLineDash([]);
    TICKET.lineas.slice(0, 5).forEach((l, i) => { const y = -R.h / 2 + 200 + i * 58, marc = TICKET.marcada.includes(i);
      if (marc) { const j = TICKET.marcada.indexOf(i), k = eo(prog(t, .35 + j * .12, .6 + j * .12)); ctx.fillStyle = 'rgba(245,200,66,.75)'; ctx.fillRect(x0 - 8, y - 32, (x1 - x0 + 16) * k, 44); }
      T(l, x0, y, `500 26px ${MONO}`, '#1d1d1d'); T('……', x1, y, `500 26px ${MONO}`, '#1d1d1d', 'right'); });
    // óvalo a plumón alrededor de las dos líneas repetidas + nota
    const mk = TICKET.marcada.length ? TICKET.marcada : [0], m0 = Math.min(...mk), m1 = Math.max(...mk);
    const k = prog(t, .7, 1.05); if (k > 0) { ctx.strokeStyle = ROJO; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath();   // óvalo a plumón
      ctx.ellipse(0, -R.h / 2 + 200 + (m0 + m1) / 2 * 58 - 12, R.w / 2 - 8, 43 + 29 * (m1 - m0), -.03, -2.6, -2.6 + Math.PI * 2.08 * eo(k)); ctx.stroke(); }
    if (t > 1.05) T(TICKET.nota, x1, -R.h / 2 + 200 + (TICKET.lineas.length - 1) * 58 + 70, `italic 400 44px ${NOTA}`, ROJO, 'right');
    ctx.setLineDash([6, 6]); ctx.strokeStyle = '#999'; ctx.beginPath(); ctx.moveTo(x0, R.h / 2 - 90); ctx.lineTo(x1, R.h / 2 - 90); ctx.stroke(); ctx.setLineDash([]);
    T(TICKET.pie, 0, R.h / 2 - 54, `400 20px ${MONO}`, '#666', 'center');
  }
  marcaMaqueta(R); fin(); ctx.restore();
}
function diario(t) {
  ctx.save(); ctx.translate(C2.x, C2.y); ctx.rotate(C2.rot); const R = C2, fin = papel(R, 9, '#F1ECDF');
  if (IMGS.titular) foto('titular', R); else {
    const x0 = -R.w / 2 + 50, x1 = R.w / 2 - 50, top = -R.h / 2;
    T(DIARIO.cabecera, 0, top + 82, `400 50px ${SERIF}`, '#151515', 'center');
    ctx.fillStyle = '#151515'; ctx.fillRect(x0, top + 104, x1 - x0, 4); ctx.fillRect(x0, top + 114, x1 - x0, 1.5);
    if (MAQUETA) { T('EDICIÓN DE MAQUETA', x0, top + 142, `400 18px ${MONO}`, '#555'); T('NO ES UNA NOTICIA REAL', x1, top + 142, `400 18px ${MONO}`, '#555', 'right'); }
    const f = `400 66px ${SERIF}`, rs = envolver(DIARIO.titular, f, x1 - x0);
    rs.forEach((r, i) => T(r, x0, top + 230 + i * 74, f, '#0f0f0f'));
    const yb = top + 230 + rs.length * 74 + 4; envolver(DIARIO.bajada, `italic 400 30px ${SERIF}`, x1 - x0).forEach((r, i) => T(r, x0, yb + i * 38, `italic 400 30px ${SERIF}`, '#333'));
    const fy = yb + 90, fh = (x1 - x0) * fotoTrama.height / fotoTrama.width; ctx.drawImage(fotoTrama, x0, fy, x1 - x0, fh);
    if (MAQUETA) T('Foto de maqueta', x0, fy + fh + 30, `400 18px ${MONO}`, '#666');
    ctx.fillStyle = '#a39d90'; for (let col = 0; col < 2; col++) for (let i = 0; i < 6; i++) ctx.fillRect(x0 + col * ((x1 - x0) / 2 + 10), fy + fh + 56 + i * 24, (x1 - x0) / 2 - 10 - (i === 5 ? 120 : 0), 9);
    // sello con corte seco (sin rebote): aparece entero en t=2.25
    if (t >= 2.25) { ctx.save(); ctx.translate(40, fy + fh * .45); ctx.rotate(-.13); ctx.globalAlpha = .92; const S = sello(); ctx.drawImage(S, -S.width / 2, -S.height / 2); ctx.restore(); }
  }
  marcaMaqueta(R); fin(); ctx.restore();
}
let _sello = null;
function sello() {                                             // sello gastado, dibujado una vez en su propio lienzo
  if (_sello) return _sello; const sw = 640, sh = 170, cv = document.createElement('canvas'); cv.width = sw + 40; cv.height = sh + 40; const x = cv.getContext('2d');
  x.translate(cv.width / 2, cv.height / 2); x.strokeStyle = ROJO; x.lineWidth = 12; x.strokeRect(-sw / 2, -sh / 2, sw, sh); x.lineWidth = 4; x.strokeRect(-sw / 2 + 16, -sh / 2 + 16, sw - 32, sh - 32);
  let tm = 120; x.font = `400 ${tm}px ${COND}`; while (x.measureText(SELLO).width > sw - 70) { tm -= 4; x.font = `400 ${tm}px ${COND}`; }
  x.fillStyle = ROJO; x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.fillText(SELLO, 0, tm * .36);
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'destination-out'; x.drawImage(sucio, 0, 0, cv.width, cv.height);
  return (_sello = cv);
}
function hilo(t) {                                              // hilo rojo que une lo chico con lo grande
  const k = eo(prog(t, 3.05, 3.6)); if (k <= 0) return;
  const a = [C1.x + C1.w / 2 - 10, C1.y - C1.h / 2 + 320], b = [C2.x + 170, C2.y + 120], m = [b[0] + 260, a[1] + 60];
  ctx.strokeStyle = ROJO; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.setLineDash([1600 * k, 2000]);
  ctx.beginPath(); ctx.moveTo(...a); ctx.quadraticCurveTo(...m, ...b); ctx.stroke(); ctx.setLineDash([]);
  [a, k > .98 ? b : null].forEach(p => { if (!p) return; ctx.fillStyle = '#d9d9d9'; ctx.beginPath(); ctx.arc(...p, 22, 0, 7); ctx.fill(); ctx.fillStyle = ROJO; ctx.beginPath(); ctx.arc(...p, 13, 0, 7); ctx.fill(); });
}
function chip(txt, x, y, fondo, col, s) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.font = `400 54px ${COND}`; const w = ctx.measureText(txt).width + 50;
  ctx.fillStyle = fondo; ctx.beginPath(); ctx.roundRect(-w / 2, -44, w, 76, 12); ctx.fill(); T(txt, 0, 12, ctx.font, col, 'center'); ctx.restore(); }

// ---------- el cierre: nota de papel donde se teclea la palabra del CTA ----------
const C3 = { x: 560, y: 3080, w: 780, h: 560, rot: -.035 };
function cierre(t) {
  if (t < 4.5) return;                                          // entra con corte seco
  ctx.save(); ctx.translate(C3.x, C3.y); ctx.rotate(C3.rot); const R = C3, fin = papel(R, 21, '#F6E9B4');
  T(CIERRE.pide, 0, -R.h / 2 + 130, `italic 400 92px ${NOTA}`, '#1b1b1b', 'center');
  let tm = 230; ctx.font = `400 ${tm}px ${COND}`; while (ctx.measureText(CTA).width > R.w - 140 && tm > 60) { tm -= 6; ctx.font = `400 ${tm}px ${COND}`; }
  const n = Math.min(CTA.length, Math.floor(Math.max(0, t - 4.95) / .09) + (t >= 4.95 ? 1 : 0)), yc = 70;   // se teclea letra por letra
  const wTot = ctx.measureText(CTA).width, parte = CTA.slice(0, n);
  T(parte, -wTot / 2, yc + tm * .36, ctx.font, '#141414');
  if (n < CTA.length && Math.floor(t * 4) % 2 === 0) { ctx.fillStyle = ROJO; ctx.fillRect(-wTot / 2 + ctx.measureText(parte).width + 8, yc - tm * .36, 8, tm * .72); }
  const k = prog(t, 5.75, 6.2); if (k > 0) { ctx.strokeStyle = ROJO; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.ellipse(0, yc, wTot / 2 + 50, tm * .5, -.04, -2.6, -2.6 + Math.PI * 2.08 * eo(k)); ctx.stroke(); }
  if (t > 6.3 && CIERRE.debajo) T(CIERRE.debajo, R.w / 2 - 50, R.h / 2 - 50, `italic 400 52px ${NOTA}`, ROJO, 'right');
  fin();
  ctx.fillStyle = '#d9d9d9'; ctx.beginPath(); ctx.arc(0, -R.h / 2 + 18, 22, 0, 7); ctx.fill(); ctx.fillStyle = ROJO; ctx.beginPath(); ctx.arc(0, -R.h / 2 + 18, 13, 0, 7); ctx.fill();   // chincheta
  ctx.restore();
}

// ---------- cámara: [t, centroX, centroY, zoom]; nunca quieta más de 1,5 s, sin temblor ----------
const CAM = [[0, 215, 1500, 1.30], [1.45, 235, 1470, 1.46], [2.05, 640, 2190, 0.95], [2.95, 640, 2170, 1.03], [3.55, 530, 1935, 0.64], [4.5, 530, 1930, 0.685],
  [5.15, C3.x, C3.y + 40, 1.0], [DUR, C3.x, C3.y + 30, 1.09]];
const FOCO = [540, 820];                                        // centro de la imagen (deja aire al subtítulo)
function camara(t) { let i = 0; while (i < CAM.length - 2 && t > CAM[i + 1][0]) i++; const [t0, x0, y0, z0] = CAM[i], [t1, x1, y1, z1] = CAM[i + 1];
  const k = eio(prog(t, t0, t1)); return [lerp(x0, x1, k), lerp(y0, y1, k), z0 * Math.pow(z1 / z0, k)]; }

// ---------- subtítulo palabra por palabra (centro y≈1400), clave en caja amarilla ----------
function subtitulo(t) {
  const f = FRASES.find(([a, b]) => t >= a && t < b) || FRASES.at(-1); const [a, b, s] = f, ps = s.split(' '), n = ps.length;
  const font = `700 66px ${SANS}`; ctx.font = font; const limpio = ps.map(p => p.replace(/\*/g, '')), esp = 20;
  const anchos = limpio.map(p => ctx.measureText(p).width), suma = (i, j) => anchos.slice(i, j).reduce((x, y) => x + y, 0) + esp * (j - i - 1);
  let corte = n;                                                // si no cabe en un renglón, va en 2 parejos
  if (suma(0, n) > W - 120) { let mejor = 1e9; for (let k = 1; k < n; k++) { const d = Math.max(suma(0, k), suma(k, n)); if (d < mejor) { mejor = d; corte = k; } } }
  const renglones = corte < n ? [[0, corte], [corte, n]] : [[0, n]], ritmo = (b - a - .35) / n;
  renglones.forEach(([i0, i1], r) => { let x = W / 2 - suma(i0, i1) / 2; const y = 1420 + (r - (renglones.length - 1) / 2) * 92;
    for (let i = i0; i < i1; i++) { const p = ps[i], dicha = t >= a + i * ritmo, clave = p.includes('*');
      if (clave && dicha) { ctx.strokeStyle = AMARILLO; ctx.lineWidth = 4; ctx.strokeRect(x - 12, y - 58, anchos[i] + 24, 80); }
      T(limpio[i], x, y, font, dicha ? (clave ? AMARILLO : '#FFFFFF') : 'rgba(255,255,255,.22)'); x += anchos[i] + esp; } });
}

window.draw = function (frame) {
  const t = frame / FPS;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const g = ctx.createRadialGradient(W / 2, 700, 100, W / 2, 900, 1400); g.addColorStop(0, COL.cielo[0]); g.addColorStop(1, COL.cielo[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const [cx, cy, z] = camara(t);
  // estrellas con paralaje leve (profundidad sin mover el cuadro de golpe)
  for (let i = 0; i < 90; i++) { const sx = ((rnd(i) * 1600 - (cx - 500) * .15) % W + W) % W, sy = ((rnd(i + 40) * 2600 - (cy - 1500) * .12) % H + H) % H; ctx.fillStyle = `rgba(255,255,255,${.15 + rnd(i + 9) * .35})`; ctx.fillRect(sx, sy, 2.5, 2.5); }
  ctx.save(); ctx.translate(...FOCO); ctx.scale(z, z); ctx.translate(-cx, -cy);
  diario(t); ticket(t); hilo(t); cierre(t);
  if (t > 3.6) { chip(ETIQ[0], C1.x + 20, C1.y - C1.h / 2 - 60, AMARILLO, '#141414', 1 / z * .85); }
