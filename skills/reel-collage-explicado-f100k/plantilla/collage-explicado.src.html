<script>
// ====================== LO QUE PUEDES CAMBIAR ======================
// Cada renglón = una frase de la voz y su duración en segundos. voz.mjs reescribe los `d` con la voz real.
const LINEAS = [
  { d: 3.6, txt: 'Si entiendes esta imagen, no vas a volver a mirar el mundo igual.' },
  { d: 3.36, txt: 'Son los aviones que volvían del combate en la Segunda Guerra Mundial.' },
  { d: 2.24, txt: 'Cada punto rojo es un balazo.' },

  { d: 2.8, txt: 'Un matemático, Abraham Wald, lo vio al revés.' },
  { d: 2.24, txt: 'Solo estaban mirando los aviones que volvieron.' },
  { d: 5.44, txt: 'Los que recibieron balazos en las zonas limpias nunca regresaron. Por eso no estaban en los datos.' },
  { d: 5.12, txt: 'Los puntos rojos solo mostraban dónde te pueden disparar, y aun así volver.' },
  { d: 7.76, txt: 'Hace más de dos mil años, a un filósofo griego, Diágoras, le mostraron tablillas de marineros que rezaron y se salvaron del naufragio.' },

  { d: 4.78, txt: 'Eso se llama sesgo de supervivencia: mirar solo a los que pasaron el filtro.' },
  { d: 4.47, txt: 'Lo ves en el gimnasio: miras a alguien fuerte y piensas, quiero ese cuerpo.' },
  { d: 4.56, txt: 'Pero los que se quedaron eran los que ya tenían facilidad. Los demás lo dejaron.' },
  { d: 3.84, txt: 'Y en redes es igual: copias el trend que le funcionó a otra cuenta.' },
  { d: 4.02, txt: 'Sin ver a los miles que hicieron exactamente lo mismo y nunca volvieron.' },
  { d: 5.34, txt: 'Cuando ves a alguien que lo logró, no estás viendo el método. Estás viendo a un sobreviviente.' },
  { d: 3.87, txt: 'Antes de copiar un formato, pregúntate cuántos aviones no volvieron.' },
  { d: 6.3, txt: 'Este video lo armé con IA, recorte por recorte. Comenta GUIA y te mando la guía para animar los tuyos.' },

const PAUSA = .3;            // respiro entre frases
const QUIETO_FINAL = 1.6;    // el último cuadro se queda
// Efectos de sonido: [escena, cuándo, sonido, volumen, repeticiones?, separación?]
// «cuándo» y «separación» van en segundos desde que arranca la escena, o como '45%' de la escena (frase + pausa).
// Sonidos: pop tic ding sello metal whoosh plumon ola riser papel. Cada escena que NO está en CONTINUA ya lleva un whoosh al entrar.
// Regla: cada cosa que entra en pantalla suena en el mismo segundo en que su animación la mete (mismos números que en ESC).
const EFECTOS = [
  [0, 0.02, 'sello', .8], [0, .05, 'papel', .7],
  [1, .3, 'whoosh', .7], [1, 1.2, 'sello', .9], [1, 1.9, 'pop', 1],
  [2, 0, 'tic', .8, 14, '5.7%'], [2, .2, 'pop', 1],
  [3, .05, 'papel', 1], [3, .5, 'pop', .8], [3, '45%', 'metal', 1], [3, '62%', 'sello', .9],
  [4, .15, 'ding', .7], [4, '45%', 'plumon', 1, 2, .22], [4, '62%', 'sello', 1],
  [5, .05, 'papel', 1], [5, .4, 'pop', 1], [5, '50%', 'whoosh', .8],
  [6, .1, 'pop', .7, 6, .14],
  [7, .2, 'riser', .35], [7, .3, 'pop', .7], [7, '45%', 'sello', .8], [7, '62%', 'pop', 1],
  [8, .1, 'pop', .8], [8, '50%', 'pop', .8], [8, '60%', 'ding', .7],
  [9, .05, 'papel', 1], [9, 1.6, 'pop', .7], [9, '45%', 'papel', 1, 3, .45], [9, '52%', 'ding', .45, 3, .45],
  [10, .3, 'ola', .9], [10, .9, 'pop', .75, 3, .3],
  [11, 0, 'pop', .8], [11, .3, 'sello', .7], [11, .9, 'tic', .6, 10, .25], [11, '60%', 'ding', .5],
  [12, 0, 'pop', .8], [12, '50%', 'pop', 1],
  [13, .1, 'pop', .7], [13, '30%', 'ding', .5], [13, '45%', 'whoosh', .6],
  [14, 0, 'pop', .8], [14, '55%', 'sello', 1],
  [15, .05, 'tic', .6, 12, .105], [15, '50%', 'whoosh', .5],
  [16, 0, 'pop', .8], [16, '30%', 'plumon', 1], [16, '55%', 'sello', .8],
  [17, 0, 'riser', .5],
  [18, .1, 'papel', .8, 7, .2], [18, '40%', 'whoosh', .7], [18, '46%', 'sello', .9], [18, '57%', 'ding', .5],
];
const PALABRA_CTA = 'GUIA';   // la palabra del CTA (sale del regalo de la persona)
const GANCHO = ['Si entiendes esta imagen,', 'no ves el mundo igual'];
const VECES = 3, PIXELES = 0;       // temblor de collage APAGADO (regla 23-oct, sin olor a IA). Antes: 7 px
const SUBTITULOS = !new URLSearchParams(location.search).has('sinsubs');   // ?sinsubs = versión limpia
const C = {
  fondo: '#050509', panel: '#0b0b10', pelo: '#24242e', pelo2: '#3f3f46',
  tinta: '#f4f1ea', crema: '#efe7d8', gris: '#a1a1aa', oro: '#F5C542', verde: '#7fe3ad', rojo: '#ef4444',
};
// ===================================================================
const W = 1080, H = 1920, FPS = 30;
const INI = []; { let a = 0; for (const l of LINEAS) { INI.push(a); a += l.d + PAUSA; } var DUR = +(a + QUIETO_FINAL).toFixed(2); }

<script>
// ANATOMIA: estilizada — monigotes de pictograma (cápsula + círculo, sin manos ni cara)
const SANS = LETRA_LIMPIA, SERIF = 'Georgia, "Times New Roman", serif', MONO = 'Menlo, "SF Mono", Consolas, monospace';
const pop = (u, a, dur = .4) => easeOut(prog(u, a, a + dur));   // 23-oct: crece y frena, sin rebote (antes back)
const fin = (u, a, dur = .35) => easeOut(prog(u, a, a + dur));
const TINTA = '#16161d', SANGRE = '#d7263d', VERDE_P = '#23885a', PAPEL = '#efe7d8', HOJA = '#fbf8f1';

// ---------- el temblor de collage ----------
function ruido1(x, s) { const i = Math.floor(x), f = x - i, k = f * f * (3 - 2 * f); return lerp(hash2(i, s) * 2 - 1, hash2(i + 1, s) * 2 - 1, k); }
const wig = t => [ruido1(t * VECES, 11) * PIXELES, ruido1(t * VECES, 47) * PIXELES];
function escenaEn(t) { let i = 0; while (i < LINEAS.length - 1 && t >= INI[i + 1]) i++; return [i, t - INI[i]]; }
let WX = 0, WY = 0;
const sinMover = f => { ctx.save(); ctx.translate(-WX, -WY); f(); ctx.restore(); };

function txt(s, x, y, tam, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.a ?? 1;
  ctx.font = `${o.it ? 'italic ' : ''}${o.peso ?? 800} ${tam}px ${o.mono ? MONO : o.serif ? SERIF : SANS}`;
  ctx.textAlign = o.al || 'center'; ctx.textBaseline = o.base || 'middle';
  ctx.fillStyle = o.col || TINTA;
  ctx.fillText(s, x, y);
  ctx.restore();
}
function caja(x, y, w, h, r, rel, borde, grosor = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (rel) { ctx.fillStyle = rel; ctx.fill(); }
  if (borde) { ctx.strokeStyle = borde; ctx.lineWidth = grosor; ctx.stroke(); }
}
function palomita(x, y, s, p = 1, col = VERDE_P, g = 7) {
  if (p <= 0) return;
  const pts = [[-.5, 0], [-.12, .38], [.55, -.42]], L1 = .55, L = 1.5, d = p * L;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = g; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s);
  const k1 = Math.min(1, d / L1); ctx.lineTo(x + lerp(pts[0][0], pts[1][0], k1) * s, y + lerp(pts[0][1], pts[1][1], k1) * s);
  if (d > L1) { const k2 = Math.min(1, (d - L1) / (L - L1)); ctx.lineTo(x + lerp(pts[1][0], pts[2][0], k2) * s, y + lerp(pts[1][1], pts[2][1], k2) * s); }
  ctx.stroke(); ctx.restore();
}
// una X trazada en dos golpes
function equis(x, y, s, p, col = SANGRE, g = 16) {
  if (p <= 0) return;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = g; ctx.lineCap = 'round';
  const a = clamp(p * 2), b = clamp(p * 2 - 1);
  ctx.beginPath(); ctx.moveTo(x - s, y - s); ctx.lineTo(x - s + 2 * s * a, y - s + 2 * s * a); ctx.stroke();
  if (b > 0) { ctx.beginPath(); ctx.moveTo(x + s, y - s); ctx.lineTo(x + s - 2 * s * b, y - s + 2 * s * b); ctx.stroke(); }
  ctx.restore();
}

// ---------- papelería del collage ----------
// tira de papel con texto (gancho y títulos)
function tira(s, y, tam, fondo, col, rot = -.02, a = 1, x = 540) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot); ctx.font = `800 ${tam}px ${SANS}`; const w = ctx.measureText(s).width;
  ctx.shadowColor = 'rgba(40,28,20,.3)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
  // orilla rasgada arriba y abajo
  const x0 = -w / 2 - 30, x1 = w / 2 + 30, y0 = -tam * .72, y1 = tam * .72;
  ctx.beginPath(); ctx.moveTo(x0, y0);
  for (let k = 0, n = Math.ceil((x1 - x0) / 14); k <= n; k++) ctx.lineTo(x0 + k * (x1 - x0) / n, y0 + (hash2(k, tam) - .5) * 6);
  for (let k = 0, n = Math.ceil((x1 - x0) / 14); k <= n; k++) ctx.lineTo(x1 - k * (x1 - x0) / n, y1 + (hash2(k, tam + 9) - .5) * 6);
  ctx.closePath(); ctx.fillStyle = fondo; ctx.fill(); ctx.shadowColor = 'transparent';
  txt(s, 0, 3, tam, { col }); ctx.restore();
}
// cinta washi
function cinta(x, y, w, rot, col = 'rgba(245,197,66,.55)') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-w / 2, -22);
  for (let k = 0; k <= 6; k++) ctx.lineTo(-w / 2 + (k % 2 ? 6 : 0), -22 + k * 44 / 6);
  for (let k = 0; k <= 6; k++) ctx.lineTo(w / 2 - (k % 2 ? 6 : 0), 22 - k * 44 / 6);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
// etiqueta de rotuladora: cinta negra con letras blancas en relieve
function etiqueta(s, x, y, tam, rot = -.03, a = 1, fondo = TINTA, col = '#f4f1ea') {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot);
  ctx.font = `700 ${tam}px ${MONO}`; const w = ctx.measureText(s).width;
  ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 5;
  caja(-w / 2 - 22, -tam * .8, w + 44, tam * 1.6, 4, fondo); ctx.shadowColor = 'transparent';
  txt(s, 0, 2, tam, { mono: true, peso: 700, col }); ctx.restore();
}
// sello de goma que cae con golpe (p de 0 a 1)
function sello(s, x, y, tam, rot, p, col = SANGRE) {
  if (p <= 0) return;
  const k = lerp(1.9, 1, easeOut(clamp(p * 1.6)));
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k); ctx.globalAlpha *= clamp(p * 3) * .9;
  ctx.font = `800 ${tam}px ${SANS}`; const w = ctx.measureText(s).width;
  ctx.strokeStyle = col; ctx.lineWidth = tam * .09; caja(-w / 2 - tam * .35, -tam * .78, w + tam * .7, tam * 1.56, tam * .18, null, col, tam * .09);
  txt(s, 0, 3, tam, { col });
  // tinta gastada: puntitos de papel que no agarraron tinta
  ctx.globalCompositeOperation = 'destination-out';
  for (let n = 0; n < 60; n++) { ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect((hash2(n, 3) - .5) * (w + tam * .7), (hash2(n, 5) - .5) * tam * 1.5, 3 + hash2(n, 7) * 4, 2 + hash2(n, 8) * 3); }
  ctx.restore();
}

// ---------- recortes (fotos reales o libres, o hechas con IA, sin fondo) ----------
const RUTAS = ['bombardero', 'restos', 'gorra', 'busto', 'tablilla', 'mancuerna', 'ola', 'lentes'];
let IM = null, PAPEL_IM = null;
function recorta(im) {
  if (!im) return null;
  try { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const x = c.getContext('2d'); x.drawImage(im, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height).data; let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let j = 0; j < c.height; j += 2) for (let i = 0; i < c.width; i += 2) if (d[(j * c.width + i) * 4 + 3] > 20) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
    const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1; o.getContext('2d').drawImage(c, -x0, -y0); return o;
  } catch (e) { return im; }
}
// Cada foto se carga por su cuenta: si falta una, la pieza sigue (sin papel.jpg queda el color de papel; sin un recorte, ese hueco queda vacío).
const cargarUna = src => new Promise(ok => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => { console.warn('falta ' + src); ok(null); }; im.src = src; });
window.LISTO = Promise.all([...RUTAS.map(n => `collage/${n}.png`), 'collage/papel.jpg'].map(cargarUna)).then(a => {
  IM = {}; RUTAS.forEach((n, i) => IM[n] = recorta(a[i])); PAPEL_IM = a[RUTAS.length];
});
// recorte con borde blanco de tijera y sombra de papel
function recorte(nombre, x, y, h, rot = 0, o = {}) {
  if (!IM || !IM[nombre]) return;
  const im = IM[nombre], w = h * im.width / im.height;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.globalAlpha *= o.a ?? 1;
  if (o.esc) ctx.scale(o.esc, o.esc);
  ctx.shadowColor = o.sombra ?? 'rgba(40,28,20,.38)'; ctx.shadowBlur = 26; ctx.shadowOffsetY = 12;
  ctx.filter = o.filtro || 'none';
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

// ---------- el avión del diagrama (vista desde arriba), dibujado a mano ----------
const ALA = [[-36, -82], [-462, -22], [-470, 8], [-36, 40]], COLA = [[-30, 252], [-190, 286], [-196, 312], [-30, 318]];
const espejo = P => P.map(([x, y]) => [-x, y]);
const MOTORES = [-272, -142, 142, 272].map(x => [x, -82 + (Math.abs(x) - 36) / 426 * 60 - 6]);
const CABINA = [0, -300];
function dentro(P, x, y) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; }
// los balazos: solo donde un avión puede recibirlos y aun así volver (alas, fuselaje del medio, cola)
const BALAS = (() => { const out = [];
  for (let k = 0; out.length < 112 && k < 6000; k++) {
    const x = (hash2(k, 1) * 2 - 1) * 466, y = hash2(k, 2) * 700 - 360;
    const enAla = (dentro(ALA, x, y) || dentro(espejo(ALA), x, y)) && Math.abs(x) > 70 && MOTORES.every(([mx]) => Math.abs(x - mx) > 44);
    const enFuse = Math.abs(x) < 26 && y > -170 && y < 236;
    const enCola = dentro(COLA, x, y) || dentro(espejo(COLA), x, y);
    if ((enAla || enFuse || enCola) && out.every(([a, b]) => Math.hypot(a - x, b - y) > 17)) out.push([x, y, hash2(k, 3)]);
  }
  return out; })();
// o.puntos 0..1 = cuántos balazos se ven · o.blindaje 0..1 · o.limpias 0..1 (marca motores y cabina) · o.fantasma = solo contorno punteado
function avion(cx, cy, s, t, o = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.rotate(o.rot || 0); if (o.voltea) ctx.scale(1, o.voltea);
  ctx.globalAlpha *= o.a ?? 1;
  const linea = o.linea || TINTA, relleno = o.fantasma ? null : (o.relleno || HOJA);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = (o.grosor || 4) / Math.max(s, .3) * .5 + 2;
  if (o.fantasma) ctx.setLineDash([14, 12]);
  const forma = P => { ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); if (relleno) { ctx.fillStyle = relleno; ctx.fill(); } ctx.strokeStyle = linea; ctx.stroke(); };
  forma(ALA); forma(espejo(ALA)); forma(COLA); forma(espejo(COLA));
  for (const [mx, my] of MOTORES) { ctx.beginPath(); ctx.ellipse(mx, my - 18, 21, 50, 0, 0, 7); if (relleno) { ctx.fillStyle = relleno; ctx.fill(); } ctx.strokeStyle = linea; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx - 30, my - 70); ctx.lineTo(mx + 30, my - 70); ctx.stroke(); }
  ctx.beginPath(); ctx.roundRect(-38, -366, 76, 712, 38); if (relleno) { ctx.fillStyle = relleno; ctx.fill(); } ctx.strokeStyle = linea; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, 262); ctx.lineTo(0, 352); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0, -300, 20, 34, 0, 0, 7); ctx.stroke();
  ctx.setLineDash([]);
  // blindaje que querían los generales: placas grises sobre lo punteado
  const b = o.blindaje || 0;
  if (b > 0) { ctx.save(); ctx.globalAlpha *= b * .85; ctx.fillStyle = '#7d8590';
    const placa = P => { ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#3a3f47'; ctx.lineWidth = 4; ctx.stroke(); };
    const PL = [[-320, -50], [-462, -22], [-470, 8], [-320, 18]];
    placa(PL); placa(espejo(PL)); placa([[-200, -62], [-312, -46], [-312, 20], [-200, 26]]); placa(espejo([[-200, -62], [-312, -46], [-312, 20], [-200, 26]]));
    placa([[-30, -160], [30, -160], [30, 230], [-30, 230]]); placa(COLA); placa(espejo(COLA));
    ctx.fillStyle = '#c9ced6'; for (let k = 0; k < 40; k++) { const [x, y] = BALAS[k * 2]; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); }
    ctx.restore(); }
  // los balazos
  const n = Math.floor((o.puntos ?? 1) * BALAS.length);
  for (let k = 0; k < n; k++) { const [x, y, r] = BALAS[k], aparece = o.puntos < 1 ? clamp((o.puntos * BALAS.length - k) / 3) : 1;
    const late = o.late ? 1 + .25 * Math.max(0, Math.sin(t * 5 - r * 6)) : 1;
    ctx.fillStyle = o.balaCol || SANGRE; ctx.beginPath(); ctx.arc(x, y, 9.5 * back(aparece) * late, 0, 7); ctx.fill(); }
  // zonas limpias: motores y cabina
  const l = o.limpias || 0;
  if (l > 0) { ctx.save(); ctx.setLineDash([16, 11]); ctx.lineDashOffset = -t * 30; ctx.strokeStyle = o.limpiaCol || '#c98a12'; ctx.lineWidth = 7;
    for (const [x, y, r] of [...MOTORES.map(([mx, my]) => [mx, my - 18, 66]), [0, -296, 80]]) {
      if (o.relleno2) { ctx.fillStyle = `rgba(245,197,66,${.35 * l})`; ctx.beginPath(); ctx.arc(x, y, r * l, 0, 7); ctx.fill(); }
      ctx.beginPath(); ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * l); ctx.stroke(); }
    ctx.restore(); }
  ctx.restore();
}
// el diagrama impreso en una hoja, sujeta con cinta
function hoja(cx, cy, s, t, o = {}) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(o.rotHoja ?? -.025); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(40,28,20,.35)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
  caja(-500, -420, 1000, 840, 6, o.hojaCol || HOJA); ctx.shadowColor = 'transparent';
  // renglones tenues de papel cuadriculado
  ctx.strokeStyle = 'rgba(70,110,160,.08)'; ctx.lineWidth = 2; for (let y = -400; y < 420; y += 40) { ctx.beginPath(); ctx.moveTo(-490, y); ctx.lineTo(490, y); ctx.stroke(); }
  avion(0, 10, .98, t, o);
  if (o.pie !== false) txt(o.pie || 'FIG. 1 — aviones que volvieron', -470, 392, 22, { al: 'left', mono: true, peso: 600, col: 'rgba(22,22,29,.55)' });
  cinta(-440, -400, 170, -.5); cinta(440, -400, 170, .45);
  ctx.restore();
}

// ---------- monigote de pictograma (sin cara ni manos) ----------
function monigote(x, y, s, col, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha *= o.a ?? 1; ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(0, -118, 26, 0, 7); ctx.fill();
