<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Lista que suena</title><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:var(--fondo);font-family:var(--sans);color:var(--tinta)}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,var(--fondo) 0%,var(--fondo2) 100%)}
#grano{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(#0000000d 1px,transparent 1px);background-size:5px 5px}
#cuadricula{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(var(--tinta) 1px,transparent 1px),linear-gradient(90deg,var(--tinta) 1px,transparent 1px);background-size:45px 45px}
#lienzo{position:absolute;left:70px;top:0;width:940px;height:1920px}
#cabeza{position:absolute;left:0;width:940px;transition:none}
h1{position:relative;isolation:isolate;display:inline-block;font-size:92px;font-weight:800;letter-spacing:-4px;line-height:94px;white-space:nowrap;text-align:inherit}
h1 i{font-family:var(--serif);font-weight:400;letter-spacing:-2px}
#cinta{position:absolute;left:-8px;top:-22px;width:170px;height:36px;background:var(--acento);opacity:.85;transform:rotate(-4deg);z-index:-1}
ol{position:absolute;left:0;list-style:none;width:940px}
li{display:flex;align-items:center;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
li b{width:1.46em;font-weight:800;color:color-mix(in srgb,var(--tinta) 33%,transparent);font-variant-numeric:tabular-nums}
li.on b{color:var(--tinta)}
li span{display:inline-block;position:relative;isolation:isolate;padding:2px 12px;margin-left:-12px}
li span u{position:absolute;left:0;top:8px;bottom:6px;background:var(--acento);z-index:-1;border-radius:4px;transform:rotate(-.6deg)}
.grupo{position:absolute;left:0;width:940px}
.fila{position:absolute;left:0;width:940px;height:150px}
.tapa{position:absolute;left:0;top:0;width:150px;height:150px;border-radius:20px;box-shadow:0 12px 26px #0000002e,0 2px 5px #0000001f;overflow:hidden}
.tapa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.disco{position:absolute;left:14px;top:14px;width:122px;height:122px;border-radius:50%;background:repeating-radial-gradient(circle,#1b1a17 0 3px,#33312b 3px 5px)}
.sello{position:absolute;left:39px;top:39px;width:44px;height:44px;border-radius:50%;background:var(--sello);display:flex;align-items:center;justify-content:center;font-size:25px}
.txt{position:absolute;left:182px;top:-2px;width:758px}
.tit{font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1.1;white-space:nowrap}
.art{font-family:var(--serif);font-style:italic;font-size:31px;color:color-mix(in srgb,var(--tinta) 72%,transparent);line-height:1.25;white-space:nowrap}
.onda{position:absolute;left:182px;top:100px;width:758px;height:46px;display:flex;align-items:center;gap:5px}
.onda s{display:block;width:6px;border-radius:3px;background:color-mix(in srgb,var(--tinta) 22%,transparent)}
.onda s.g{background:var(--tinta)}
.barra{position:absolute;left:182px;top:118px;width:743px;height:10px;border-radius:5px;background:color-mix(in srgb,var(--tinta) 16%,transparent);overflow:hidden}
.barra s{display:block;height:100%;width:100%;background:var(--tinta);transform-origin:0 50%}
#firma{position:absolute;left:0;right:0;text-align:center;font-size:30px;font-weight:600;color:color-mix(in srgb,var(--tinta) 69%,transparent)}
.pant{position:absolute;left:0;width:940px;opacity:0}
.pant .n{font-size:190px;font-weight:800;letter-spacing:-9px;line-height:.95;display:block;white-space:nowrap}
.pant .n small{font-size:84px;letter-spacing:-3px}
.pant .l{font-size:68px;font-weight:800;letter-spacing:-2.6px;line-height:1.1;display:block}
.pant .c{font-family:var(--serif);font-style:italic;font-weight:400;font-size:66px;letter-spacing:-1.2px;line-height:1.12;display:block}
.pant .p{display:inline-block;background:var(--acento);padding:6px 34px;margin:18px 0;transform:rotate(-2deg);font-size:124px;font-weight:800;letter-spacing:-4px;line-height:1.15;white-space:nowrap}
#aviso{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:90px;font-size:44px;font-weight:700;text-align:center;background:#fff;color:#b00020}
</style></head><body><div id="bg"></div><div id="grano"></div><div id="cuadricula"></div>
<div id="lienzo"><div id="cabeza"><h1 id="h1"><span id="cinta"></span></h1></div><ol id="ol"></ol><div id="items"></div><div id="cierre"></div></div>
<div id="firma"></div><div id="aviso"></div>
<script src="config.js"></script><script src="tiempos.js"></script><script>
(function(){
const C=window.CONFIG, T=window.TIEMPOS, $=id=>document.getElementById(id);
if(!C||!T){const a=$('aviso');a.style.display='flex';a.textContent=!C?'Falta config.js':'Falta tiempos.js. Genera los tiempos con scripts/voz.mjs antes de abrir esta página.';window.draw=()=>{};window.FRAMES=0;window.listo=Promise.resolve([]);return;}
const F=C.filas||{}, K=C.colores, R=document.documentElement.style;
R.setProperty('--fondo',K.fondo);R.setProperty('--fondo2',K.fondo2||K.fondo);R.setProperty('--tinta',K.tinta);R.setProperty('--acento',K.acento);R.setProperty('--sello',K.selloDisco||'#f4f1ea');
R.setProperty('--sans',C.fuentes.sans);R.setProperty('--serif',C.fuentes.serif);
const A=C.adornos||{}; if(!A.grano)$('grano').remove(); if(!A.cuadricula)$('cuadricula').remove(); if(!A.cinta)$('cinta').remove();
const crea=(et,cls,txt)=>{const e=document.createElement(et);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const ajusta=(el,max,min)=>{let px=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>max&&px>min){px-=2;el.style.fontSize=px+'px';}if(el.scrollWidth>max){el.style.overflow='hidden';el.style.textOverflow='ellipsis';el.style.maxWidth=max+'px';}};

// ── título
const h1=$('h1'), centro=C.titulo.alineacion==='centro'; $('cabeza').style.textAlign=centro?'center':'left';
h1.appendChild(document.createTextNode(C.titulo.linea1));
if(C.titulo.linea2){h1.appendChild(crea('br'));h1.appendChild(crea('i','',C.titulo.linea2));}
ajusta(h1,940,56);
const lineas=C.titulo.linea2?2:1, N=C.categorias.length, FILA=178;
// ── reparto vertical: título, lista, tres filas. Todo cabe entre 250 y ~1575 px.
let listaY=258+lineas*94+54, altoLi=Math.max(48,Math.min(80,Math.floor((1069-55-listaY)/N))), itemsY=listaY+N*altoLi+55;
const baja=Math.max(0,Math.min(120,Math.round((1069-itemsY)/2)));
$('cabeza').style.top=(258+baja)+'px'; listaY+=baja; itemsY+=baja;
const ol=$('ol'); ol.style.top=listaY+'px';
const lis=C.categorias.map((k,i)=>{const li=crea('li');li.style.height=altoLi+'px';li.style.fontSize=Math.round(altoLi*.65)+'px';
  li.appendChild(crea('b','',(i+1)+'.'));const sp=crea('span'),u=crea('u'),em=crea('em');em.style.fontStyle='normal';sp.append(u,em);li.appendChild(sp);ol.appendChild(li);
  em.textContent=k.nombre;ajusta(li,940,24);em.textContent='';return{li,u,em}});

// ── filas: un grupo por categoría, ya armado (así las carátulas cargan antes de dibujar)
let sem=7;const rnd=()=>(sem=(sem*16807)%2147483647)/2147483647;
const cont=$('items'), cargas=[], BARRAS=68;
const disco=(tapa,icono)=>{const d=crea('div','disco');d.appendChild(crea('div','sello',icono||''));tapa.appendChild(d);return d};
const grupos=C.categorias.map((k,ki)=>{const g=crea('div','grupo');g.style.top=itemsY+'px';cont.appendChild(g);
  const filas=k.items.map((it,i)=>{const fl=crea('div','fila');fl.style.top=(i*FILA)+'px';g.appendChild(fl);
    const tapa=crea('div','tapa');tapa.style.background=K.tapas[i%K.tapas.length];fl.appendChild(tapa);let dsc=null;
    const o={fl,tapa,get disco(){return dsc}};
    if(it.caratula){const im=new Image();tapa.appendChild(im);
      cargas.push(new Promise(ok=>{im.onload=()=>ok(null);im.onerror=()=>{im.remove();dsc=disco(tapa,k.icono);ok(it.caratula)};im.src=it.caratula;}));}
    else dsc=disco(tapa,k.icono);
    const txt=crea('div','txt'),tit=crea('div','tit',it.nombre),art=crea('div','art',[it.autor,it.etiqueta].filter(Boolean).join(' · '));txt.append(tit,art);fl.appendChild(txt);
    ajusta(tit,758,28);ajusta(art,758,22);
    let onda=null,barra=null;
    if(F.indicador==='onda'){onda=crea('div','onda');for(let j=0;j<BARRAS;j++){const s=crea('s');s.style.height=Math.round(8+38*Math.abs(Math.sin(j*.37+rnd()*6))*(.35+.65*rnd()))+'px';onda.appendChild(s);}fl.appendChild(onda);}
    else if(F.indicador==='barra'){barra=crea('div','barra');barra.appendChild(crea('s'));fl.appendChild(barra);}
    return Object.assign(o,{txt,onda,barra});});
  g.style.display='none';return{g,filas}});

// ── cierre
const cz=$('cierre');
const pants=C.cierre.pantallas.map(p=>{const d=crea('div','pant');d.style.top=(itemsY+10)+'px';d.style.textAlign=p.alineacion==='centro'?'center':'left';
  if(p.grande){const n=crea('span','n');p.grande.split(/(_[^_]+_)/).forEach(tr=>{if(/^_.+_$/.test(tr))n.appendChild(crea('small','',tr.slice(1,-1)));else if(tr)n.appendChild(document.createTextNode(tr));});d.appendChild(n);ajusta(n,940,90);}
  if(p.linea)d.appendChild(crea('span','l',p.linea));
  if(p.palabra){const s=crea('span','p',p.palabra);d.appendChild(s);ajusta(s,900,60);d.appendChild(crea('br'));}
  if(p.cursiva)d.appendChild(crea('span','c',p.cursiva));
  cz.appendChild(d);return{d,pop:!!p.palabra}});
const firma=$('firma'); if(C.firma){firma.textContent=C.firma;firma.style.top=(C.firmaY||1640)+'px';}else firma.remove();

const lim=t=>Math.min(1,Math.max(0,t)), ease=t=>1-Math.pow(1-lim(t),3);
const atras=t=>{t=lim(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const FRAG=T.frag, juntas=F.entrada==='juntas', oculta=F.alTerminar==='ocultar';

function draw(f){
  const t=f/T.fps; let k=-1; T.cats.forEach((c,i)=>{if(t>=c.t0)k=i}); const fin=t>=T.cierre.t0;
  lis.forEach((o,i)=>{const n=C.categorias[i].nombre,l=t-T.cats[i].t0;
    o.em.textContent=i<k?n:i===k?n.slice(0,Math.round(n.length*Math.min(1,l/.3))):'';
    o.li.className=i<=k?'on':''; o.u.style.right=(F.resaltarCategoria!==false&&i===k&&!fin)?(100-100*ease((l-.2)/.3))+'%':'100%';});
  grupos.forEach((g,i)=>{g.g.style.display=(i===k&&!fin)?'block':'none'});
  if(k>=0&&!fin){const c=T.cats[k], sale=1-ease((t-(c.t1-.2))/.2);
    grupos[k].filas.forEach((o,i)=>{const entra=juntas?c.t0+.45+i*.12:c.tItems[i]-.12, p=atras((t-entra)/.35), a=t-c.tItems[i], act=a>=0&&a<FRAG, ya=a>=0;
      o.fl.style.opacity=(t>entra?1:0)*sale;
      o.tapa.style.transform=`scale(${p*(act?1.06:1)}) rotate(${(i%2?2:-2)*(act?1:.4)}deg)`;
      if(o.disco)o.disco.style.transform=`rotate(${act?a*200:0}deg)`;
      const q=ease(a/.25); o.txt.style.opacity=ya?(act?q:(oculta?0:.5)):0; o.txt.style.transform=`translateX(${ya?(1-q)*24:0}px)`;
      if(o.onda){o.onda.style.opacity=act?q:0; const n=Math.floor(BARRAS*a/FRAG);
        if(act)[...o.onda.children].forEach((s,j)=>{s.className=j<=n?'g':'';s.style.transform=`scaleY(${j<=n&&j>n-5?1.25:1})`});}
      if(o.barra){o.barra.style.opacity=act?q:0; o.barra.firstChild.style.transform=`scaleX(${lim(a/FRAG)})`;}
    });}
  const fuera=C.cierre.ocultarLista&&fin?1-ease((t-T.cierre.t0)/.3):1;
  $('cabeza').style.opacity=fuera; ol.style.opacity=fuera;
  pants.forEach((o,j)=>{const p=T.cierre.pantallas[j], ult=j===pants.length-1, x=t-p.t0;
    const q=ease(x/.35)*(ult?1:1-ease((t-(p.t1-.25))/.25));
    o.d.style.opacity=(fin&&x>=0)?q:0;
    o.d.style.transform=o.pop?`scale(${.85+.15*atras(x/.4)})`:`translateY(${(1-ease(x/.35))*26}px)`;
    if(C.cierre.ocultarLista)o.d.style.top='700px';});
}
window.draw=draw; window.FRAMES=T.frames; window.FPS=T.fps;
window.listo=Promise.all(cargas).then(r=>r.filter(Boolean));   // devuelve las carátulas que NO cargaron
draw(0);
})();
</script></body></html>
