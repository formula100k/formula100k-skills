<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!--
  reel-motion-recortada-f100k · motor del reel (1080×1920)
  NO se edita a mano: armar.py inyecta __DUR__, __PLAN__, __PALABRAS__ y __TAMS__.
  Todo lo que cambia de un reel a otro vive en plan.json.
-->
<style>
  :root {
    --fondo: #050509;     /* negro de la marca */
    --tinta: #f4f1ea;     /* blanco cálido */
    --blanco: #ffffff;
    --oro: #F5C542;       /* EL acento, uno solo */
    --oro-suave: rgba(245,197,66,.22);
    --pelo: #24242e;      /* bordes de un pelo */
    --carbon: #0b0b10;
    --gris: #a1a1aa;
    --sans: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --serif: Georgia, 'Times New Roman', Times, serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); color: var(--tinta); font-family: var(--sans); }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

  /* ── FONDO: negro con brillo cálido. En modo cara brilla detrás de la cabeza; en motion, detrás de la franja ── */
  #fondo { position: absolute; inset: 0; background: var(--fondo); }
  .halo { position: absolute; border-radius: 50%; filter: blur(90px); }
  #halo-cara { width: 900px; height: 900px; left: 90px; top: 260px; background: radial-gradient(circle, rgba(245,197,66,.30), rgba(245,197,66,0) 70%); }
  #halo-motion { width: 1000px; height: 520px; left: 40px; top: 1440px; background: radial-gradient(ellipse, rgba(245,197,66,.26), rgba(245,197,66,0) 70%); opacity: 0; }
  #viñeta { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,.65) 100%); }

  /* ── GANCHO CON SU TOMA REAL (22-oct, como «ELIMINA / tus destacadas»): la toma original más abajo, el hueco de
     arriba con la misma toma desenfocada y oscura, y el título golpe encima ── */
  #golpe-real { position: absolute; inset: 0; overflow: hidden; background: #000; }
  #golpe-bg { position: absolute; left: -108px; top: -192px; width: 1296px; height: 2304px; object-fit: cover;
              filter: blur(30px) brightness(.5) saturate(1.15); }
  #golpe-fg { position: absolute; left: 0; top: var(--gdy, 0px); width: 1080px; height: 1920px; object-fit: cover;
              -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 300px); mask-image: linear-gradient(to bottom, transparent 0, #000 300px); }
  #golpe-real .sombra { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.5) 0%, rgba(0,0,0,.15) 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,.35) 100%); }

  /* ── ESCENARIO (modo motion): título + piezas. Ocupa todo el cuadro; la persona va encima, abajo ── */
  #escenario { position: absolute; inset: 0; opacity: 0; }
  .escena { position: absolute; inset: 0; opacity: 0; visibility: hidden; }

  /* Título tecleado (el de la referencia, 19-oct): línea 1 en blanco y la línea 2 dentro de un bloque dorado
     que se barre de izquierda a derecha, con letra negra. Misma sans gruesa en las dos; nada de serif ni subrayado. */
  /* 19-oct (2): a 56 px y pegado arriba «no impacta». Va grande (84 px, baja si la línea es larga) y más cerca del objeto. */
  .titulo { position: absolute; left: 40px; right: 40px; top: 250px; text-align: center; transform-origin: 50% 40%; }
  .titulo .l { display: block; font-weight: 800; font-size: var(--fs, 84px); line-height: 1.16; letter-spacing: -2px; color: var(--blanco);
               text-shadow: 0 3px 14px rgba(0,0,0,.6); }
  .titulo .c { opacity: 0; }
  .titulo .l.bloque { margin-top: 6px; }
  .titulo .bt { position: relative; z-index: 0; display: inline-block; padding: 2px 18px 6px; color: var(--fondo); text-shadow: none; }
  .titulo .bt .fc { position: absolute; inset: 0; background: var(--oro); border-radius: 8px; transform-origin: 0 50%; z-index: -1;
                      box-shadow: 0 0 40px rgba(245,197,66,.35); }
  .titulo .bt .c { position: relative; }

  /* Título GOLPE (22-oct: «el gancho con las letras doradas no está llamando la atención»; refs «ELIMINA /
     tus destacadas» y «IDEAS DE REELS / en historias»). Es el título del GANCHO por defecto: una línea ENORME en
     mayúsculas con relleno degradado, canto 3D y brillo de su color (rojo · verde · amarillo) y otra chica en blanco
     (sans gruesa o serif). Opcional: un ícono del tema encima. Nada de bloque dorado. */
  .titulo.golpe { top: var(--gy, 230px); }
  .titulo.golpe .ico { display: block; margin: 0 auto 18px; height: var(--ih, 170px); width: auto;
                       filter: drop-shadow(0 14px 26px rgba(0,0,0,.55)); }
  /* 23-oct (edición sin olor a IA): color plano, sin degradado, canto 3D ni brillo; letra de diseño por tema.
     .g.condensada = póster condensado (default) · .g.serif = itálica elegante · .g.palo = la sans gruesa de antes */
  .titulo.golpe .g { display: block; font-weight: 900; font-size: var(--fg, 190px); line-height: 1.02; letter-spacing: -4px;
                     text-transform: uppercase; color: var(--c2); padding: 0 12px;
                     text-shadow: 0 4px 14px rgba(0,0,0,.55); }
  .titulo.golpe .g.condensada { font-family: 'Impact', 'DIN Condensed', 'Haettenschweiler', 'Arial Narrow', sans-serif; font-weight: 400; letter-spacing: 0; }
  .titulo.golpe .g.serif { font-family: Didot, 'Bodoni 72', Georgia, serif; font-style: italic; font-weight: 700; letter-spacing: -3px; }
  .titulo.golpe .ch { display: block; font-weight: 800; font-size: var(--fc, 84px); line-height: 1.1; letter-spacing: -2px;
                      color: #fff; text-shadow: 0 4px 0 rgba(0,0,0,.35), 0 8px 26px rgba(0,0,0,.75); margin: 4px 0; }
  .titulo.golpe .ch.serif { font-family: Didot, 'Bodoni 72', Georgia, serif; font-weight: 400; letter-spacing: -1px;
                            font-size: calc(var(--fc, 84px) * 1.15); }

  /* Flecha dibujada a mano: baja del título y apunta a lo que se muestra (19-oct: «no sale una flecha ni nada») */
  .flecha { position: absolute; z-index: 3; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; pointer-events: none; }
  .flecha path { fill: none; stroke: var(--oro); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round;
                 filter: drop-shadow(0 0 14px rgba(245,197,66,.55)); }

  /* ── SKILL: tarjeta de una skill de Claude que se instala y trabaja (mockup para «usa este skill») ── */
  .skl { width: 900px; padding: 44px 46px 46px; border-radius: 36px; background: #121219; text-align: left;
         border: 2px solid rgba(245,197,66,.35); box-shadow: 0 0 90px rgba(245,197,66,.20), 0 40px 90px rgba(0,0,0,.7); }
  .skl .cab { display: flex; align-items: center; gap: 30px; }
  .skl .ico { flex: none; width: 128px; height: 128px; border-radius: 30px; background: linear-gradient(145deg, #F7C66A, #D9922E);
              display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(245,197,66,.35); }
  .skl .ico img { width: 82px; height: 82px; border-radius: 18px; }
  .skl .nom { flex: 1; min-width: 0; }
  .skl .nom b { display: block; font-weight: 800; font-size: 48px; line-height: 1.08; letter-spacing: -1.2px; color: var(--blanco); }
  .skl .nom i { display: block; margin-top: 8px; font-style: normal; font-weight: 600; font-size: 30px; color: rgba(244,241,234,.55); }
  .skl .btn { flex: none; position: relative; min-width: 250px; text-align: center; white-space: nowrap; padding: 14px 26px; border-radius: 999px; font-weight: 800; font-size: 30px;
              border: 2px solid var(--oro); color: var(--oro); }
  .skl .btn .ok { position: absolute; inset: -2px; border-radius: 999px; background: var(--oro); color: var(--fondo);
                  display: flex; align-items: center; justify-content: center; white-space: nowrap; opacity: 0; }
  .skl .sep { height: 2px; margin: 36px 0 32px; background: rgba(255,255,255,.08); }
  .skl .vid { display: flex; align-items: center; gap: 28px; padding: 18px; border-radius: 22px; background: rgba(255,255,255,.05); }
  .skl .vid .th { position: relative; flex: none; width: 128px; height: 170px; border-radius: 14px; overflow: hidden; }
  .skl .vid .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .skl .vid .th:after { content: ''; position: absolute; left: 50%; top: 50%; margin: -22px 0 0 -14px; border-left: 38px solid #fff;
                        border-top: 22px solid transparent; border-bottom: 22px solid transparent; filter: drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
  .skl .vid b { display: block; font-weight: 800; font-size: 38px; color: var(--tinta); }
  .skl .vid i { display: block; margin-top: 8px; font-style: normal; font-size: 28px; color: rgba(244,241,234,.5); }
  .skl .sal { margin-top: 30px; }
  .skl .sal .et { font-weight: 800; font-size: 26px; letter-spacing: 3px; color: var(--oro); text-transform: uppercase; }
  .skl .sal .it { display: flex; align-items: center; gap: 22px; margin-top: 18px; font-weight: 700; font-size: 42px; color: var(--tinta); }
  .skl .sal .it em { flex: none; width: 58px; height: 58px; border-radius: 14px; background: var(--oro); color: var(--fondo);
                     font-style: normal; font-weight: 800; font-size: 32px; display: flex; align-items: center; justify-content: center; }

  /* ── POST_IG: un post ya publicado en Instagram (modo oscuro). La imagen va completa en su proporción (4:5 carrusel) ── */
  .pig { width: 780px; background: #000; border-radius: 30px; overflow: hidden; text-align: left; border: 2px solid rgba(255,255,255,.14);
         box-shadow: 0 0 80px rgba(245,197,66,.18), 0 40px 90px rgba(0,0,0,.7); }
  .pig .hd { display: flex; align-items: center; gap: 18px; padding: 22px 24px; }
  .pig .av { width: 66px; height: 66px; border-radius: 50%; padding: 3px; background: linear-gradient(45deg, #f9ce34, #ee2a7b, #6228d7); }
  .pig .av img { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #000; object-fit: cover; display: block; }
  .pig .hd b { font-weight: 700; font-size: 30px; color: #fff; }
  .pig .hd .vf { display: inline-block; width: 26px; height: 26px; margin-left: 6px; vertical-align: -3px; border-radius: 50%; background: #3897f0;
                 color: #fff; font-size: 18px; line-height: 26px; text-align: center; font-weight: 800; }
  .pig .hd .mas { margin-left: auto; font-size: 36px; color: #fff; letter-spacing: 2px; }
  .pig .ft { position: relative; overflow: hidden; background: #111; }
  .pig .ft .tira { display: flex; height: 100%; }
  .pig .ft .tira img { flex: none; width: 100%; height: 100%; object-fit: cover; display: block; }
  .pig .ft .cnt { position: absolute; right: 20px; top: 20px; padding: 6px 16px; border-radius: 999px; background: rgba(0,0,0,.7); color: #fff; font-size: 24px; font-weight: 700; }
  .pig .ac { display: flex; align-items: center; gap: 28px; padding: 20px 24px 8px; }
  .pig .ac svg { width: 48px; height: 48px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
  .pig .ac .gu { margin-left: auto; }
  .pig .ac .pts { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .pig .ac .pts i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .pig .ac .pts i.on { background: #3897f0; }
  .pig .tx { padding: 6px 24px 26px; font-size: 27px; line-height: 1.35; color: #fff; }
  .pig .tx b { font-weight: 700; }
  .pig .tx .lk { display: block; font-weight: 700; margin-bottom: 6px; }
  /* Destello del golpe del cuadro 0 */
  #destello { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(255,214,140,.55), rgba(245,197,66,.18) 60%, rgba(0,0,0,0) 85%);
              opacity: 0; pointer-events: none; }

  /* Pieza: .pz (entra/sale) > .flota (respira) > .in (centrado en su lugar) */
  .pz { position: absolute; width: 0; height: 0; opacity: 0; visibility: hidden; }
  .flota { position: absolute; left: 0; top: 0; width: 0; height: 0; }
  .in { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); }

  .marco { border-radius: 26px; border: 2px solid rgba(255,255,255,.16); background: var(--carbon); overflow: hidden;
           box-shadow: 0 0 0 1px rgba(245,197,66,.10), 0 0 70px rgba(245,197,66,.18), 0 30px 80px rgba(0,0,0,.6); }
  .marco img, .marco video { display: block; width: 100%; height: 100%; object-fit: cover; }

  .tel { border-radius: 46px; border: 3px solid #2c2c36; padding: 10px; background: #0d0d12;
         box-shadow: 0 0 0 1px rgba(245,197,66,.12), 0 0 80px rgba(245,197,66,.20), 0 40px 90px rgba(0,0,0,.7); }
  .tel .pant { border-radius: 36px; overflow: hidden; width: 100%; height: 100%; background: #111; }
  .tel .pant img, .tel .pant video { display: block; width: 100%; height: 100%; object-fit: cover; }
  .chip-vistas { margin: 18px auto 0; width: max-content; padding: 8px 18px; border-radius: 999px; background: rgba(255,255,255,.06);
                 border: 1px solid var(--pelo); font-weight: 700; font-size: 26px; color: var(--tinta); }
  .chip-vistas b { color: var(--oro); }

  .grilla { display: grid; grid-template-columns: repeat(3, 230px); gap: 22px; }
  .grilla .card { width: 230px; height: 400px; }
  .grilla .card .vis { position: absolute; left: 12px; bottom: 12px; font-weight: 800; font-size: 22px; color: #fff;
                       text-shadow: 0 2px 8px rgba(0,0,0,.9); }
  .grilla .cw { position: relative; }

  .graf { width: 900px; }
  .graf .et { text-align: center; font-weight: 700; font-size: 40px; color: var(--tinta); margin-bottom: 14px; }
  .graf svg { width: 900px; height: 460px; overflow: visible; }
  .graf .eje { stroke: rgba(255,255,255,.18); stroke-width: 2; fill: none; }
  .graf .guia { stroke: rgba(255,255,255,.08); stroke-width: 2; fill: none; }
  .graf .linea { stroke: var(--oro); stroke-width: 9; fill: none; stroke-linecap: round; filter: drop-shadow(0 0 14px rgba(245,197,66,.65)); }
  .graf .punto { fill: var(--fondo); stroke: #fff; stroke-width: 5; }

  .barra { width: 880px; }
  .barra .riel { height: 40px; border-radius: 8px; border: 2px solid rgba(255,255,255,.22); padding: 4px; }
  .barra .lleno { height: 26px; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #c8892c, var(--oro));
                  box-shadow: 0 0 22px rgba(245,197,66,.7); transform-origin: 0 50%; transform: scaleX(0); display: block; }
  .barra .num { margin-top: 14px; font-weight: 800; font-size: 56px; color: var(--oro); }
  .barra .et { display: inline-block; margin-top: 16px; padding: 10px 22px; border: 2px solid rgba(255,255,255,.85); border-radius: 8px;
               font-weight: 700; font-size: 40px; color: #fff; }

  .caja { padding: 18px 34px; border: 2.5px solid rgba(255,255,255,.88); border-radius: 12px; background: rgba(5,5,9,.85);
          font-weight: 700; font-size: 46px; color: #fff; text-align: center; max-width: 900px; box-shadow: 0 0 40px rgba(255,255,255,.08); }
  .caja .c { opacity: 0; }

  .doc { width: 780px; padding: 40px 56px 48px 90px; }
  .doc .dt { font-family: var(--serif); font-style: italic; font-size: 48px; text-align: center; color: var(--tinta); margin-bottom: 18px; }
  .doc .sec { position: relative; margin-top: 26px; }
  .doc .sn { font-weight: 800; font-size: 36px; color: #fff; margin-bottom: 8px; }
  .doc .ln { display: block; height: 12px; border-radius: 5px; background: rgba(255,255,255,.28); margin: 9px 0; transform-origin: 0 50%; }
  .doc .sec.oro .ln { background: var(--oro); box-shadow: 0 0 12px rgba(245,197,66,.55); }
  .doc .sec.oro .sn { color: var(--oro); }
  .doc .marca { position: absolute; left: -66px; top: 0; width: 48px; height: 48px; border-radius: 10px; background: var(--oro);
                color: #111; font-weight: 900; font-size: 30px; display: flex; align-items: center; justify-content: center;
                box-shadow: 0 0 22px rgba(245,197,66,.6); }

  .obj img { display: block; filter: drop-shadow(0 0 40px rgba(245,197,66,.35)) drop-shadow(0 30px 40px rgba(0,0,0,.6)); }

  .lista { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .lista .it { display: block; padding: 12px 30px; border-radius: 10px; background: var(--oro); color: #111; font-weight: 800; font-size: 40px;
               letter-spacing: -.8px; box-shadow: 0 0 34px rgba(245,197,66,.45); white-space: nowrap; }
  .lista .it.ultimo { background: transparent; color: var(--oro); border: 2.5px solid var(--oro); }

  .pant-gr { position: relative; }
  .pant-gr .marco { position: relative; }
  .pant-gr .scroll { position: absolute; left: 0; top: 0; width: 100%; }
  .pant-gr .scroll img { width: 100%; height: auto; display: block; }

  .numero { text-align: center; white-space: nowrap; }
  .numero .n { font-weight: 800; font-size: 230px; line-height: 1; letter-spacing: -8px; color: #fff; text-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .numero .n i { font-family: var(--serif); font-style: italic; font-weight: 600; color: var(--oro); letter-spacing: -3px; font-size: 170px; }
  .numero .et { margin-top: 10px; font-weight: 700; font-size: 38px; color: var(--tinta); }

  .frase { width: 900px; text-align: center; font-weight: 800; font-size: 104px; line-height: 1.04; letter-spacing: -4px; color: #fff; }
  .frase .w { display: inline-block; opacity: 0; margin: 0 .12em; }
  .frase .w.clave { font-family: var(--serif); font-style: italic; font-weight: 600; color: var(--oro); letter-spacing: -2px; }

  /* ── CAPTURA REAL con resaltes dorados que aparecen cuando se nombran ── */
  .cap { position: relative; }
  .cap .marco { position: relative; }
  .cap img { display: block; width: 100%; height: auto; }
  .cap .res { position: absolute; border: 4px solid var(--oro); border-radius: 12px; background: rgba(245,197,66,.10);
              box-shadow: 0 0 26px rgba(245,197,66,.55), inset 0 0 18px rgba(245,197,66,.18); }
  .cap .res .marca { position: absolute; left: -26px; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 10px;
                     background: var(--oro); color: #111; font-weight: 900; font-size: 30px; display: flex; align-items: center;
                     justify-content: center; box-shadow: 0 0 22px rgba(245,197,66,.6); }
  .cap .velo { position: absolute; inset: 0; background: rgba(5,5,9,.55); opacity: 0; }
  .tel .pant img { object-position: top center; }
  .tel-wrap { position: relative; }
  .tel .barra-t { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 14px; border-radius: 0 0 36px 36px; overflow: hidden; background: rgba(0,0,0,.55); }
  .tel .barra-t i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #c8892c, var(--oro)); transform-origin: 0 50%;
                    box-shadow: 0 0 18px rgba(245,197,66,.8); }
  .crono { position: absolute; width: 230px; height: 230px; border-radius: 50%; background: rgba(5,5,9,.92);
           box-shadow: 0 0 0 2px rgba(245,197,66,.35), 0 0 60px rgba(245,197,66,.35), 0 20px 50px rgba(0,0,0,.7); }
  .crono svg { position: absolute; inset: 0; width: 230px; height: 230px; transform: rotate(-90deg); }
  .crono circle { fill: none; stroke-width: 12; }
  .crono .fondo-c { stroke: rgba(255,255,255,.12); }
  .crono .arco { stroke: var(--oro); stroke-linecap: round; filter: drop-shadow(0 0 8px rgba(245,197,66,.8)); }
  .crono .cn { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .crono .cn b { font-weight: 800; font-size: 104px; line-height: .9; color: #fff; letter-spacing: -4px; }
  .crono .cn i { font-family: var(--serif); font-style: italic; font-weight: 600; font-size: 38px; color: var(--oro); }

  .tachado { display: flex; gap: 46px; align-items: center; }
  .tachado .item { position: relative; text-align: center; }
  .tachado .ft { position: relative; overflow: hidden; border: 2px solid rgba(255,255,255,.16); background: var(--carbon);
                 box-shadow: 0 0 50px rgba(245,197,66,.14), 0 30px 70px rgba(0,0,0,.6); }
  .tachado .ft.circulo { border-radius: 50%; }
  .tachado .ft.tarjeta { border-radius: 26px; }
  .tachado .ft img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .tachado .ft .velo { position: absolute; inset: 0; background: rgba(5,5,9,.6); opacity: 0; }
  .tachado svg.x { position: absolute; inset: -8%; width: 116%; height: 116%; overflow: visible; }
  .tachado svg.x path { fill: none; stroke: var(--oro); stroke-width: 14; stroke-linecap: round; filter: drop-shadow(0 0 12px rgba(245,197,66,.75)); }
  .tachado .et { margin-top: 18px; font-weight: 800; font-size: 38px; color: var(--tinta); }

  /* ── LA PERSONA · estilo VENTANA (por defecto): abajo en una franja con un poco de su fondo real ── */
  #cara-wrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 540px 700px; }
  #cara-in, #vent-in { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; }
  #cara-in video, #vent-in video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
  #ventana { position: absolute; left: 36px; top: __VT__px; width: 1008px; height: __VH__px; overflow: hidden;
             border-radius: 34px 34px 0 0; border: 2px solid rgba(255,255,255,.16); border-bottom: 0;
             box-shadow: 0 0 0 1px rgba(245,197,66,.14), 0 -10px 70px rgba(245,197,66,.20); }
  #ventana .fundido { position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(to bottom, rgba(5,5,9,0), rgba(5,5,9,.85)); }

  .esc-chat .cab img { width: 64px; height: 64px; border-radius: 16px; }
  .esc-chat .caja-in { position: relative; padding: 34px 36px 92px; border-radius: 30px; background: #1d1c22; border: 2px solid rgba(255,255,255,.14);

        box-shadow: 0 0 90px rgba(37,211,102,.18), 0 30px 80px rgba(0,0,0,.6); }
  .nv .play { width: 96px; height: 96px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; }
  .nv .play i { display: block; width: 0; height: 0; margin-left: 8px; border-left: 34px solid #fff; border-top: 21px solid transparent; border-bottom: 21px solid transparent; }
  .nv .onda { display: flex; align-items: center; gap: 7px; height: 110px; }

                  display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(245,197,66,.6); }

  .carp { position: relative; width: 900px; height: 900px; }

  /* ── SUBTÍTULOS: una o dos palabras, al centro ── */

           color: rgba(255,255,255,.55); text-transform: uppercase; }

<body>
<div id="root" data-composition-id="reel" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
  <div id="fondo"><div id="halo-cara" class="halo"></div><div id="halo-motion" class="halo"></div></div>
__GOLPE__
  <div id="escenario"></div>
__PERSONA__
__REAL__
  <div id="viñeta"></div>
  <div id="destello"></div>
  <div id="subs"></div>
  <div id="firma"></div>

  <script>window.PLAN = __PLAN__; window.PALABRAS = __PALABRAS__; window.TAMS = __TAMS__;</script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
  (function () {
    const P = window.PLAN, W = window.PALABRAS, DUR = P.duracion;
    const tl = gsap.timeline({ paused: true });
    const $ = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
    // Trazo que se dibuja: largo real en px y oculto hasta que empieza (el remate redondo deja un punto)
    const trazo = (el, at, dur, ease) => {
      const L = el.getTotalLength();
      gsap.set(el, { strokeDasharray: L + ' ' + (L + 2), strokeDashoffset: L, opacity: 0 });
      tl.set(el, { opacity: 1 }, at);
      tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || 'power2.inOut' }, at);
    };
    const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));

    // ── 1. MODOS: las escenas son modo motion; los huecos entre ellas, modo cara ──
    //   variaciones por escena: "completa": true → motion a pantalla completa (la persona sale por abajo)
    //                           "real": true     → la toma original con su fondo, a pantalla completa (dramatización)
    const todas = (P.escenas || []).slice().sort((a, b) => a.desde - b.desde);
    const reales = todas.filter(e => e.real);
    const escenas = todas.filter(e => !e.real);
    const modoEn = t => {
      const e = todas.find(e => t >= e.desde && t < e.hasta);
      return !e ? 'cara' : e.real ? 'real' : e.golpe_real ? 'golpe' : e.completa ? 'completa' : 'motion';
    };
    const conEscenario = m => m === 'motion' || m === 'completa' || m === 'golpe';
    const Y = P.yo;   // {cara:{s,x,y}, motion:{s,x,y}} calculado por armar.py desde silueta.json
    const pose = m => m === 'completa' ? { scale: Y.motion.s, x: Y.motion.x, y: Y.motion.y + 1000 }
                    : m === 'real' || m === 'golpe' ? pose('cara') : { scale: Y[m].s, x: Y[m].x, y: Y[m].y };
    const T = 0.6;    // duración del cambio de modo (más corta se siente brusca)
    const SALIDA = 0.35;   // escena → escena sin pasar por la cara: la vieja sube y se funde antes de que entre la nueva

    const VENT = (Y.estilo || 'ventana') === 'ventana';
    const ini = modoEn(0);
    if (VENT) {
      tl.set('#cara-in', pose('cara'), 0); tl.set('#vent-in', pose('motion'), 0);
      tl.set('#cara-wrap', { autoAlpha: ini === 'cara' ? 1 : 0 }, 0);
      tl.set('#ventana', { autoAlpha: ini === 'motion' ? 1 : 0 }, 0);
    } else tl.set('#yo-wrap', pose(ini), 0);
    tl.set('#escenario', { opacity: conEscenario(ini) ? 1 : 0 }, 0);
    tl.set('#halo-cara', { opacity: !VENT && ini === 'cara' ? 1 : 0 }, 0);
    tl.set('#halo-motion', { opacity: !VENT && ini === 'motion' ? 1 : 0 }, 0);
    // la toma real: entra con un empuje corto (corte de cámara) y sale de golpe a lo que sigue
    // gancho con su toma real: la recortada se esconde debajo y la capa se funde al pasar a lo que sigue
    const G = todas.find(e => e.golpe_real);
    if (G) {
      tl.set('#yo-wrap', { autoAlpha: 0 }, 0);
      tl.set('#yo-wrap', { autoAlpha: 1 }, Math.max(0, G.hasta - 0.3));
      tl.to('#golpe-real', { autoAlpha: 0, duration: 0.25, ease: 'power1.in' }, Math.max(0, G.hasta - 0.2));
      tl.set('#halo-cara', { opacity: 0 }, 0);
    }
    reales.forEach(e => {
      tl.fromTo('#real-wrap', { autoAlpha: 0, scale: 1.06 }, { autoAlpha: 1, scale: 1, duration: e.desde < 0.05 ? 0.001 : 0.22, ease: 'power2.out', immediateRender: false }, Math.max(0, e.desde - 0.08));
      tl.to('#real-wrap', { autoAlpha: 0, duration: 0.18, ease: 'power1.in' }, Math.max(0, e.hasta - 0.1));
    });
    const bordes = [];
    todas.forEach(e => { bordes.push(e.desde, e.hasta); });
    const cambios = [...new Set(bordes)].filter(t => t > 0.05 && t < DUR - 0.05).sort((a, b) => a - b)
      .filter(t => modoEn(t - 0.01) !== modoEn(t + 0.01));
    cambios.forEach(t => {
      const m = modoEn(t + 0.01), a = Math.max(0, t - T * 0.45), on = conEscenario(m);
      if (conEscenario(modoEn(t - 0.01)) !== on)
        tl.to('#escenario', { opacity: on ? 1 : 0, duration: on ? 0.4 : 0.3, ease: 'power2.inOut' }, on ? a + 0.12 : a);
      if (VENT) {   // la cara se va y la ventana sube desde abajo; al volver, la cara entra con un leve empuje
        const b = Math.max(0, t - 0.12);
        if (m === 'motion') {
          tl.to('#cara-wrap', { autoAlpha: 0, duration: 0.14, ease: 'power1.in' }, b);
          tl.fromTo('#ventana', { autoAlpha: 0, y: 170 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: 'power3.out', immediateRender: false }, b);
        } else {
          tl.to('#ventana', { autoAlpha: 0, y: 70, duration: 0.16, ease: 'power1.in' }, b);
          tl.fromTo('#cara-wrap', { autoAlpha: 0, scale: 1.07 }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: 'power2.out', immediateRender: false }, b);
        }
        return;
      }
      // a la toma real se llega con un corte: la persona recortada ya espera en pose de cara debajo
      if (m === 'real') tl.set('#yo-wrap', pose(m), t);
      else if (modoEn(t - 0.01) === 'real') tl.set('#yo-wrap', pose(m), t - 0.12);
      else tl.to('#yo-wrap', { ...pose(m), duration: T, ease: 'power2.inOut' }, a);
      tl.to('#halo-cara', { opacity: m === 'cara' ? 1 : 0, duration: T }, a);
      tl.to('#halo-motion', { opacity: m === 'motion' ? 1 : 0, duration: T }, a);
    });

    // Saltos del corte fino: en cada unión el encuadre alterna entre normal y un poco más cerrado (punch-in),
    // así el salto se lee como cambio de plano y no como un brinco. No se aplica si la unión cae en un cambio de modo.
    const Z = P.zoom_corte || 1.08, sil = P.silueta || { cx: 540, cy: 540 };
    gsap.set('.zoom-corte', { transformOrigin: sil.cx + 'px ' + (sil.cy + 220) + 'px' });
    let zin = false;
    (P.cortes || []).filter(t => t > 0.1 && t < DUR - 0.1 && !cambios.some(c => Math.abs(c - t) < 0.5)).sort((a, b) => a - b).forEach(t => {
      zin = !zin; tl.set('.zoom-corte', { scale: zin ? Z : 1 }, t);
    });
    cambios.forEach(t => { if (zin) { zin = false; tl.set('.zoom-corte', { scale: 1 }, t); } });

    // ── 2. ESCENAS + TÍTULO TECLEADO ──
    const SLOTS = { centro: [540, 800], arriba: [540, 700], abajo: [540, 1040], izq: [290, 800], der: [790, 800], completo: [540, 1010],
                    'arriba-izq': [300, 700], 'arriba-der': [780, 700], 'abajo-izq': [300, 1040], 'abajo-der': [780, 1040] };
    const raiz = document.getElementById('escenario');
    let tituloPrevio = null;

    const CAJAS = [], FLECHAS = [];   // revisión de layout (ver revisarLayout)
    const revisarLayout = () => {
      const av = [], M = 36;
      CAJAS.forEach(c => {
        const q = `escena ${c.esc} (${c.tipo}, ${c.en.toFixed(1)}–${c.hasta.toFixed(1)} s)`;
        if (c.x0 < M || c.x1 > 1080 - M) av.push(`${q}: se sale por los costados (${Math.round(c.x0)}–${Math.round(c.x1)} px)`);
        if (c.techo && c.y0 < c.techo + 10) av.push(`${q}: pisa el título (empieza en ${Math.round(c.y0)} px, el título baja hasta ${Math.round(c.techo)})`);
        if (c.y1 > c.piso) av.push(`${q}: pisa el subtítulo o la persona (termina en ${Math.round(c.y1)} px, límite ${Math.round(c.piso)})`);
      });
      CAJAS.forEach((a, i) => CAJAS.slice(i + 1).forEach(b => {
        if (a.esc !== b.esc || a.hasta <= b.en + 0.3 || b.hasta <= a.en + 0.3) return;   // no conviven en pantalla
        const ix = Math.min(a.x1, b.x1) - Math.max(a.x0, b.x0), iy = Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0);
        if (ix > 20 && iy > 20) av.push(`escena ${a.esc}: ${a.tipo} y ${b.tipo} se encima ${Math.round(ix)}×${Math.round(iy)} px mientras conviven`);
      }));
      FLECHAS.forEach(f => CAJAS.forEach(c => {
        if (c.esc !== f.esc || c.hasta <= f.en + 0.2 || f.hasta <= c.en + 0.2) return;
        const ix = Math.min(f.x1, c.x1) - Math.max(f.x0, c.x0), iy = Math.min(f.y1, c.y1) - Math.max(f.y0, c.y0);
        if (ix > 25 && iy > 25) av.push(`escena ${f.esc}: la flecha cruza ${c.tipo} (${Math.round(ix)}×${Math.round(iy)} px)`);
      }));
      window.__layout = av; window.__cajas = CAJAS;
      av.forEach(t => console.warn('[layout] ' + t));
    };
    const armarEscenas = () => escenas.forEach((E, ei) => {
      const el = $('div', 'escena'); el.id = 'esc' + ei; raiz.appendChild(el);
      // ¿la escena de antes / la de después está pegada a esta (motion → motion, sin cara de por medio)?
      const pegadaAntes = ei > 0 && Math.abs(escenas[ei - 1].hasta - E.desde) < 0.3;
      const pegadaDespues = ei < escenas.length - 1 && Math.abs(escenas[ei + 1].desde - E.hasta) < 0.3;
      tl.set(el, { autoAlpha: 1 }, E.desde);
      if (pegadaDespues) {   // sale con movimiento, nunca desaparece de golpe
        tl.to(el, { autoAlpha: 0, y: -50, scale: 0.96, duration: SALIDA, ease: 'power2.in' }, E.hasta - 0.08);
      } else tl.set(el, { autoAlpha: 0 }, Math.min(E.hasta + T * 0.6, DUR));

      let bordeTit = 0;   // dónde termina el título: ninguna pieza puede subir más arriba (19-oct: superposiciones)
      let dibujarFlecha = null, primera = null;   // la flecha se dibuja después de medir la primera pieza
      // el gancho (escena del cuadro 0) va con título GOLPE salvo "estilo": "bloque"; cualquier otra escena puede pedirlo
      const golpe = E.titulo && (E.titulo.estilo === 'golpe' || (E.desde < 0.05 && E.titulo.estilo !== 'bloque'));
      if (golpe) {
        const tt = E.titulo, lineas = [tt.l1, tt.l2].filter(Boolean), gi = Math.min(tt.grande || 0, lineas.length - 1);
        const COL = { rojo: ['#ffb1a6', '#ff3b2e', '#c30d07', '#6e0402', 'rgba(255,45,30,.75)'],
                      verde: ['#d6ffc9', '#3ee86a', '#0e9a35', '#06501a', 'rgba(60,230,100,.7)'],
                      amarillo: ['#fff6bf', '#ffd630', '#f09d00', '#7a4c00', 'rgba(255,200,40,.7)'] };
        const hx = tt.color && tt.color[0] === '#' ? tt.color : null;
        const cc = hx ? [`color-mix(in srgb, ${hx} 35%, #fff)`, hx, `color-mix(in srgb, ${hx} 75%, #000)`, `color-mix(in srgb, ${hx} 40%, #000)`, `color-mix(in srgb, ${hx} 70%, transparent)`]
                      : COL[tt.color] || COL.amarillo;
        const tit = $('div', 'titulo golpe'); el.appendChild(tit);
        ['--c1', '--c2', '--c3', '--c4', '--brillo'].forEach((k, i) => tit.style.setProperty(k, cc[i]));
        let ico = null;
        if (tt.icono) { ico = $('img', 'ico'); ico.src = tt.icono; if (tt.icono_alto) tit.style.setProperty('--ih', tt.icono_alto + 'px'); tit.appendChild(ico); }
        const ls = lineas.map((txt, li) => { const l = $('span', li === gi ? 'g' : 'ch' + (tt.chica === 'serif' ? ' serif' : ''), esc(txt)); tit.appendChild(l); return l; });
        // tamaños: la grande llena el ancho (hasta 210 px), la chica hasta 88 px
        const anchoEm = (s, may) => [...s].reduce((a, ch) => a + (ch === ' ' ? 0.28 : may || (ch === ch.toUpperCase() && ch !== ch.toLowerCase()) ? 0.74 : 0.56), 0);
        const fLetra = { condensada: 0.68, serif: 0.9 }[tt.letra || 'condensada'] || 1;   // la condensada ocupa ~2/3 del ancho
        const fg = Math.min(210, Math.floor(980 / Math.max(1, anchoEm(lineas[gi], true) * fLetra)));
        const chicas = lineas.filter((_, i) => i !== gi);
        const fc = Math.min(88, ...chicas.map(s => Math.floor(960 / Math.max(1, anchoEm(s) * (tt.chica === 'serif' ? 1.15 : 1)))));
        tit.style.setProperty('--fg', fg + 'px'); tit.style.setProperty('--fc', fc + 'px');
        if (tt.y != null) tit.style.setProperty('--gy', tt.y + 'px');

        // sin flecha: el golpe ya apunta solo y la flecha dorada le quitaba fuerza
      } else if (E.titulo) {

        const tit = $('div', 'titulo'); el.appendChild(tit);
        const chars = [];
        let caja = null, cajaDesde = 0;

        // sin l2, el bloque va en la línea 1; la clave ya no cambia de letra (solo marca los subtítulos)

        const fc = caja && caja.querySelector('.fc');

      (E.piezas || []).forEach((pz, pi) => {

      // html a la medida; [data-en="s"] entra en ese segundo (pop) y [data-traza="s"] (path de svg) se dibuja en ese segundo
      html(inn, o) { inn.innerHTML = o.html;
        inn.querySelectorAll('[data-en]').forEach(el => tl.fromTo(el, { autoAlpha: 0, scale: 0.85 }, { autoAlpha: 1, scale: 1, duration: 0.32, ease: 'power2.out', immediateRender: true }, parseFloat(el.dataset.en)));
        inn.querySelectorAll('[data-traza]').forEach(el => trazo(el, parseFloat(el.dataset.traza), 0.35)); }
    };
    armarEscenas();
    revisarLayout();

    // ── 4. SUBTÍTULOS: 1–2 palabras; las palabras clave en dorado, misma sans ──
    const limpia = s => s.replace(/^[\s"“”¿¡(]+|[\s"“”.,;:!?)…]+$/g, '');
    const norma = s => limpia(s).toLowerCase();
    // marca las palabras que forman una clave (una palabra o una frase: «tres líneas»)
    const grupo = new Array(W.length).fill(-1);
    (P.claves || []).forEach((c, ci) => {
      const ws = c.toLowerCase().split(/\s+/).filter(Boolean);
      for (let i = 0; i + ws.length <= W.length; i++) {
        if (ws.every((w, j) => norma(W[i + j].word || W[i + j].text || '') === w) && grupo.slice(i, i + ws.length).every(g => g < 0))
          for (let j = 0; j < ws.length; j++) grupo[i + j] = ci * 1000 + i;
      }
    });
    const trozos = [];
    for (let i = 0; i < W.length; i++) {
      const a = W[i], t = limpia(a.word || a.text || ''); if (!t) continue;
      if (grupo[i] >= 0) {   // la clave entera, junta
        let j = i; while (j + 1 < W.length && grupo[j + 1] === grupo[i]) j++;
        trozos.push({ txt: W.slice(i, j + 1).map(x => limpia(x.word || x.text || '')).join(' '), ini: a.start, fin: W[j].end, clave: true });
        i = j; continue;
      }
      const b = W[i + 1], tb = b ? limpia(b.word || b.text || '') : '';
      if (b && tb && grupo[i + 1] < 0 && (t + ' ' + tb).length <= 11 && b.start - a.end < 0.15 && /[\wáéíóúñ]$/i.test((a.word || '').trim())) {
        trozos.push({ txt: t + ' ' + tb, ini: a.start, fin: b.end, clave: false }); i++;
      } else trozos.push({ txt: t, ini: a.start, fin: a.end, clave: false });
    }
    const subs = document.getElementById('subs');
    trozos.forEach((k, i) => {
      const nx = trozos[i + 1];
      const fin = nx ? Math.min(nx.ini, k.fin + 0.6) : Math.min(DUR, k.fin + 0.6);
      const d = $('div', 'sub' + (k.clave ? ' clave' : ''), `<span>${esc(k.txt)}</span>`);
      const mk = modoEn(k.ini);
      d.style.top = (mk === 'golpe' ? (P.sub_y_golpe || 1660) : mk === 'motion' ? P.sub_y_motion : mk === 'completa' ? P.sub_y_completa : P.sub_y_cara) + 'px';
      subs.appendChild(d);
      tl.set(d, { autoAlpha: 1 }, k.ini);
      tl.set(d, { autoAlpha: 0 }, Math.max(k.ini + 0.08, fin));
    });

    if (P.firma) document.getElementById('firma').textContent = P.firma;

    tl.set({}, {}, DUR);
    window.__timelines = window.__timelines || {};
    window.__timelines['reel'] = tl;
  })();
  </script>
</div>
</body>
